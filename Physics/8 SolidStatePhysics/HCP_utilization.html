<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>HCP Schematic</title>
<style>
        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        svg {
            /* Scaled by height: the figure fills the frame height (the frame aspect comes from the viewBox);
               any leftover space on the left and right is simply empty margin */
            height: 100%;
            width: auto;
            max-width: 100%;
        }
        .line-solid {
            stroke: #ff9d47;
            stroke-width: 2.5;
            fill: none;
        }
        .line-dashed {
            stroke: #ff9d47;
            stroke-width: 2.5;
            stroke-dasharray: 8, 8;
            fill: none;
        }
        .label {
            fill: #ff9d47;
            font-family: Arial, sans-serif;
            font-size: 28px;
            font-style: italic;
        }
</style>
</head>
<body>
<!-- 3:1 canvas (1350 × 450): left column = layered stacking (with the Up / Middle / Lower legend),
     right column = geometric relations. The two columns sit **side by side** and are centered vertically;
     about 233 units of margin left and right and about 38 units top and bottom, so the two columns
     together land exactly in the center -->
<svg viewBox="-184 2.5 1350 450" xmlns="http://www.w3.org/2000/svg"
     aria-label="Schematic of hexagonal close packing (HCP)">

  <!-- ===== Left column: layered stacking in HCP ===== -->
  <g fill="none" stroke-linecap="round">
    <!-- T layer: red circles -->
    <g stroke="#ff1111" stroke-width="7">
      <circle cx="187" cy="111" r="67"/>
      <circle cx="321" cy="111" r="67"/>
      <circle cx="120" cy="228" r="67"/>
      <circle cx="254" cy="228" r="67"/>
      <circle cx="388" cy="228" r="67"/>
      <circle cx="187" cy="344" r="67"/>
      <circle cx="321" cy="344" r="67"/>
    </g>

    <!-- P layer: green circles -->
    <g stroke="#00ff12" stroke-width="7">
      <circle cx="254" cy="155" r="67"/>
      <circle cx="187" cy="271" r="67"/>
      <circle cx="321" cy="271" r="67"/>
    </g>
  </g>

  <!-- Layer legend -->
  <g font-size="31" font-family="Arial, sans-serif">
    <line x1="490" y1="83" x2="527" y2="83" stroke="#1717ff" stroke-width="7" stroke-linecap="round"/>
    <text x="545" y="92" fill="#1717ff">Up</text>

    <line x1="490" y1="139" x2="527" y2="139" stroke="#00ff12" stroke-width="7" stroke-linecap="round"/>
    <text x="545" y="148" fill="#00ff12">Middle</text>

    <line x1="490" y1="193" x2="527" y2="193" stroke="#ff1111" stroke-width="7" stroke-linecap="round"/>
    <text x="545" y="203" fill="#ff1111">Lower</text>
  </g>

  <!-- ===== Right column: geometric relations =====
       This column used to be drawn below-right of the stacking figure (stacked vertically); it has now been
       moved to the right of it as a side-by-side column: **shifted right by 280 and up by 256**.
       Both groups (lines + labels) share the same translation, so changing the layout means changing both. -->
  <g transform="translate(280 -256)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="581" cy="370" r="68" stroke="#1717ff" stroke-width="7"/>
    <circle cx="500" cy="482" r="68" stroke="#00ff12" stroke-width="7"/>
    <circle cx="581" cy="597" r="68" stroke="#ff1111" stroke-width="7"/>

    <path d="M500 482 L500 597 L581 597 Z"
          stroke="#ff8a00" stroke-width="6"/>
    <path d="M500 482 L581 597"
          stroke="#ff8a00" stroke-width="6"/>
    <path d="M500 482 L500 597"
          stroke="#ff8a00" stroke-width="6"/>
    <path d="M455 597 L581 597"
          stroke="#ff8a00" stroke-width="6"/>
    <path d="M500 582 L515 582 L515 597"
          stroke="#ff8a00" stroke-width="4"/>
    <!-- Dimension marker (cyan): same length as OB (O(500,597) → B(581,597), 81 units) -->
    <path d="M500 596 L500 605 M500 605 L581 605 M581 596 L581 605"
          stroke="#00ffff" stroke-width="2"/>
  </g>

  <!-- Geometry labels -->
  <g transform="translate(280 -256)" fill="#ff8a00" font-family="Arial, 'Microsoft YaHei', sans-serif">
    <text x="496" y="474" font-size="27" font-style="italic">A</text>
    <text x="590" y="609" font-size="27" font-style="italic">B</text>
    <text x="491" y="630" font-size="26" font-style="italic">O</text>
    <text x="430" y="608" font-size="26" font-style="italic">F</text>
