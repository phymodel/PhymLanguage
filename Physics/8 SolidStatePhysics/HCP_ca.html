<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Geometric Diagram</title>
    <style>
        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        svg {
            /* Scaled by height: the figure fills the frame height (the frame aspect comes from the viewBox);
               any leftover space on the left and right is simply empty margin */
            height: 100%;
            width: auto;
            max-width: 100%;
        }
        .line-solid {
            stroke: #ff9d47; /* orange solid line */
            stroke-width: 2.5;
            fill: none;
        }
        .line-dashed {
            stroke: #ff9d47; /* orange dashed line */
            stroke-width: 2.5;
            stroke-dasharray: 8, 8; /* dash pattern */
            fill: none;
        }
        .label {
            fill: #ff9d47; /* orange text */
            font-family: Arial, sans-serif;
            font-size: 28px;
            font-style: italic; /* italic, for a hand-drawn look */
        }
    </style>
</head>
<body>

  <!-- 3:1 canvas: 512.5 units of margin on each side and about 20 units top and bottom,
       so the figure lands exactly in the center -->
  <svg viewBox="-512.5 -20 1500 500" xmlns="http://www.w3.org/2000/svg">

    <g>

      <!-- Solid lines: triangle ABC -->
      <polygon points="250,60 100,400 400,400" class="line-solid" />

      <!-- Dashed lines: internal construction lines -->
      <g class="line-dashed">
        <line x1="250" y1="60" x2="250" y2="355" />
        <!-- B–O–F are collinear, so they are merged into a single dashed line (O and F are points on it) -->
        <line x1="100" y1="400" x2="340" y2="328" />
        <line x1="100" y1="400" x2="300" y2="280" />
        <line x1="250" y1="60" x2="300" y2="280" />
        <line x1="300" y1="280" x2="400" y2="400" />
      </g>

      <!-- Text labels -->
      <g class="label">
        <text x="240" y="45">A</text>
        <text x="75" y="435">B</text>
        <text x="390" y="435">C</text>

        <text x="260" y="382">O</text>

        <text x="270" y="275">D</text>
        <text x="335" y="320">F</text>
      </g>

    </g>

  </svg>

</body>
</html>
