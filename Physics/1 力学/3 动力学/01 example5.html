<title>贴有标尺的瓷砖斜面（倾角 α）上小铜块下滑的五段位移 s₁～s₅</title>
<style>
  /* 图框口径：与同目录 `01 example1.html`／`01 example2.html`／`01 example3.html`／
     `01 example4.html`、`11 example1-1.html`、`1 运动学/09 example1.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是黑底金线，**不照抄那个底色**，
       只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例（须落在 0.2–5 之间）。本题图是
       「一条长斜面 + 一条桌面」的横长构图（图元占 x = 58 → 660、y = 32 → 291），故 viewBox 取
       690 × 305（比例 ≈ 2.26），四周留白只写在 viewBox 里，不碰任何图元坐标。
     · 配色（三色分工，别再加第四种）：
         桌面 + 瓷砖斜面 + s₁～s₅ 的引出线 ...... #ffb900（同 `01 example1.html` 的「桌面」、
                                                     `1 运动学/02 DisplacementImage.html` 的
                                                     「刻度/引线」口径：金 = 不动的装置与它的标注）
         小铜块 .................................. #075bff（同 example1 的「物块 P」那支可动件的蓝）
         s₁～s₅ 的五段尺寸线与记号 ............... #00eaff（同 example1 的 a-m 图线：青 = 由测量/
                                                     解析得出来的结果，不是装置本身）
       也就是说：**金线只负责指位置（虚线引出，不碰板），青线才是量出来的位移** —— 这两件事在本题里
       必须分开看：引出线是装置侧的标注（谁都能画），s₁～s₅ 是「连续相等时间间隔内」这个条件下才成立
       的测量结果。五个 s 之间只隔六根引出线，线一实，第一眼读到的是六根横杠而不是五个 s，所以用虚线。
       记号跟自己的图元同色，是 example3 定下的规矩；α 的弧与记号跟装置同色（几何标注）。
     · 字体：s₁～s₅、α 是题面里的记号，走 Georgia 斜体（与本仓 `.part-label` 一致）；
       「瓷砖」「小铜块」是装置名（汉字，不是变量），走汉字字体栈 + 正体 ——
       Georgia 没有汉字，不换栈会掉字（同 `01 example2.html` 的 `.body-label`）。
       下标数字走 Times New Roman 正体：Georgia 的数字是**旧式数字**（3 4 5 7 9 带降部），
       写成 s₃ / s₄ 会看着掉到基线以下，等高的 Times 数字没有这个毛病
       （同 `1 运动学/02 DisplacementImage.html` 里 `.tick-num` 那段注释）。 */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 桌面的主视棱：一根粗实线 */
  .table {
    fill: none;
    stroke: #ffb900;
    stroke-width: 4.2;
    stroke-linecap: round;
  }
  /* 桌面斜线：粗面记号，细一号，不跟主视棱抢 */
  .hatch {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.2;
    stroke-linecap: round;
  }
  /* 瓷砖：本题的斜面本体，一身金（它不动，是装置） */
  .tile {
    fill: none;
    stroke: #ffb900;
    stroke-width: 3.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* s₁～s₅ 的引出线：六道，垂直于尺面，沿法向自「离尺面 16」引到「离尺面 54」（长 38）。
     两根线之间量一段位移，所以它们必须与尺寸线严格垂直相交、且延长线正好过位置点 P₀…P₅。
       · **虚线** —— 它们是标注的引出线，不是板上的实物线条。实线会跟瓷砖那条棱、桌面抢重量：
         五个 s 只隔六根线，线一实，第一眼读到的是六根横杠而不是五个 s。
       · **不碰瓷砖** —— 起点离尺面 16（板的上表面描边只到 ±1.8）：线下端与板之间留着一小段空档，
         看得出是「从板面引出来的标注」而不是板上的刻痕；位置仍由这条线的延长线指认，没有歧义。 */
  .ruler {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-dasharray: 7 6;
    stroke-linecap: round;
  }
  /* s₁～s₅ 的尺寸线：青。两端带箭头，标的就是「相邻两条引出线之间」 */
  .dim {
    fill: none;
    stroke: #00eaff;
    stroke-width: 2.2;
    stroke-linecap: round;
  }
  /* 小铜块：可动件，深蓝 */
  .block {
    fill: none;
    stroke: #075bff;
    stroke-width: 3.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 夹角 α 的弧：几何标注，细一号 */
  .angle-arc {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  /* 位移记号 s₁～s₅：变量走斜体 */
  .dim-label {
    fill: #00eaff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 26px;
  }
  /* 下标数字 / 单位：正体 + 等高数字 */
  .up {
    font-style: normal;
    font-family: "Times New Roman", Georgia, serif;
  }
  /* 夹角记号 α */
  .angle-name {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 28px;
  }
  /* 装置名（汉字，不是变量）：正体，与自己那件图元同色 */
  .device {
    font-family: -apple-system, "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif;
    font-style: normal;
    font-size: 26px;
  }
  .device-tile {
    fill: #ffb900;
  }
  .device-block {
    fill: #075bff;
  }
  /* 装置名的引线：细，且与自己的字同色，不与图元抢 */
  .leader-tile {
    fill: none;
    stroke: #ffb900;
    stroke-width: 1.8;
    stroke-linecap: round;
  }
  .leader-block {
    fill: none;
    stroke: #075bff;
    stroke-width: 1.8;
    stroke-linecap: round;
  }
</style>

<!-- 配 `01 牛顿第二定律.md` 的「真题 5」（2021 全国甲卷第 3-22 题）：
     把贴有标尺的瓷砖一端放在水平桌面上，形成倾角 α 的斜面（sin α = 0.34、cos α = 0.94）；
     小铜块沿斜面加速下滑。手机拍下全过程、解析视频，得到 **5 个连续相等时间间隔**（ΔT = 0.20 s）
     内铜块沿斜面下滑的距离 s₁～s₅，用逐差法求 a、再由 mg sin α − μmg cos α = ma 求 μ。
     本图画的就是「六个记录位置用虚线引出、五段位移挂在这六根引出线之间」这一件装置，以及它给出的那五个量。

     装置的几何口径（1 单位 ≈ 1 画面点，1 cm ≈ 8.17 单位，沿板量）：
       · 倾角        严格按题面的 sin α = 0.34 / cos α = 0.94 画，即 α = 19.9°，斜率 0.34/0.94 = 0.362。
                     不照原题图那种更陡的手感 —— 题面给了三角函数值，图就得跟数据对得上。
       · 尺面（板的**上表面**）  过 P₀(150,100)，方向 u = (0.94, 0.34)（向右下去就是下滑方向）；
                     板的法向 n = (0.34, −0.94) 指**上**（铜块踩的那一面），−n 指下（板身）。
       · 六个位置与六道引出线    P₀…P₅ 就是「t = 0, ΔT, 2ΔT, …, 5ΔT」这六个时刻铜块的位置，沿 u 累加：
                     P₀(150.0,100.0) P₁(195.1,116.3) P₂(253.3,137.4) P₃(324.8,163.2)
                     P₄(409.4,193.8) P₅(507.3,229.2)
                     每个位置沿 +n 引一道**虚线**（离尺面 16 → 54，不碰板）；位置点本身不画点、不画叉，
                     只靠这道线的延长线指认。
                     段长 47.96 / 61.93 / 76.06 / 90.03 / 104.09 = 5.87 / 7.58 / 9.31 / 11.02 / 12.74 cm
                     × 8.17 单位/cm —— **比例是真按表里的数画的**，所以图上「后一段总比前一段长一点点」
                     看得见、量得着；每段比前一段长 aΔT² = 1.717 cm ≈ 14.0 单位，五段增量一致
                     （13.97 / 14.13 / 13.97 / 14.06），这正是逐差法成立的样子，改图时要维持这个对应。
       · 第一道引出线**不在板的顶端**：板的上端还多留了 70 单位（Ut(84.2,76.2)）才到顶。
                     为什么？因为 s₁ = 5.87 cm 远大于「从静止起第一段」的 ½aΔT² = 0.86 cm ——
                     录像开始记时的时候铜块早就动起来了（v₀ ≈ 0.25 m/s），P₀ 只是记时的起点，
                     **不是释放点**。板上端留出一截，图上就不会被人读成「从顶端静止释放」。
       · 板下端      就收在 P₅：板身画到最后一个记录位置为止，**板的端面（那一刻垂直于尺面的那道面）
                     与 P₅ 的引出线共线** —— 从板头往上看，端面 + 16 的空档 + 虚线是一条线，
                     所以 s₅ 正好量到板头，不会剩下一截「没被标注盖住」的板头去暗示还有第六段。
                     下表面与桌面的交点 Eb(501.9,244.2) 就是板的下端角，也是 α 的顶点。
                     上端悬空 —— 题面只说「一端放在水平桌面上」，没交代谁托着另一端，
                     图上也就不替它编一个支架出来（原题图同样留白）。
       · 桌面        主视棱 y = 244.2（板的下端角就压在它上面），x = 60 → 660；
                     桌下 14 道斜线（间距 44，向下左斜 16 × 26）。
       · 铜块        边长 22 的方块，量纲上约 2.7 cm，骑在尺面上。写法同 `01 example4.html`：
                     `translate(P₀) rotate(19.885)` 先把原点搬到 P₀、再绕**这个原点**转到与尺面贴合，
                     于是局部 +x 沿下滑方向、局部 +y 扎进板身，rect 的 y = −22 那一面就贴着尺面；
                     **rect 的 x 就是「方块上游面 → P₀」的距离**，本版 x = 9（方块占 s = 9…31，
                     落在 s₁ 这一段里，两头都不碰 P₀ / P₁ 的引出线）。
                     方块画在哪一段并不携带信息（它只是「在这条板上加速下滑」的位置示意），
                     真正带信息的是那六道引出线；把它压到 P₀ 上反而会把 P₀ 那道线糊掉，
                     题图原稿也是把它挪开一点画的。
       · α           顶点 Eb(501.9,244.2) = 板的下端角 = 下表面与桌面的交点；r = 80：
                     起点 (421.9,244.2) 落在桌面上、终点 (426.7,217.0) 落在板的下表面上，扫过 19.9°。
                     **顶点只能取在下表面这一侧** —— 角在「板的下表面 + 桌面」围成的那个楔形里；
                     若拿下表面延长到桌面的另一个交点当顶点，弧会有一小段钻进板身。
                     20° 的楔形很窄，α 的字(28px，高约 15)放不进弧边上，所以顺着角平分线推到半径 150 处
                     (354.2,218.2 的字心)：那里楔形上下各留出约 20 / 19 单位，字既不压板下表面也不压桌面。

     图上没有画、也**不该**画的东西：
       · 不画力的箭头（重力沿板分量、摩擦力、支持力）：本题的判读点全在「五个连续相等时间间隔的
         位移差」上，一堆箭头会让人以为要现场受力分析；题面也只给了装置和一张数据表。
       · 不标 μ、a、g 的数值，也不标 ΔT = 0.20 s：它们都是「待求 / 已知的文字条件」，
         写进图里就成了图给的已知量。图上只有 s₁～s₅ 这五个量的记号，数值在题面的表格里。
       · 不画速度/加速度箭头，也不画「P₀ 是 t = 0」的时刻标注：刻线本身只说「位置」，时刻信息在表格里。

     判读用的定量关系（写在这里方便以后改图时对账，图上不出现）：
       · 逐差法：a = [(s₄+s₅) − (s₂+s₃)] / (2ΔT)² = [(11.02+12.74) − (7.58+9.31)]×10⁻² / 0.16
         ≈ 0.43 m/s²。 · μ = (sin α − a/g) / cos α = (0.34 − 0.0438) / 0.94 ≈ 0.32。 -->

  <!-- ═══════════════════ 小铜块 ═══════════════════ -->
  <!-- translate(P₀) rotate(19.885)：局部 +x 沿下滑方向、+y 扎进板身，rect 的 y = −22 那一面贴着尺面；
       rect 的 x = 9 就是「方块上游面 → P₀ 的沿板距离」（单位与 s_i 同一把尺）。
       只挪位置就改这一个 x，别动 y（y 一非 0，方块就离开尺面）。
       注意**不能**写成 rotate(19.885 150 100)：那个 (150,100) 是父坐标系的点，而 rect 的局部坐标在原点
       附近，绕它一转方块会被甩到别处去（example4 踩过这个坑）。 -->
  <g transform="translate(150 100) rotate(19.885)">
    <rect class="block" x="9" y="-25" width="22" height="22" rx="1"/>
  </g>

  <!-- ═══════════════════ 夹角 α ═══════════════════ -->
  <!-- 顶点 Eb(501.9,244.2) = 板的下端角 = 板的下表面与桌面的交点；r = 80，从桌面 (421.9,244.2)
       扫到板的下表面 (426.7,217.0)。顶点只能取在下表面这一侧，否则弧会钻进板身。 -->
  <path class="angle-arc" d="M421.9 244.2 A80 80 0 0 1 426.7 217.0"/>
  <!-- α 的字顺着角平分线推到半径 150 处：20° 的楔形在弧边只有 27 单位宽，字放不下（见文件头注释） -->
  <text class="angle-name" x="354" y="225.5" text-anchor="middle">α</text>

  <!-- ═══════════════════ 装置名 ═══════════════════ -->
  <!-- 瓷砖：写在板下的空档里，引线自上而下落到板的下表面 (320,178.4) -->
  <text class="device device-tile" x="240" y="205">瓷砖</text>
  <path class="leader-tile" d="M296 197 L320 178.4"/>

  <!-- 小铜块：写在板顶上游侧的空档里，引线落到方块的左上角 (165.9,82.4) 附近。
       不写在方块正上方：那里已经被 P₀ 的引出线和 s₁ 的尺寸线占满。 -->
  <text class="device device-block" x="136" y="52" text-anchor="end">小铜块</text>
  <path class="leader-block" d="M140 44 L163 79"/>
