<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>电梯内的弹簧测力计（示数指针与读数放大图）</title>
<style>
  /* 图框口径：与同目录 `01 example1.html`～`01 example7.html`、`11 example1-1.html`、
     `1 力学/1 运动学/09 example1.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。原稿是黑底的发光线稿，**不照抄那个底色**，
       只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例（须落在 0.2–5 之间）。
       本题图是「一台竖着的测力计 + 右上方一块读数放大图」，图元占
       x = 138 → 980（测力计外壳左边 138、放大镜椭圆右边 980）、y = 49 → 730（挂环顶到物块底），
       本身近方（842 × 681 ≈ 1.24），而本仓讲义里的图都在 1.4 上下；故 viewBox 取 1156 × 797
       （比例 = 1.450，与 `01 example6-1.html` 的 1.398 同一档）：
       x 从 −19 到 1137（左右各留 157 / 157），y 从 −9 到 788（上下各留 58 / 58）。
       图元形心 (559, 389.5) 与 viewBox 的中心 (559, 389.5) 完全重合。
       想让图再小一点就继续加宽 viewBox（留白只写在 viewBox 里，不碰任何图元坐标），
       注意别超过 5 的比例上限 —— 高 797 时 viewBox 宽最多 3985。
     · 配色（三色，别再加第四种）：
         测力计外壳 / 挂环 / 刻度线与刻度值 / 单位 N / 挂钩 / 所挂物块 ...... #075bff（深蓝，
                                                        同 `01 example1.html` 的「物块 P」、
                                                        `01 example7.html` 的「车」：图上的
                                                        实体一律深蓝、空心线稿）
         指针（主图 + 放大图里的同一根）.................................... #00eaff（青色）。
                                                        本仓这支青色的语义是「由测量 / 解析得来的量」
                                                        （example1 的 a–m 图线、example5 的 s₁～s₅、
                                                        example7 的 x–v 曲线）；本题里「读数落在哪个
                                                        刻度上」正是唯一的被测之量，指针与它同色。
         放大镜椭圆框 + 从指针引到椭圆的引线............................... #ffb900（金色），
                                                        同 `01 example4.html` 的「夹角 θ 的弧」、
                                                        example7 的「尺寸线与刻度」：说明性的尺规
                                                        一律走金，不与实体线抢。
     · 字体：刻度值与单位 N 一律**正体**（Times New Roman 等高数字，同 example7 的 `.tick-num`）；
       本图没有物理量记号，故不引 Georgia 斜体那一档。
     ★ **图上不许写出读数** —— 本题问的就是「读数为 ___ N」，把 5.0 印在图上等于把答案印在图上。
       放大图里只给 4 与 6 两个数、指针正好落在它们正中，读数由学生自己认。 */
  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 实体（外壳、挂环、挂钩、物块）：一支空心线稿的深蓝 */
  .device {
    fill: none;
    stroke: #075bff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 刻度板中央的竖线：一根干净的直线，细分刻度只在它两侧生长、不穿过它 */
  .scale-line {
    fill: none;
    stroke: #075bff;
    stroke-width: 3;
    stroke-linecap: round;
  }
  /* 带数字的刻度（长）、0.5 N 一格的细分刻度（短） */
  .tick-long {
    fill: none;
    stroke: #075bff;
    stroke-width: 3;
    stroke-linecap: round;
  }
  .tick-fine {
    fill: none;
    stroke: #075bff;
    stroke-width: 2.2;
    stroke-linecap: round;
  }
  /* 刻度值：正体、等高数字 */
  .num {
    fill: #075bff;
    font-family: "Times New Roman", Georgia, serif;
    font-style: normal;
    font-size: 26px;
  }
  /* 单位 N：与刻度值同一支字，字号小一号，别压住下面的 0 */
  .unit {
    fill: #075bff;
    font-family: "Times New Roman", Georgia, serif;
    font-style: normal;
    font-size: 24px;
  }
  /* 放大图里的刻度值：同一支字，因为放大图整幅放大 3.75 倍而放大字号 */
  .num-lg {
    fill: #075bff;
    font-family: "Times New Roman", Georgia, serif;
    font-style: normal;
    font-size: 36px;
  }
  /* 指针：横过刻度的一根亮线 + 正中的菱形。主图与放大图用的是同一根指针，故只有这一支样式 */
  .pointer {
    fill: none;
    stroke: #00eaff;
    stroke-width: 3.6;
    stroke-linecap: round;
  }
  .pointer-dot {
    fill: #00eaff;
    stroke: none;
  }
  /* 读数放大图：椭圆框与引线，金、空心，细一号 */
  .zoom {
    fill: none;
    stroke: #ffb900;
    stroke-width: 3.4;
  }
  .leader {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.6;
    stroke-linecap: round;
  }
</style>
</head>
<body>

<!-- 配 `02 超重和失重两公式.md` 的「真题 1」（2024 全国甲卷第 3–22 题）：弹簧测力计挂在电梯内，
     下端挂一物体。电梯静止时指针示数即物体重力（读 5.0 N）；电梯上行中示数变为 4.5 N ⇒ 失重，
     a = 1.0 m/s²。图只画「静止时的示数」这一件事，4.5 N 由题面给出，不在图上另画第二根指针。

     几何口径（1 单位 ≈ 1 画面点）：
       测力计轴心   x = 200（挂环、外壳、刻度竖线、挂钩、物块共用这一条中线）
       挂环         圆心 (200, 64)、r = 15；吊杆 (200, 79) → (200, 96)
       外壳         圆角矩形 x = 138 → 262、y = 96 → 596、rx = 18（宽 124，够放两列刻度值）
       刻度竖线     x = 200，y = 156 → 556
       ★ 量程 0–10 N ↔ y = 156 → 556，即 **1 N = 40 单位**，y(F) = 156 + 40·F。
         **分度值 0.5 N**（与题图一致：4 到 6 之间只有 4.5 / 5.0 / 5.5 三条细分刻度、四格，
         指针正压在 5.0 那一格上）⇒ 相邻两条刻度隔 20 单位，画起来不挤：
           带数字的 0 / 2 / 4 / 6 / 8 / 10：长刻度，左 x = 178→198、右 x = 202→222
           其余 0.5 N 一格（含 1 / 3 / 5 / 7 / 9 和 0.5 的奇数倍）：短刻度，左 x = 186→198、右 x = 202→214
         ★ 只有「带数字的那几格」加长 —— 题图里 1 N 的刻度和 0.5 N 的刻度一样长，
           加长的只有标了数字的 2 N 格；别自作主张给整数 N 加长，否则 4 到 6 之间会看着多出两档。
       ★ 读数为什么要放大：主图上 0.5 N 一格只有 20 单位，指甲盖大小；右侧放大图把 4 → 6 N
         放到 150 单位/N（放大 3.75 倍、一格 75 单位），指针压在哪一格上一目了然
         ⇒ 5.0 N（题问读数，图上只给 4 和 6，不给答案）。
       刻度值       0 / 2 / 4 / 6 / 8 / 10 两列对称：左列 text-anchor=end、x = 172；
                    右列 start、x = 228；基线 = 该刻度 y + 9（26 px 字的半个 x 高度，视觉居中）
       单位 N       左 (172, 124) end、右 (228, 124) start —— 在「0」之上 22 单位，且离壳顶 11 单位
       指针（主图） 亮线 y = 356（= 5 N），x = 178 → 222；菱形心 (200, 356)、半对角 11。
                    5 N 本身是一条短刻度，指针正压在它上面 ⇒ 指针与刻度是同一处，不各说各话
       挂钩         吊杆 (200, 596) → (200, 644)；钩是一个 **3/4 圆**：圆心 (200, 664)、r = 20，
                    从正上方的 (200, 644) 顺时针画 270° 到最左的 (180, 664)，
                    留下的 90° 缺口朝左上（左端 180° ↔ 顶端 270°）。吊杆尖正好接在弧的起点上 ——
                    ★ 钩必须开 1/4 圈的口：画成 330° 的整环就不像钩、像挂环了，物体挂不进去
       物块         矩形 x = 178 → 222、y = 684 → 730（44 × 46），顶边与挂钩最低点 y = 684 相切
       —— 物块顶边必须与钩底相切：留缝像「悬空的方块」，插进去像「穿在钩里的销子」，
          只有相切读得出「挂在钩上」。
       放大图       椭圆心 (760, 330)、rx = 220、ry = 210（y 向 120 → 540，与测力计高度相当）
                    刻度竖线 x = 760，y = 150 → 510
                    量程 4 → 6 N ↔ y = 180 → 480，即 **1 N = 150 单位**，y(F) = 180 + 150·(F − 4)
                    刻度：0.5 N 一条，共 5 条 —— 4 (180) / 4.5 (255) / 5 (330) / 5.5 (405) / 6 (480)；
                          带数字的 4 与 6 长（左 700→746、右 774→820），中间三条短（左 718→746、右 774→802）。
                          **4 到 6 之间只有三条细分刻度**，这是题图的原样，别按 0.2 N 去补满
                    刻度值：4 → 左 (688, 192) end、右 (832, 192) start；6 → 左 (688, 492)、右 (832, 492)
                    指针：亮线 y = 330（= 5 N）横贯整块刻度板 x = 700 → 820，菱形心 (760, 330)、半对角 15
                          落在刻度竖线上 —— 指针压的正是 4.5 与 5.5 中间那一格
       引线         从主图指针右端 (226, 356) 拉到椭圆最左 (538, 332)：两处都落在「指针所在高度」上，
                    一眼看出「放大的是这一行」

     画的时候别踩的三个坑（都改过一版）：
       ① 刻度竖线两侧的刻度长度不能超过刻度值列 —— 早先把整数刻度画到 26 长，右列数字被戳到；
       ② 放大图里不要写「5.0」：本题考的就是读数，写上就成答案；只给 4 和 6，指针落在正中；
       ③ **分度值是 0.5 N，不是 0.2 N** —— 早先按 0.2 N 画过一版，4 到 6 之间塞了 9 条刻度，
          与题图对不上（题图里就 4 / 4.5 / 5.0 / 5.5 / 6 五条）。改回去之前先数一数。 -->

<svg viewBox="-400 -9 1800 797" xmlns="http://www.w3.org/2000/svg">

  <!-- ═══════════ 左：电梯里的弹簧测力计（主图，量程 0–10 N，1 N = 40 单位） ═══════════ -->
  <g>
    <!-- 挂环 + 吊杆 -->
    <circle class="device" cx="200" cy="64" r="15"/>
    <path class="device" d="M200 79 V96"/>

    <!-- 外壳 -->
    <rect class="device" x="138" y="96" width="124" height="500" rx="18"/>

    <!-- 刻度竖线（干净的直线，两侧刻度不穿透它） -->
    <path class="scale-line" d="M200 156 V556"/>

    <path class="tick-fine" d="M186 176.0 H198 M202 176.0 H214 M186 196.0 H198 M202 196.0 H214 M186 216.0 H198 M202 216.0 H214 M186 256.0 H198 M202 256.0 H214 M186 276.0 H198 M202 276.0 H214 M186 296.0 H198 M202 296.0 H214 M186 336.0 H198 M202 336.0 H214 M186 356.0 H198 M202 356.0 H214 M186 376.0 H198 M202 376.0 H214 M186 416.0 H198 M202 416.0 H214 M186 436.0 H198 M202 436.0 H214 M186 456.0 H198 M202 456.0 H214 M186 496.0 H198 M202 496.0 H214 M186 516.0 H198 M202 516.0 H214 M186 536.0 H198 M202 536.0 H214"/>

    <!-- 带数字的刻度 0 / 2 / 4 / 6 / 8 / 10 才加长（y = 156 + 80k）。
         题图里 1 / 3 / 5 / 7 / 9 与 0.5 N 的刻度一样长，别再给它们加长 -->
    <path class="tick-long" d="M178 156.0 H198 M202 156.0 H222 M178 236.0 H198 M202 236.0 H222 M178 316.0 H198 M202 316.0 H222 M178 396.0 H198 M202 396.0 H222 M178 476.0 H198 M202 476.0 H222 M178 556.0 H198 M202 556.0 H222"/>

    <!-- 单位 N（两列刻度各标一次，量程 10 N 写在底部） -->
    <text class="unit" x="172" y="124" text-anchor="end">N</text>

    <!-- 刻度值 0 / 2 / 4 / 6 / 8 / 10：两列对称 -->
    <text class="num" x="172" y="165" text-anchor="end">0</text>
    <text class="num" x="228" y="165">0</text>
    <text class="num" x="172" y="245" text-anchor="end">2</text>

    <!-- 指针：电梯静止时指在 5 N 那一行（读数由放大图认，图上不写数） -->
    <path class="pointer" d="M178 356 H222"/>
    <path class="pointer-dot" d="M200 345 L211 356 L200 367 L189 356 Z"/>

    <!-- 吊杆 + 挂钩：3/4 圆（270° 弧，缺口 90° 朝左上），吊杆接在弧的起点正上方 -->
    <path class="device" d="M200 596 V644"/>
    <path class="device" d="M200 644 A20 20 0 1 1 180 664"/>

  <!-- ═══════════ 右：读数放大图（4 → 6 N 局部，1 N = 150 单位，0.5 N 一格看得清） ═══════════ -->

    <path class="pointer-dot" d="M760 315 L775 330 L760 345 L745 330 Z"/>
