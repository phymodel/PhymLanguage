<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>首钢滑雪大跳台剖面：运动员自 a 处静止滑下，c 为 a、b 之间的最低点，到 b 处起跳，a、c 高度差为 h</title>
<style>
  /* 图框口径：与同目录 `01 example1.html`、`09 example1.html`、`10 example1-1.html`、
     `10 example3.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是黑底 + 蓝道 + 金字，
       **不照抄那个底色**，只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例，须落在 0.2–5 之间
       （`Markdown/doc.html` 的 `htmlFigureRatio`，越界会退化成固定 240px 高）。
       本题图是一条横向铺开的**雪道剖面 + 一条高度标注**，画幅天生很宽：
       图元实测 bbox 为 x = 40 → 740、y = 24 → 418（700 × 394，比例 ≈ 1.78，
       其中 y = 24 是 a 记号的字顶、y = 418 是地面排线的下端）。
       viewBox 取 780 × 480（x 从 0 到 780、y 从 −19 到 461，比例 ≈ 1.625），
       左右各留 40 单位、上下各留 43 单位真空格；图元形心 (390, 221) 与 viewBox 中心
       (390, 221) 精确重合。想让图再小一点就继续放大 viewBox（留白只写在 viewBox 里，
       不碰任何图元坐标），注意别超过 5 的比例上限 —— 高 480 时 viewBox 宽最多 2400。
     · 配色（两色，别再加第三种）：
         雪道（大跳台剖面）/ 地面主视棱 / 地面排线 ......... #ffb900（金色，同
                                                         `10 example1-1.html` 的「大圆环」、
                                                         `10 example3.html` 的「桌面 + 地面」：
                                                         图上的装置 / 场地 / 支架一律走金）
         a、b、c 三个位置记号 / h 的尺寸线、端线与参考线 ... #075bff（深蓝，同
                                                         `10 example1-1.html` 的「小环 + Q 点」、
                                                         `09 example1.html` 的「l 的尺寸线」：
                                                         位置记号与尺寸标注走深蓝）
       本题要读的只有**一条不动的雪道**与**三个位置 + 一个高度差**，两色正好一刀切开：
       金的是「场地长什么样」，蓝的是「这道题在这条道上标了哪几处、量了哪一段」。
       反过来的错法：把 a / b / c 也涂成金 —— 三个记号与雪道连成同一层，读者分不清
       「哪一笔是道、哪一笔是给这道题标的点」；把雪道涂成蓝 —— 唯一一件静止的装置
       反而比标注还显眼，与 `10 example1-1.html`「固定装置走金、动件与位置走蓝」的口径打架。
     · 字体：a、b、c、h 都是题面里的记号，走 Georgia / Times New Roman 斜体
       （与本仓 `.sym` 一致）；字号写在 <text> 的 font-size 属性上，类里不写 font-size
       （否则 CSS 会盖掉属性）。 */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 雪道：本题的装置本体，一整条金线。铺满整幅宽度、上下来回一个起伏，
     线宽 6 让它是全图最重的一笔 —— 读者先看到「一条从高到低再抬起来的道」，
     再看到道上的三个记号。round 线帽让道两端收得干净（道头是断的，不是刀切的）。 */
  .track {
    fill: none;
    stroke: #ffb900;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 地面主视棱：与雪道同色（都是场地），但细一号 —— 它是底板，不该跟雪道抢重量 */
  .ground {
    fill: none;
    stroke: #ffb900;
    stroke-width: 5;
    stroke-linecap: round;
  }
  /* 地面排线：粗面记号，再细一号；只铺在地面主视棱之下，不越过雪道 */
  .hatch {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  /* 高度差的**参考线**：过 c 点、平行于水平面的一条细实线，向右收在 c 点上。
     为什么是实线而不是虚线：它标的是「c 所在的那条水平面」，是一条真实的几何水平线，
     不是引出的辅助标注；而且它与雪道一金一蓝、一细一粗，本身就是两层，不会被读混
     （`01 example5.html` 用虚线是因为那里五段 s 之间只隔六根引出线、线一实就糊成一片横杠，
      本题只有这一条，没有这个问题）。 */
  .ref {
    fill: none;
    stroke: #075bff;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  /* h 的尺寸线：两端带箭头（箭头由 <defs> 里的 marker 提供），深蓝 */
  .dim {
    fill: none;
    stroke: #075bff;
    stroke-width: 2.6;
    stroke-linecap: round;
  }
  /* 记号（a / b / c / h）：斜体衬线，跟随标注层的深蓝。
     ★ 类里**不写** text-anchor —— 四个记号里 h 要 end、其余三个要 middle；
       若把 middle 写进这个类，`<text text-anchor="end">` 那个属性会被 CSS 规则盖掉
       （表现属性的优先级低于任何 CSS 规则），h 就会居中到 x = 76 上、压住箭头。
       所以对齐一律写在各自的 <text> 属性上（font-size 也是同理，见文件头的「字体」一段）。 */
  .sym {
    fill: #075bff;
    font-family: Georgia, "Times New Roman", "KaiTi", serif;
    font-style: italic;
  }
</style>
</head>
<body>

<!-- 配 `10 机械能守恒定律.md` 的「真题 4」（2022 全国甲卷第 2-14 题）：
     北京冬奥会首钢滑雪大跳台，运动员从 a 处由静止自由滑下，c 点为 a、b 之间的最低点，
     到 b 处起跳；a、c 两处的高度差为 h。要求经过 c 点时对雪板的压力不大于自身重力的 k 倍，
     求 c 点处这段圆弧雪道的半径下限（答案 r ≥ 2h/(k−1)，选 D）。
     本图只画**雪道剖面**与**它上面的三个位置、一个高度差**：题目的判读全在「a 与 c 差多少高」
     与「c 是这段圆弧的最低点」这两件事上，别的一律不上图（见文末「不该画的东西」）。

     几何口径（1 单位 ≈ 1 画面点，竖向与横向同一把尺 —— 高度差必须是可量的真比例）：
       · 参考水平面（= c 的高度）    y = 300
       · a 所在的高台台面            y = 90   ⇒ **h = 300 − 90 = 210 单位**
       · 地面主视棱                  y = 392（x = 40 → 740，两端都伸到雪道之外）
       · 地面排线                    17 道，间距 40（x = 70 → 710），自 392 向下左斜 24 × 26 到 y = 418
       · 雪道（一条 path，金、线宽 6）  横向 x = 60 → 720，竖向 y = 90 → 300：
           ① 高台段      M60 90 H175                          自 x = 60 平铺到 175（a 就标在这一段上）
           ② 下冲段      C270 90 330 300 430 300              a 的台下一直俯冲到谷底，
                                                             开始与收尾都取水平切线（两端坡度 0、中段最陡）
                                                              最陡处 x = 299.4、y = 193.4，坡度 1.33 ≈ 53°
           ③ 谷底        (430, 300)                           **全道最低点**，切线水平 ⇒ 这就是题面的 c
           ④ 回升段      C490 300 515 272 560 264             自谷底抬起，坡度渐缓
           ⑤ 起跳台      C586 259.4 592 232 606 232           b 的小丘，峰顶 (606, 232)、切线水平
           ⑥ 台后下滑    C620 232 634 256 648 264             过了 b 就开始往下走（b 之所以能「起跳」，
                                                              靠的就是这一下落差）
           ⑦ 远处坡面    C662 272 674 272 688 264
                         C702 255 712 248 720 242             先略微再沉一点（最低到 y ≈ 270），
                                                              再向右抬起来收在画面边
       · 高度差标注   h 的尺寸线在 x = 92（高台段之下、离道头 32 单位处），
                      自 (92, 297) 到 (92, 93)，两端各留 3 单位空当 ——
                      上端正好停在雪道线宽的下缘、下端正好停在参考线的上缘，
                      箭头尖**不压在**线的中轴上：压上去会被金线吞掉半个箭头。
                      双箭头由 marker `dimArrow`（`orient="auto-start-reverse"`）一头一个，一次画成。
       · 参考线       过 c 的水平细线，x = 60 → 430（右端**正好收在 c 点上**）：
                      一端顶到图元的左边界、另一端顶到最低点，读者一眼看出
                      「这条线的高度 = c 的高度」，h 就是它到台面 y = 90 的距离。
       · 记号位置     a (128, 56) 台面之上、h 尺寸线右侧（不与箭头挤在一起）
                      h (76, 212) 尺寸线左侧、text-anchor: end，右边缘离箭头 16 单位
                      b (606, 206) 起跳台峰顶正上方，字底离峰顶 26 单位
                      c (430, 350) 最低点正下方，字顶离参考线 18 单位、离地面 42 单位
                      四个记号一律 44 px（同 `10 example1-1.html` 的 Q），互不同角、不压线。

     判读用的定量关系（写在这里方便以后改图时对账，图上不出现）：
       · 图上 h 的 210 单位是**唯一的一把尺**：改画幅时先定 h 的像素长，
         再由它定台面 y、谷底 y、地面 y，别只挪一条线。谷底必须严格落在参考线上
         （c 的高度就是参考线的高度），台面到参考线的竖向距离必须严格等于 h 的尺寸线长度。
       · c 处的圆弧半径 r 与 F_N 的关系是 r ≥ 2h/(k−1) —— 这条式子靠的是
         「h 是 a 到 c 的高度差」「c 处速度由 mgh = ½mv² 给出」两件事，
         所以图上只要把**谷底是真的最低点**画准，判读就不会跑偏。

     图上没有画、也不该画的东西：
       · 不画运动员（题面「将运动员视为质点」，原题图也没有人）：画一个小方块或小人，
         会让人去找「人的重心高度」这种题面根本没给的量。
       · 不画 c 处圆弧的圆心、半径 r、向心力 F_N 与重力 mg：它们正是答案里的量，
         一上图等于把 r ≥ 2h/(k−1) 的推导过程印在图上。
       · 不标 k、m、v_c：题面只用文字给出 k 的上限，m 与 v_c 是待求链上的中介量。
       · 不画起跳之后的腾空抛物线、不画落地区：题面只问到 c 点的半径，腾空是下一问的事；
         雪道在 b 之后那一段只画到画面边上，表达「道还在继续」，不表达「跳到哪」。
       · 不画第二层地面之外的东西（支架、观众席、出发台）：本题只需要一条剖面。

     画的时候别踩的五个坑：
       ① 谷底别画成「尖角」也别画偏：c 是全道唯一的最低点，两侧必须光滑过谷（切线水平），
          画成 V 形就成了两块斜面的交点，题面「c 点处这一段圆弧雪道」就不成立；
       ② 参考线的高度必须与谷底的 y 严格相等（都是 300）：差 1 单位，h 量出来就不是
          「a、c 两处的高度差」，图上会同时出现两条「底面」；
       ③ h 的尺寸线别贴到道头：x = 92 在高台段（60 → 175）之内，箭头才落在雪道上；
          挪到 x < 60 上方就没有道接住，箭头会悬空指着空气；
       ④ 地面（y = 392）别抬高到谷底附近：谷底 300 与地面 392 之间要留出空当，
          否则 c 的记号无处落脚，参考线也会跟地面排线糊在一起；
       ⑤ b 的记号别标在小丘的侧面：b 是「起跳处」，就是小丘的峰顶 (606, 232)；
          标在侧面会被读成「起跳点在坡上」，与题面「到 b 处起跳」不符。 -->

<svg viewBox="-200 -19 1200 480" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="示意图：一条滑雪大跳台的剖面雪道，从左上角的高台开始，先平铺一段再陡峭下冲，到最低点后重新抬升，末尾有一个小丘；高台上标着 a，最低点标着 c，小丘峰顶标着 b。一条水平参考线过最低点 c，它与高台台面之间的高度差用一条两端带箭头的尺寸线标着 h。雪道下方是带排线的地面。图中没有画出运动员，也没有画出 c 处圆弧的圆心、半径与受力。">

  <defs>
    <!-- 高度差的箭头：两端各一个，`auto-start-reverse` 让同一个 marker 两头都朝外。
         `userSpaceOnUse` 让箭头不随 stroke-width 缩放 —— 这条尺寸线长 204 单位，
         按 strokeWidth 缩放的那套（本仓 7×7）也够用，但这里与 `01 example5.html`
         的尺寸线同一口径，箭头在两种画幅下长得一样。 -->
    <marker id="dimArrow" markerWidth="9" markerHeight="7" refX="8" refY="3.5"
            orient="auto-start-reverse" markerUnits="userSpaceOnUse">
      <path d="M0 0.4 L8 3.5 L0 6.6" fill="none" stroke="#075bff" stroke-width="1.4"
            stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- ═══════════════════ 地面：主视棱 + 排线（17 道） ═══════════════════ -->
  <path class="ground" d="M40 392 H740"/>
  <path class="hatch" d="M70 392 L46 418 M110 392 L86 418 M150 392 L126 418 M190 392 L166 418 M230 392 L206 418 M270 392 L246 418 M310 392 L286 418 M350 392 L326 418 M390 392 L366 418 M430 392 L406 418 M470 392 L446 418 M510 392 L486 418 M550 392 L526 418 M590 392 L566 418 M630 392 L606 418 M670 392 L646 418 M710 392 L686 418"/>

  <!-- ═══════════════ 雪道剖面：一条 path，七段（高台→下冲→谷底→回升→起跳台→台后下滑→远处坡面） ═══════════════
       ★ 三处对齐必须守住（改图时先量这三条，再动别的）：
         · 高台段严格水平铺在 y = 90 上（a 的台面，也是 h 的上端）
         · 谷底严格是 (430, 300)：全道唯一的最低点、切线水平，参考线就过这一点的 y
         · 起跳台峰顶严格是 (606, 232)：b 之所以叫「起跳处」，靠的是峰顶之后开始下落 -->
  <path class="track" d="M60 90 H175 C270 90 330 300 430 300 C490 300 515 272 560 264 C586 259.4 592 232 606 232 C620 232 634 256 648 264 C662 272 674 272 688 264 C702 255 712 248 720 242"/>

  <!-- ═══════════════ 高度的参考线：过 c 的水平细线，右端收在 c 点上 ═══════════════ -->
  <!-- 它的 y 必须与谷底的 y 逐单位相等（都是 300）；左端顶到图元左边界 x = 60，
       与 h 尺寸线的下端、与 c 的记号一起，把「h 量到哪一层」说死。 -->
  <path class="ref" d="M60 300 H430"/>

  <!-- ═══════════════ 高度差 h：高台台面 → 参考线的双箭头 ═══════════════ -->
  <!-- 尺寸线在 x = 92（高台段 60 → 175 之内），自 (92, 297) 拉到 (92, 93)：
       上端停在雪道线宽（6）的下缘、下端停在参考线线宽（2.4）的上缘，
       箭头尖不压线的中轴 —— 压在金线上会被吞掉半个箭头，压在参考线上会与细线糊成一团。 -->
  <path class="dim" d="M92 297 V93" marker-start="url(#dimArrow)" marker-end="url(#dimArrow)"/>

  <!-- ═══════════════ 记号：a、h、b、c ═══════════════ -->
  <!-- a：高台台面之上，标出「静止滑下」的起点；写在 h 尺寸线的右侧，不与箭头挤在一起 -->
  <text class="sym" x="128" y="56" font-size="44" text-anchor="middle">a</text>

  <!-- h：写在尺寸线左侧 16 单位处（text-anchor: end，右边缘落在 x = 76），
       基线 y = 212 让小写体的视觉中心落在尺寸线的中点 195 附近 -->
  <text class="sym" x="76" y="212" font-size="44" text-anchor="end">h</text>

  <!-- b：起跳台峰顶 (606, 232) 正上方，字底离峰顶 26 单位 -->
  <text class="sym" x="606" y="206" font-size="44" text-anchor="middle">b</text>

  <!-- c：最低点 (430, 300) 正下方（参考线之下），字顶离参考线 18 单位、离地面排线 42 单位 -->
  <text class="sym" x="430" y="350" font-size="44" text-anchor="middle">c</text>

</svg>

</body>
</html>
