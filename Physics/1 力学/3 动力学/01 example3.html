<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>粗糙桌面上用轻弹簧相连的两滑块 P、Q，水平拉力 F 拉动 P</title>
<style>
  /* 图框口径：与同目录 `01 example1.html`、`01 example2.html`、`11 example1-1.html`、
     `1 力学/1 运动学/09 example1.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是黑底金线，**不照抄那个底色**，
       只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例，须落在 0.2–5 之间
       （`Markdown/doc.html` 的 `htmlFigureRatio`，越界会退化成固定 240px 高）。
       本题图是一件横向排开的装置（桌面 + Q + 弹簧 + P + 拉力箭头），画幅天生很宽：
       图元占 x = 110 → 830（F 记号的字顶到 y = 131 是图上最高的点）、y = 131 → 286，
       viewBox = -430 18 1800 380 → 比例 ≈ 4.74，左右各留 540、上下各留 113 / 112 单位真空格。
       留白一路照着同目录 `01 example2.html`（viewBox 1600 × 380、比例 ≈ 4.21，图元只占帧宽约 28%）
       放宽，本图元本身更宽（720 单位），所以连 viewBox 高度一起加才放得下同样的留白比例：
       1000 × 300（两侧各 140，图几乎顶满帧宽）→ 1260 × 300（两侧各 270）→ 本版 1800 × 380，
       图元只占帧宽 40%，与 example2 摆在同一篇文档里比例相当、不再一大一小。
       想让图再小一点就继续加宽 viewBox（留白只写在 viewBox 里，不碰任何图元坐标），注意别超过 5 的
       比例上限 —— 高 380 时 viewBox 宽最多 1900（两侧各留 590）。
     · 配色：
         桌面（地面）+ 地面斜线 ................ #ffb900（同 `11 example1-1.html` 的「支撑面 / 轴」口径）
         滑块 Q / P、轻弹簧、拉力箭头 F ....... #075bff（同 example1 的「可动件」口径）
       P、Q、F 三个记号也用 #075bff：它们是题面给的元件名，跟各自所在的图元同色，
       一眼就能对上「哪个字母是哪个东西」。
     · 字体：P、Q、F 是题面里的元件记号，走 Georgia 斜体（与本仓 `.part-label` 一致）。 */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 桌面（地面）：一根粗实线就是主视棱 */
  .rigid {
    fill: none;
    stroke: #ffb900;
    stroke-width: 5;
    stroke-linecap: round;
  }
  /* 地面斜线：粗面记号，细一号，不跟主视棱抢 */
  .hatch {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  /* 滑块 / 弹簧 / 拉力箭头：同一支「可动件」的深蓝 */
  .part {
    fill: none;
    stroke: #075bff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 图上元件名 Q / P / F（题面给的记号，不是单位） */
  .part-label {
    fill: #075bff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 42px;
  }
</style>
</head>
<body>

<!-- 配 `01 牛顿第二定律.md` 的「真题 3」（2022 全国甲卷第 2-19 题）：
     质量相等的两滑块 P、Q 放在同一张粗糙水平桌面上（动摩擦因数同为 μ），二者用一根轻弹簧水平
     连接；用水平向右的拉力 F 拉动 P，使两滑块一起向右做匀速运动；某时刻突然撤去 F。
     本图只画「撤去之前」这一瞬的装置（题图就是这个状态）——候选 A～D 全是关于撤去之后的判断，
     题面没有第二幅图，这里也不替读者预设撤去后的位置，免得把「用哪一段过程」这件事提前画死。

     装置的几何口径（1 单位 ≈ 1 画面点）：
       · 地面主视棱  y = 260（x = 110 → 830，两端都伸到滑块之外，与题图同）
       · 地面斜线    自主视棱向下左斜 20 × 26，间距 34 单位（x = 138 → 818，共 21 道）
       · 滑块 Q      矩形 (230, 150)–(340, 260)，边长 110，底面正好坐在地面上
       · 滑块 P      矩形 (560, 150)–(670, 260)，与 Q **同尺寸** —— 题给「质量相等」，
                     在图上就该是两个等大的方块，别画出大小差
       · 轻弹簧      居中于两滑块之间（x = 340 → 560，中线 y = 205），**折线（锯齿）画法**：
                       两端导杆 340 → 358、542 → 560（水平，落在滑块中心高度上）
                       中间 12 个折点，首折 10 → 之后每折 14.5 等距，振幅 ±34（上下到 171 / 239）
                     弹簧画成「拉长」的样子（锯齿疏、导杆长），与匀速阶段 T = μmg > 0 一致；
                     别画成贴死的密圈／压缩弹簧 —— 那对应的是弹力很大、两滑块快要撞上的状态
       · 拉力 F      自 P 的右面 (670, 205) 水平向右到 x = 815，箭头尖端朝右；
                     记号 F 写在箭杆**上方偏右**（x = 778），不压在箭杆上，也不与 P 的方块叠字

     图上没有画、也**不该**画的东西：
       · 不标 μ、m、T：题面只用文字给出，题图也不标；一标就变成「图里给了、题干没给」的新条件。
       · 不画摩擦力箭头与弹力箭头：前半句问的是「撤去 F 之后」，此时受力图与装置图混在一张里，
         反而看不出哪些力还在。

     判读用到的定量关系（写在这里，方便以后改图时对账，图上不出现）：
       匀速阶段  对 Q：T = μmg（弹簧拉着 Q 向右，抵消向左的滑动摩擦力）
                 对 P：F = T + μmg = 2μmg
       撤去 F 瞬间 弹力来不及变 → 对 P：−T − μmg = m·a_P ⇒ a_P = −2μg（P 减速最猛的一瞬）
                 对 Q：弹力仍向右、摩擦力向左 ⇒ a_Q = 0（此刻 Q 还没开始减速）
       弹簧恢复原长前 弹力一路掉到 0 ⇒ a_P 从 2μg 单调减到 μg，a_Q 从 0 单调增到 μg ——
       所以 P 一直在比 Q 减得更快，同一时刻 v_P ≤ v_Q（D 对）；两滑块间距一直在缩小，
       P 的位移一定小于 Q 的（C 错）。 -->
<svg viewBox="-430 18 1800 380" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="装置示意图：两个同样大小的滑块 Q 和 P 放在一张粗糙的水平桌面上，二者之间用一根水平轻弹簧相连，弹簧处于被拉长的状态；滑块 P 的右侧受到一个水平向右的拉力 F，在这一拉力作用下两滑块一起向右做匀速运动。">

  <defs>
    <!-- 拉力箭头：与同目录既有图同口径（7×7、按 strokeWidth 缩放），描边换成可动件的深蓝 -->
    <marker id="arrowForce" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#075bff" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ═══════════════════ 粗糙水平桌面 ═══════════════════ -->
  <!-- 主视棱 + 地面斜线（21 道，间距 34，自 x = 138 到 818） -->
  <path class="rigid" d="M110 260 H830"/>
  <path class="hatch" d="M138 260 L118 286 M172 260 L152 286 M206 260 L186 286 M240 260 L220 286 M274 260 L254 286 M308 260 L288 286 M342 260 L322 286 M376 260 L356 286 M410 260 L390 286 M444 260 L424 286 M478 260 L458 286 M512 260 L492 286 M546 260 L526 286 M580 260 L560 286 M614 260 L594 286 M648 260 L628 286 M682 260 L662 286 M716 260 L696 286 M750 260 L730 286 M784 260 L764 286 M818 260 L798 286"/>

  <!-- ═══════════════════ 滑块 Q（左）═══════════════════ -->
  <rect class="part" x="230" y="150" width="110" height="110" rx="2"/>
  <text class="part-label" x="285" y="220" text-anchor="middle">Q</text>

  <!-- ═══════════════════ 轻弹簧（折线／锯齿画法）═══════════════════ -->
  <!-- 画法照本仓 `静态弹簧` 那套思路：直导杆 → 半格进锯齿 → 等距锯齿 → 半格回中线 → 直导杆，
       一笔画成（不是一串叠起来的椭圆）。这样弹簧与两滑块是同一支线稿、粗细一致，
       锯齿的疏密也天然读成「弹簧此刻被拉着」。
       取尺（x = 340 → 560，中线 y = 205，振幅 A = 34 → 锯齿上下到 171 / 239）：
         · 两端导杆   340 → 358、542 → 560（18 长，约占全长的 8%，与参考图 15/220 同档）
         · 锯齿段落   358 → 542（184），12 个折点：首折 10 → 之后每折 14.5 等距（首折取 2/3 折距，
                      照参考图「第一折略短」的比例），末折 14.5 收在中线上
         · 折点 x     368 / 382.5 / 397 / 411.5 / 426 / 440.5 / 455 / 469.5 / 484 / 498.5 / 513 / 527.5
                      上下交替（6 上 6 下），端点正好落在两滑块的相对面上，不留缝 -->
  <path class="part" d="M340 205 H358 L368 171 L382.5 239 L397 171 L411.5 239 L426 171 L440.5 239 L455 171 L469.5 239 L484 171 L498.5 239 L513 171 L527.5 239 L542 205 H560"/>

  <!-- ═══════════════════ 滑块 P（右、与 Q 等大）═══════════════════ -->
  <rect class="part" x="560" y="150" width="110" height="110" rx="2"/>
  <text class="part-label" x="615" y="220" text-anchor="middle">P</text>

  <!-- ═══════════════════ 拉力 F：水平向右拉动 P ═══════════════════ -->
  <path class="part" d="M670 205 H815" marker-end="url(#arrowForce)"/>
  <text class="part-label" x="772" y="170" text-anchor="middle">F</text>

</svg>

</body>
