<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>重物被 P、Q 两根绳拉着缓慢下降：P 绳与竖直方向成 α，Q 绳与竖直方向成 β</title>
<style>
  /* 图框口径：与同目录 `09 example1.html`、`01 example1.html`～`01 example7.html`、
     `11 example1-1.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是白底蓝线，**不照抄那个底色**，
       只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例（须落在 0.2–5 之间）。
       本题是「一块重物 + 两条斜拉出去的绳 + 一条竖直虚线」构成的一个**斜向张开的十字**，
       画幅天生接近方形、且要靠上下的绳头把竖直参考线夹在中间：
       图元实测 bbox 为 x = 311 → 756、y = 70 → 620（445 × 550，比例 ≈ 0.81）。
       viewBox = 620 × 660（x 从 220 到 840、y 从 15 到 675），左右各留 91 / 84 单位、
       上下各留 55 单位真空格 —— 图元只占画幅宽度的 445 / 620 ≈ 72%、高度的 550 / 660 ≈ 83%，
       整幅按 0.72 缩小显示，玻璃面板里不至于顶满。想让图再小一点就继续加宽 viewBox
       （留白只写在 viewBox 里，不碰任何图元坐标），注意别超过 5 的比例上限 —— 高 660 时
       viewBox 宽最多 3300。
     · 配色（三色分工，别再加第四种）：
         重物本体 .......................................... #ffb900（题目要「运到地面」的那件东西，
                                                              与题图原稿一致：实物画成实心金块，
                                                              与 `01 example4.html` 的「挡板 P」同为
                                                              「装置里的一件实体」口径）
         P 绳 / Q 绳 / 竖直参考虚线 / 夹角弧与 α、β 记号 ....... #075bff（题面给的约束与几何标注）
       本题要读的不是「谁动谁不动」，而是「两条绳各自与竖直方向张了多少度」—— 三条方向线
       （P、竖直、Q）是本图唯一的主角，所以留给同一支蓝；重物只是三条线的交点，用实心金块
       压住交点，读者一眼能找到「角量在哪、谁在拉它」。
       反过来的错法：把重物也涂成蓝 —— 交点与三条方向线糊成一片，α、β 立刻看不出是量到哪条
       线上的角；把绳涂成金 —— 读者会把绳读成「不动的支架」，而本题两根绳的长度都在变
       （重物在下降），它们是活的约束，不是支架。
     · 字体：P、Q、α、β 是题面里的记号，走 Georgia / Times New Roman 斜体（与本仓 `.sym` 一致）；
       字号写在每个 <text> 的 font-size 属性上，类里不写 font-size（否则 CSS 会盖掉属性）。
       希腊字母 α、β 用 Georgia 打头、Times New Roman 兜底 —— 两者都有希腊字形，不会掉字。 */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 重物：实心金块（题图原稿就是这么涂的），金边压金面，边缘不至于发虚 */
  .weight {
    fill: #ffb900;
    stroke: #ffb900;
    stroke-width: 3;
    stroke-linejoin: round;
  }
  /* 两根绳：斜拉出去的直线，圆头收尾，不与重物的边争锋 */
  .rope {
    fill: none;
    stroke: #075bff;
    stroke-width: 4.2;
    stroke-linecap: round;
  }
  /* 竖直参考线：穿重物而过，重物把它遮断 —— 上下一虚一续，正是「竖直方向」的通用画法 */
  .plumb {
    fill: none;
    stroke: #075bff;
    stroke-width: 2.6;
    stroke-dasharray: 11 9;
    stroke-linecap: round;
  }
  /* 夹角弧：α 量在上半（竖直向上 ↔ P 绳），β 量在下半（竖直向下 ↔ Q 绳） */
  .angle {
    fill: none;
    stroke: #075bff;
    stroke-width: 2.8;
    stroke-linecap: round;
  }
  /* 记号（P / Q / α / β）：斜体，跟随自己所属的那一层颜色 */
  .sym {
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    text-anchor: middle;
  }
  .sym-blue {
    fill: #075bff;
  }
</style>
</head>
<body>

<!-- 配 `09 动能定理.md` 的「真题 4」（2024 全国新课标卷第 3-24 题）：
     一人在高处控制绳 P、一人在地面控制绳 Q，二人配合让重物（m = 42 kg）**缓慢竖直下降**，
     要求下降过程中重物与楼墙保持一定距离。题面给出的当下姿态是：
       P 绳与竖直方向成 α = 37°，Q 绳与竖直方向成 β = 53°。
     第 (1) 问要的是两个张力 T_P、T_Q，第 (2) 问要的是两根绳的拉力对重物做的总功。
     所以图上只需要给三样东西：**P 绳的方向、Q 绳的方向、竖直方向**（三者夹出 α、β）。
     两人与楼墙一律不画，理由见下文「图上没有画、也不该画的东西」。

     几何口径（1 单位 ≈ 1 画面点）：
       画布          图元实测 bbox：x = 311 → 756、y = 70 → 620（见 <style> 里「由比例定尺」一段）
       交点 C        (492, 342) —— 两条绳的**作用线**与竖直参考线都在这里相交。
                    重物本体就画在 C 上（rect x = 470 → 514、y = 314 → 370，即 44 × 56 的竖长块），
                    于是「三条线的交点」被金块压住，读者看到的是「两根绳各自从块的一个角上拉出去」
                    —— 与题图原稿的观感一致，也正是受力分析该取的公共作用点。
       竖直参考线    x = 492，y = 70 → 620；**画在金块之前**，所以块身把那一段虚线的缝盖掉
        P 绳        自块的上边沿 (471, 314) 起，沿 α = 37° 的斜向上左方向拉出去，到 (311.5, 102.4) 为止
                    （方向矢量 (−sin37°, −cos37°) = (−0.6018, −0.7990)）
        Q 绳        自块的右边沿 (514, 358.6) 起，沿 β = 53° 的斜向下右方向拉出去，到 (755.5, 540.6) 为止
                    （方向矢量 (+sin53°, +cos53°) = (+0.7986, +0.6018)）
       ★ 两条绳都**从金块的边界起笔**，不穿过金块：作用线在块内被遮住是常识画法，
         真从 C 点画出去反而会让蓝线压在金面上、把块切成两半。
       α 的弧      圆心 C、半径 62：自「竖直向上」(492, 280) 转到 P 绳方向 (454.7, 292.5)
                    （62 单位刚好大于金块的半对角线 √(22² + 28²) ≈ 35.6，弧整段落在块外）
       β 的弧      圆心 C、半径 62：自「竖直向下」(492, 404) 转到 Q 绳方向 (541.5, 379.3)
       记号位置     P (334, 224) —— 写在 P 绳的左下侧，离绳 20.8 单位，不压线
                    Q (612, 508) —— 写在 Q 绳的左下侧，离绳 20.4 单位
                    α (458, 246) —— 落在上半夹角的内侧（离 P 绳 16.2 单位、离竖直虚线 22.6 单位）
                    β (536, 444) —— 落在下半夹角的内侧（离 Q 绳 20.4 单位、离弧 12.3 单位、离竖直虚线 32.4 单位）
                    —— 四个记号的「离绳距离」都是浏览器里实测 getBBox 后调出来的，
                       改字号或挪绳时请重测（小于 10 单位就读成压在线上）
       ★ 比例：本图**只有角度是定量的**（α = 37°、β = 53° 严格画准），长度一律不带量纲 ——
         题面唯一的长度是第 (2) 问的 h = 10 m，那是「下降的位移」，不是这两个绳头的长度。
         以后若要改 α、β 的数值，只需按新角度重算 P、Q 的端点与两段弧的终点，其余坐标不动。

     图上没有画、也**不该**画的东西：
       · 两人的手、楼墙与窗台：题面只把「一人在高处、一人在地面」当**已知条件**写下来，
         求解用的是「两条绳的方向 + 缓慢（a = 0）」，人的身高、站位、墙的远近全都进不了式子。
         画上墙反而会引来一个错误暗示 ——「重物与墙的距离」是个定量，可它是文字条件、不是图元。
       · 受力箭头 T_P、T_Q、mg：一画，这张「姿态图」立刻变成受力图，读者会跳过「缓慢 ⇒ 合外力为零」
         这一步推导，直接照着箭头读答案。受力分析另配一张图（本题解析里的「对重物受力分析，如图」）。
       · 重物的速度箭头（缓慢下降 ⇒ v ≈ 0）：本题的动词是「缓慢」，箭头画出来就自相矛盾。
       · 角度数值 37°、53°，以及 h = 10 m：数值属题面文字，图上只留符号；
         符号与文字的对应关系由题面给，图上再写一遍数值，改题时就要两处一起改。

     判读用的定量关系（写在这里，方便以后改图时对账，图上不出现）：
       · 「缓慢」⇒ 重物始终处于平衡态，合力为零：
           水平：T_P sinα = T_Q sinβ          （两绳的水平分量等大反向，一左一右）
           竖直：T_P cosα = T_Q cosβ + mg     （P 绳向上提，Q 绳与重力都向下拽）
         ⇒ T_P = 1 200 N、T_Q = 900 N（取 m = 42 kg、g = 10 m/s²，sin37° = 0.6、cos37° = 0.8、
            sin53° = 0.8、cos53° = 0.6）。这两个数正是解析里的答案，可用来反查图有没有画反：
            **α < β ⇒ P 绳更陡 ⇒ T_P > T_Q**（1200 > 900）。图上若把 P 画得比 Q 还平，就是画错了。
       · 第 (2) 问：重物缓慢下降 h，动能不变 ⇒ mgh + W_绳 = 0 ⇒ W_绳 = −mgh = −4 200 J。
         与两绳夹角无关 —— 这正是「不必知道绳长怎么变」的原因，也是本图不必画绳长的理由。 -->

<svg viewBox="-400 15 1800 660" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="姿态示意图：画面中央是一块竖长的金色重物，一条竖直虚线穿过它并把上下两段画成虚线；从重物的左上方向斜上方拉出一条蓝色的绳 P，绳 P 与向上的竖直方向之间的夹角标为 α；从重物的右下方向斜下方拉出一条蓝色的绳 Q，绳 Q 与向下的竖直方向之间的夹角标为 β。">

  <!-- ═══════════ 竖直参考线：先画，被金块遮断 ═══════════ -->

  <path class="plumb" d="M492 70 V620"/>

  <!-- ═══════════ 重物：画在三条线的交点上，压住交点 ═══════════ -->

  <rect class="weight" x="470" y="314" width="44" height="56" rx="5"/>

  <!-- ═══════════ 两根绳：各从金块的一个边界起笔，斜拉出去 ═══════════ -->

  <path class="rope" d="M471 314 L311.5 102.4"/>
  <path class="rope" d="M514 358.6 L755.5 540.6"/>

  <!-- ═══════════ 夹角弧：α 量在上半，β 量在下半（半径 62，整段落在金块之外） ═══════════ -->

  <path class="angle" d="M492 280 A62 62 0 0 0 454.7 292.5"/>
  <path class="angle" d="M492 404 A62 62 0 0 0 541.5 379.3"/>

  <!-- ═══════════ 记号：P、Q 跟着绳走，α、β 各自坐在自己的夹角里 ═══════════ -->

  <text class="sym sym-blue" x="334" y="224" font-size="42">P</text>
  <text class="sym sym-blue" x="612" y="508" font-size="42">Q</text>
  <text class="sym sym-blue" x="458" y="246" font-size="38">α</text>
  <text class="sym sym-blue" x="536" y="444" font-size="38">β</text>

</svg>

</body>
