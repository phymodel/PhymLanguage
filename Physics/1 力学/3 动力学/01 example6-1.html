<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>轻绳两端各连一球、恒力 F 作用在绳的中点（俯视）——两球相距 3L/5 时的位形</title>
<style>
  /* 图框口径：与同目录 `01 example1.html`～`01 example5.html`、`11 example1-1.html`、
     `1 力学/1 运动学/09 example1.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是黑底金线，**不照抄那个底色**，
       只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例（须落在 0.2–5 之间）。
       本题图是一件**俯视**的小装置（一根折成 V 形的轻绳 + 两只小球 + 一支水平的力箭头），
       图元占 x = 122 → 437、y = 131 → 349（浏览器实测 getBBox：315 × 218.5，本身已偏横），
       故 viewBox 取 520 × 372（比例 = 1.398，与同目录 `01 example4.html` 的 1.40 同一档）：
       x 从 20 到 540（左右各留 102.1 / 102.9），y 从 54 到 426（上下各留 76.9 / 76.5）。
       图元的形心 (279.6, 240.2) 与 viewBox 的中心 (280, 240) 只差 0.4 / 0.2，看起来是居中的。
       想让图再小一点就继续加宽 viewBox（留白只写在 viewBox 里，不碰任何图元坐标），
       注意别超过 5 的比例上限 —— 高 372 时 viewBox 宽最多 1860。
     · 配色（两色，别再加第三种）：
         轻绳 / 两只小球 / 拉力箭头 F / 记号 m、F ......... #075bff（同 `01 example1.html` 的
                                                          「细绳 / 物块 P」、`01 example3.html` 的
                                                          「滑块 / 弹簧 / 拉力箭头」：可动件一律深蓝，
                                                          记号跟自己的图元同色）
         θ 的弧 + 对称轴虚线 + 记号 θ .................... #ffb900（同 `01 example4.html` 的
                                                          「夹角 θ 的弧与 θ 记号」：几何标注与轴名同口径）
       本题没有「不动的装置」可画（桌面按题图不画，理由见下），金线只承担一处几何标注；
       本仓那支青色（#00eaff，用在「由测量 / 解析得来的结果」上，如 example1 的 a-m 图线、
       example5 的 s₁～s₅）在本题没有着落点 —— 图上既没有图线，也没有量出来的量。
     · 字体：m、F、θ 是题面 / 解析里的记号，走 Georgia 斜体（与本仓 `.part-label` 一致）。
       本图不含数字，故不引 Times 正体那一档（同 example5 对数字字的处理）。 */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 轻绳 / 两只小球 / 拉力箭头：同一支「可动件」的深蓝 */
  .part {
    fill: none;
    stroke: #075bff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 对称轴（F 的作用线在绳中点左侧的延长）：虚线，几何标注，细一号，不与实体线抢 */
  .axis-dashed {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-dasharray: 8 6;
    stroke-linecap: round;
  }
  /* 夹角 θ 的弧：几何标注，细一号 */
  .angle-arc {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.6;
    stroke-linecap: round;
  }
  /* 图上的记号 m（球的质量）/ F（恒力）：题面给的记号，与各自的图元同色 */
  .part-label {
    fill: #075bff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 34px;
  }
  /* 记号 θ（绳与 F 方向的夹角）：几何标注，与弧同色 */
  .angle-name {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 34px;
  }
</style>
</head>
<body>

<!-- 配 `01 牛顿第二定律.md` 的「真题 6」（2022 全国乙卷第 2-15 题）：
     一根不可伸长的轻绳，两端各连一个质量为 m 的小球，整个系统静置在**光滑水平桌面**上，
     两球间距离等于绳长 L；一大小为 F 的水平恒力作用在**轻绳的中点**，方向与两球连线垂直。
     问两球运动到相距 3L/5 时，加速度各多大（答案 a = 5F/8m）。

     本图画的就是题面描述的那一瞬（两球相距 3L/5），而且是一张**俯视图**：
     视线垂直桌面往下看 —— 画面里的「上下」是桌面内的一条方向，不是竖直方向；
     「左右」才是 F 的作用线。两球的连线在画面上是竖的，与 F 严格垂直（题给条件），
     这一点不用再画直角记号，一眼就能读出来。

     几何口径（1 单位 ≈ 1 画面点；绳长 L 在图上取 300）：
       · 绳中点 A（= F 的作用点）   (300, 240)
       · 上球 / 下球                圆心 (180, 150) / (180, 330)，r = 15
                                    **等大** —— 题给两球质量都是 m，图上就不许画出大小差
                                    （同 `01 example3.html` 对「质量相等的两滑块」的处理）
       · 半绳 MA = MB = 150，方向 (∓0.8, ±0.6)；轻绳自球面 (192, 159) 经折点 A 折到球面
         (192, 321) —— 两段**等长**、只在 A 处折成 V 形，**两个球在同一竖线上**：
         F 与两球连线垂直、系统初始静止 ⇒ 全程左右对称，两球的横坐标始终相同，
         谁也不会跑到对称轴的另一侧去
       · 两球相距 = 330 − 150 = 180 = 3/5 × 300 ✓ —— 与题给「运动至二者相距 3L/5」同位形
       · 每球到对称轴（y = 240）的距离 = 90 = 3L/10；每球到 A 的水平距离 = 120 = 2L/5
         ⇒ sin θ = 90/150 = 3/5、cos θ = 120/150 = 4/5，θ ≈ 36.87°
         （图上的角就画成 36.87°，**不是** 45°：tan θ = 90/120 = 0.75）
       · 拉力 F   自 A (300, 240) 水平向右到 (430, 240)，箭头尖端朝右；记号 F 写在箭尖
                  **右下方** (424, 288) —— 与题图同位置：那里空着，不压箭杆、不与绳和球叠字
       · 夹角 θ   顶点 A、半径 72：起点 (228, 240) 落在对称轴上、终点 (242.4, 196.8) 落在
                  上段绳上，扫过 36.87°；θ 的字心落在「对称轴 + 上段绳 + 弧」围成的空档里
                  （205, 208 一带，角平分线上、离顶点 ≈ 100），按 bbox 口径离弧 13.6、
                  离上段绳 10.5、离对称轴 12.5 —— 三条线都不压（实测见下），
                  再往外挪就脱离「这个角」了，再往里就顶到绳子
       · 对称轴   自 (222, 240) 到 A 的虚线段：它是 F 的作用线在 A 左侧的延长，
                  一给 θ 的弧一个落脚处（否则弧悬空、不知量到哪里），
                  二把「两球关于这条轴对称」直接画出来

     图上没有画、也**不该**画的东西：
       · 不画桌面 / 地面 / 斜线：题面写「光滑水平桌面上」，题图却只给了绳、球、F 三样东西 ——
         因为这是一张俯视图。画一条「桌面主视棱 + 斜线」会立刻被读成侧视图（以为重力朝下、
         球压在板上），把一个「光滑水平面内的问题」画歪。俯视这件事交给 aria-label 与本注释交代。
       · 不标 L、3L/5、F_T：题图原稿没有尺寸线，一加就多出「图里给了、题干没给」的第二种读法；
         L、3L/5 与图上坐标的对应关系写在上面的几何口径里，改图时照那三条对数即可。
       · 不写 θ 的数值（36.87° / sin θ = 3/5）：数值是从题给的两个长度算出来的，落到图上就成了
         「图里给的条件」（同 `01 example4.html` 不写 30° / 60° 的理由）。
       · 不画两球各自的受力图（绳张力沿绳、无其他水平力）与加速度箭头：题面只给了装置，
         本题的判读点全在「绳与 F 的夹角」这一处几何；把 F_T 与 a 也画上去，装置图立刻变成
         受力图，反而看不出这张图在问什么。

     判读用到的定量关系（写在这里，方便以后改图时对账，图上不出现）：
       · 半绳 L/2 = 150、每球到轴 3L/10 = 90 ⇒ sin θ = 3/5、cos θ = 4/5（θ ≈ 36.87°）
       · 沿 F 方向对绳的中点（中点质量为零）：F = 2 F_T cos θ = 2 F_T · (4/5) ⇒ F_T = 5F/8
       · 每球只受绳的拉力（桌面光滑，水平面内没有第二个力），加速度**沿绳指向中点**：
         a = F_T / m = 5F/(8m) ⇒ A 正确
       · 自洽核验：两球沿 F 方向的分加速度
         a cos θ = (5F/8m)(4/5) = F/(2m)，正好等于把两球当整体处理时的 F/(2m)；
         两段绳等长、两球等质量，所以「图上左右对称」与「两球 a 相同」本来就是同一件事。 -->

<svg viewBox="-480 54 1520 372" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="俯视示意图：两只质量相同的小球（各标 m）分居上下，用一根等长的轻绳连接，绳在中间被拉成一个 V 形；一个水平向右的恒力 F 作用在绳的中点，方向与两球连线垂直。此时两球相距为绳长的五分之三，绳与 F 方向的夹角标为 θ。">

  <defs>
    <!-- 拉力箭头：与同目录既有图同口径（7×7、按 strokeWidth 缩放），描边取可动件的深蓝 -->
    <marker id="arrowForce" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#075bff" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ═══════════════════ 轻绳：两段等长，在中点 A 折成 V 形 ═══════════════════ -->
  <!-- 两端都停在球面上（球心 ± 半径，沿半绳方向 (0.8, 0.6) 落在 (192, 159) / (192, 321)），
       不留缝、也不戳进球里 -->
  <path class="part" d="M192 159 L300 240 L192 321"/>

  <!-- ═══════════════════ 对称轴：F 的作用线在 A 左侧的延长（虚线） ═══════════════════ -->
  <!-- 左端 222 比弧的起点 228 再伸出去 6：弧落在虚线上、而不是虚线的端点外，读起来才是
       「从这条线上量出来的角」 -->
  <path class="axis-dashed" d="M222 240 H300"/>

  <!-- ═══════════════════ 夹角 θ：对称轴 ↔ 上段绳 ═══════════════════ -->
  <!-- 顶点 A (300,240)、r = 72：起点 (228,240) 在对称轴上，终点 (242.4,196.8) 在上段绳上，
       扫过 arcsin(3/5) ≈ 36.87°。θ 的字心 (205, 208) 落在弧与顶点之间的角平分线上：
       楔形只有 36.87° 宽，字再往绳边挪就顶到绳子（实测 bbox：离上段绳 10.5、离弧 13.6、离对称轴 12.5）。 -->
  <path class="angle-arc" d="M228 240 A72 72 0 0 1 242.4 196.8"/>
  <text class="angle-name" x="205" y="220" text-anchor="middle">θ</text>

  <!-- ═══════════════════ 两只小球：等大（质量都是 m）═══════════════════ -->
  <!-- 空心圆，与题图同：球壁加球心留白，绳从球面接出去；两球同在 x = 180 这条竖线上，
       相距 330 − 150 = 180 = 3L/5 -->
  <circle class="part" cx="180" cy="150" r="15"/>
  <circle class="part" cx="180" cy="330" r="15"/>

  <!-- 记号 m：写在各自球的左侧、竖直居中，与球同色；右端离球面留 13 单位 -->
  <text class="part-label" x="152" y="162" text-anchor="end">m</text>
  <text class="part-label" x="152" y="342" text-anchor="end">m</text>

  <!-- ═══════════════════ 恒力 F：作用在绳中点，水平向右 ═══════════════════ -->
  <!-- 箭杆自 A 起（题给「作用在轻绳的中点」，就从折点画起，不画成从某个球拉），到 (430,240)；
       记号 F 写在箭尖右下方，与题图同位 -->
  <path class="part" d="M300 240 H430" marker-end="url(#arrowForce)"/>
  <text class="part-label" x="424" y="288" text-anchor="middle">F</text>

</svg>

</body>
