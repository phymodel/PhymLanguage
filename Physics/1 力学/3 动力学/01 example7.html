<title>刹车过程：反应过程（匀速）+ 减速过程（匀减速），及减速阶段的 x–v 曲线</title>
<style>

     同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是黑底蓝线金曲线，**不照抄那个
       底色**，只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例（须落在 0.2–5 之间）。
       本题图是「一件装置（甲：平直路面 + 三个车时刻）+ 一张坐标系（乙：x–v 曲线）」横向并排，
       画幅天生很宽：图元实测 bbox 为 x = 20 → 995.8、y = 130.1 → 475.9（浏览器 getBBox）。
       画幅**故意比图元宽**：viewBox = 1400 × 465（比例 ≈ 3.011，x 从 −200 到 1200、
       y 从 70 到 535），左右各留 220 / 204.2 单位真空格 —— 图元只占画幅宽度的
       975.8 / 1400 ≈ 70%，整幅图按 0.70 缩小显示，玻璃面板里不至于顶满；上下各留约 60 / 59，
       仍按图元垂直居中对齐。想让图再小一点就继续加宽 viewBox（留白只写在 viewBox 里，
       不碰任何图元坐标），注意别超过 5 的比例上限 —— 高 465 时 viewBox 宽最多 2325。
     · 配色（三色分工，别再加第四种）：
         路面主视棱 / 路面斜线 / 尺寸线与端线 / 坐标轴 / 轴名与刻度数字 /
         甲乙 │ 反应过程 · 减速过程 ... #ffb900（同 `01 example4.html` 的「不动的装置 + 几何标注」口径）
         三辆车与它的车窗、车轮 .......... #075bff（同 example1 的「可动件」口径）
         三处车状态名（发现情况 / 开始减速 / 汽车停止）... #075bff（记号跟自己的图元同色：
                                                          这三个名字说的是「车此刻处在什么状态」，

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 路面主视棱：一条粗平线，三辆车都压在它上面 */
  .rigid {
    fill: none;
    stroke: #ffb900;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 路面斜线：粗面记号，细一号，不跟主视棱抢 */
  .hatch {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  /* 车：车身轮廓与车轮，同一支「可动件」的深蓝，空心线稿（与 example1 的物块 P 同口径） */
  .car {
    fill: none;
    stroke: #075bff;
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 侧窗：实心深蓝 —— 车身只有一层轮廓，留一块实心窗，整车才不会被读成「带两个轮子的方箱」 */
  .glass {
    fill: #075bff;
    stroke: none;
  }
  /* 尺寸线（反应过程 / 减速过程）与两端的端线：尺规，金、细 */
  .dim {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.6;
    stroke-linecap: round;
  }
  .dim-tick {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.2;
    stroke-linecap: round;
  }
  /* 坐标轴与轴上的刻度短划 */
  .axis {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .axis-tick {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  /* 减速过程的 x–v 曲线 */
  .curve {
    fill: none;
    stroke: #00eaff;
    stroke-width: 3.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 轴名 x/m、v/(km/h) 与原点 O：物理量走斜体 */
  .axis-name {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 26px;
  }
  /* 单位与数字段：一律正体（Times New Roman 等高数字） */
  .up {
    font-style: normal;
  }
  /* 轴上的刻度数字 25 / 72：正体 */
  .tick-num {
    fill: #ffb900;
    font-family: "Times New Roman", Georgia, serif;
    font-style: normal;
    font-size: 24px;
  }
  /* 车状态名（发现情况 / 开始减速 / 汽车停止）：汉字，正体，随车走 → 深蓝 */
  .car-state {
    fill: #075bff;
    font-family: -apple-system, "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif;
    font-style: normal;
    font-size: 26px;
    text-anchor: middle;
  }
  /* 尺寸线名（反应过程 / 减速过程）：汉字，正体，随尺规走 → 金 */
  .proc {
    fill: #ffb900;
    font-family: -apple-system, "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif;
    font-style: normal;
    font-size: 26px;
    text-anchor: middle;
  }
  /* 分图名 甲 / 乙 */
  .panel {
    fill: #ffb900;
    font-family: -apple-system, "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif;
    font-style: normal;
    font-size: 34px;
    text-anchor: middle;
  }
</style>

<!-- 配 `01 牛顿第二定律.md` 的「真题 7」（2014 山东省第 23 题）：志愿者饮酒后驾车，以
     v₀ = 72 km/h 匀速行驶，从「发现情况」到「汽车停止」共行驶 L = 39 m；图甲把这段路程拆成

     几何口径（1 单位 ≈ 1 画面点）：
       画布         图元实测 bbox：x = 20 → 995.8、y = 130.1 → 475.9（见 <style> 里「由比例定尺」一段）
       路面主视棱   y = 300，x = 20 → 450（一条粗平线，三辆车都压在它上面）
       路面斜线     15 道，间距 28（x = 36 → 428），自主视棱向下左斜 16 × 26
       车（局部坐标，路面 y = 0 为车底基准，车头朝右）：
                   车身轮廓 尾门 x = 6（竖直）→ 车顶 y = −40（x = 12 → 34）→ 前风挡斜下到
                   (46, −24) → 机罩到 (78, −24) → 圆滑收口 (86, −18)，再沿车底边 y = −18 回到尾门；
                   侧窗 (15,−29)-(18,−37)-(31,−37)-(33,−29) 实心；
                   车轮 圆心 (22,−9) / (68,−9)、r = 9 ⇒ 轮底 y = 0 落在路面上、轮顶 y = −18 与车底边相切。
                   **三个时刻是同一辆车**，只用 <g id="car"> 画一次、三处 <use> 复用 —— 手画三遍
                   迟早会有一辆大一圈或朝向不同，那就不再是「同一辆车的三个时刻」了。
       车的三个位置（translate 的 x）：40 / 138 / 313，对应**车头**（局部 x = 86 → 绝对 126 / 224 / 399）
       ★ 比例：1 m ↔ 7 单位。于是
           反应过程 = 14 m → 98 单位（126 → 224）
           减速过程 = 25 m → 175 单位（224 → 399）
           全程     = 39 m → 273 单位（126 → 399）
         这两个数（14 m、25 m）不是随手取的：25 m 是图乙读出的减速位移，14 m = L − 25 m 是反应
         过程的位移 ⇒ 图甲两段长度之比 98 : 175 与题给数据严格一致（14 : 25），

       · 刻度 25 m ↔ 180 单位（y = 180）、72 km/h ↔ 220 单位（x = 840）
       · 曲线 M620 180 Q730 180 840 360：起点 (0, 25)、终点 (72, 0)
       ★ 为什么这条二次 Bézier 恰好是抛物线：题给 x = (v₀² − v²)/(2a) ⇒ x 是 v 的二次函数，
         图线必须是一条**顶点在 v = 0 处的抛物线**（起始平缓、向右越来越陡）。
         把 v/72 记为 u，则 x = 25(1 − u²)；取 px = 620 + 220u、py = 180 + 180u²，

       读者先看到的是一条悬在半空的坐标轴。分图之间本来没有共基线的要求（题图原稿也没有），
       下移 60 之后两幅的分量才配得上；再要微调，只改本段这十来个 y，别动甲。 -->

  <!-- 坐标轴：原点 (620, 360)；纵轴到 y = 160（箭头），横轴到 x = 880（箭头） -->

  <path class="curve" d="M620 180 Q730 180 840 360"/>
