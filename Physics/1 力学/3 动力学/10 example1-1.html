<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>竖直平面内固定的光滑大圆环上套一个小环：小环自顶端下滑，Q 为大圆环最右点</title>
<style>
  /* 图框口径：与同目录 `01 example1.html`、`02 example1.html`、`09 example4-1.html`、
     `11 example1-1.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是白底彩线，**不照抄那个底色**，
       只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例（须落在 0.2–5 之间）。
       本题图是一枚**整个的大圆环**，画幅天生就是正方形（不像本仓多数图那样横向铺开）：
       图元实测 bbox 为 x = 86.75 → 560.1、y = 65 → 513.25（473 × 448，含大圆环 6.5 与
       小环 6 的线宽、以及 Q 记号的墨迹框）。故 viewBox 取 565 × 555
       （x 从 40 到 605、y 从 15 到 570，比例 ≈ 1.018），左右各留 46.75 / 44.9 单位、上下各留
       50 / 56.75 单位真空格；图元形心 (323.4, 289.1) 与 viewBox 中心 (322.5, 292.5) 基本重合。
       想让图再小一点就继续放大 viewBox（留白只写在 viewBox 里，不碰任何图元坐标），
       注意别超过 5 的比例上限 —— 高 555 时 viewBox 宽最多 2775。
     · 配色（两色，别再加第三种）：
         大圆环（竖直平面内固定不动的装置）....................... #ffb900（金色，同
                                                         `09 example4-1.html` 的「重物」、
                                                         `01 example1.html` 的「桌面 + 定滑轮」：
                                                         图上的装置 / 支架一律走金）
         小环 / Q 点 / Q 记号 ................................. #075bff（深蓝，同
                                                         `01 example1.html` 的「物块 P」、
                                                         `02 example1.html` 的「测力计」：
                                                         图上「能动的那一件」与被它标记的位置走深蓝）
       本题只考「小环下滑过程中对大圆环的作用力怎么变」，图上要读的只有**一个动的东西（小环）
       与一个位置（Q）**，所以除了大圆环这支金，其余全交给同一支蓝 —— 小环与 Q 同色不是偷懒：
       Q 正是「小环滑到这里」的那个位置，两者同色，一眼看出是同一个故事的两个时刻。
       反过来的错法：把大圆环也涂成蓝 —— 固定装置与可动小环就糊成一根蓝圈，看不出「谁套在谁上」。
     · 字体：Q 是题面里的记号，走 Georgia / Times New Roman 斜体（与本仓 `.sym` 一致）；
       字号写在 <text> 的 font-size 属性上，类里不写 font-size（否则 CSS 会盖掉属性）。
     ★ **图上不加任何受力 / 角度标注** —— 本题问的是「作用力大小在哪个点最大、最小」，
       在图上画出 N、mg 或标一个 θ，等于把解答过程印在图上；原题图只给小环、大圆环与 Q 三样，
       这里也只画这三样。竖直线与大圆环相切的那条「竖直线」同样不画：Q 的位置（最右点）
       本身已经说明了它是切点，画出切线反而多一条要解释的辅助线。 */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 大圆环：一根金圈，空心、无填充（环是铁丝，不是圆盘）；圆头收尾在这条闭合路径上不起作用，
     stroke-linejoin 用 round 让「画的不是完美圆」时也不出尖角 */
  .hoop {
    fill: none;
    stroke: #ffb900;
    stroke-width: 6.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 小环：空心小圈、**整圈**（题图里它就是一整枚环），环心正落在大圆环的最高点上 ——
     小环套在大圆环的线上，大圆环的线从它环洞里穿过。
     线宽比大圆环粗半号（7 : 6.5）：小环要「压在金线前面」的那一侧必须把 6.5 宽的金带整条盖住，
     同宽或更细都会在蓝圈边上漏出一丝金线，看着像画歪了。
     ★ 「谁在前面」不靠给小环开缺口来暗示（开缺口＝环断了一截，还得拿缺口宽窄去将就金带宽度），
       而靠**三层叠加**：金（整圈）→ 蓝（整圈）→ 金（左侧交点处一小段前置弧，见 <svg> 里的
       第二条 .hoop 路径）。两枚环互相套住的两处交叉因此一前一后，且两个环都还是完整的环。 */
  .ringlet {
    fill: none;
    stroke: #075bff;
    stroke-width: 7;
    stroke-linecap: round;
  }
  /* Q 点：实心小圆点，圆心精确落在大圆环最右点（竖直线与大圆环的切点） */
  .q-dot {
    fill: #075bff;
    stroke: none;
  }
  /* Q 记号：斜体衬线，正对着 Q 点的右侧，基线略低于切点高度（小写体的视觉中心压在切点上） */
  .q-label {
    fill: #075bff;
    font-family: Georgia, "Times New Roman", "KaiTi", serif;
    font-style: italic;
  }
</style>
</head>
<body>

<!-- 配 `10 机械能守恒定律.md` 的「真题 1」（2024 全国甲卷第 2-17 题）：光滑大圆环固定在竖直平面内，
     质量为 m 的小环套在大圆环上，自大圆环顶端由静止自由下滑，经 Q 点到底部；Q 为竖直线与大圆环
     的切点。问下滑过程中小环对大圆环的作用力大小怎么变（答案 C：先减小后增大）。
     图只画「装置 + 小环的起点 + Q 这个位置」，力的变化趋势一律不上图（见样式表末尾的 ★）。

     几何口径（1 单位 ≈ 1 画面点）：
       大圆环     圆心 O(300, 300)、半径 R = 210（直径 420），金、线宽 6.5
                  顶端 (300, 90)、底端 (300, 510)、最右 (510, 300)、最左 (90, 300)
       小环       圆心 = 大圆环**顶端** (300, 90)、半径 r = 22、蓝、线宽 7、**整圈**
                  ★ 圆心必须精确落在大圆环的线上：这样大圆环的线正好从小环的洞里穿过，
                    读作「套在环上」。把小环整个画在环外（圆心偏上）＝挂在钩上；
                    把小环画成实心点（半径 8 那档）＝贴在环上的一个标记，都丢了「套」这个动作。
                  ★ r = 22 ≈ R/9.5，与题图的比例一致（题图小环外径约为大圆环直径的 1/9）；
                    再大一点就看着像「大环带一个小环」的双环装置了。
                  ★ 叠加次序（三层，谁后画谁在前）：金整圈 → 蓝整圈 → 金短弧。
                    小环的圆心在金线上，两枚环的**中心线有两个交点** ——
                    (278.03, 91.15) 与 (321.97, 91.15)（把两条圆心线当圆求交，横向 ±21.97、
                    比顶端低 1.15，不是正 3 点 / 9 点，圆的弯曲所致），这两点就是「谁压谁」的两处交叉：
                      ① 第一遍金：大圆环整圈（<circle class="hoop">）
                      ② 蓝：小环整圈压在金线上面 —— 于是**右侧交点**金线钻到小环后面（看不见了）
                      ③ 第二遍金：大圆环在**左侧交点**那一小段再画一次（270 → 286，弧长 16 单位）
                         —— 这段弧压回蓝圈上面，于是左侧交点金线又跑到小环前面（看得见）
                    一前（左）一后（右），两枚环才真正「套住」；而且两个环都还是完整的环，
                    不是「蓝环缺一块」那种将就画法 —— 缺口法里缺口宽了像环断了、窄了金线卡在线帽上，
                    怎么调都不如这一小段前置弧干净。
                  ★ 前置弧为什么是 270 → 286：蓝圈在交点高度上的覆盖范围是 x ∈ [274.5, 281.5]
                    （外半径 25.5 / 内半径 18.5，交点 y = 91.15）。弧比它两头各多出 4.5 单位，
                    加上 round 线帽（半径 3.25）后，弧的两端落在**本来就有的金线上**
                    （左侧在外面的大圆环上、右侧在环洞里那段金线上），金压金看不出接缝；
                    反过来，弧若短到让线帽落在蓝圈上，就会露出两个半圆形的「断头」。
                  ★ 线宽必须蓝 7 > 金 6.5：右侧那处是蓝压金，蓝细一丝就会在金带上下各漏一条金线。
       起点位置   小环自顶端由静止开始 —— 图上的小环就停在这一处，就是「t = 0 的位形」，
                  不另画箭头、不画下滑的轨迹弧（题面用文字说了「经 Q 点自由下滑至其底部」，
                  画一条轨迹弧会把「先减小后增大」的答案暗示成一条路径）
       Q 点       圆心 = 大圆环**最右点** (510, 300)、实心、半径 8
                  ★ 为什么是最右点：题面「Q 为竖直线与大圆环的切点」—— 与大圆环相切的那条
                    竖直线只可能切在最左 / 最右两点上，而题面又说小环「下滑至其底部」的路上
                    经过 Q，故取最右点（下滑路线 顶端 → 右半环 → 底端）。
                    半径 8 是为了「圆点上再压一个 6 单位粗的环线」时点还看得见（点比环线粗）；
                    画到 4 以下就被环线吞掉了。
       Q 记号     Georgia 斜体 "Q"，x = 528（紧贴 Q 点右侧，留 10 单位空隙）、
                  基线 y = 314（= 切点 y + 14，44 px 字的半个 x 高度正好让视觉中心压在切点上）。
                  ★ 记号在右侧、不压环：压上去会和 Q 点、与环线三者叠成一团，
                    读者分不清「Q 标的是点还是那一段弧」。

     画的时候别踩的四个坑：
       ① 小环的圆心别放在大圆环外面（最简单的错法是「圆心 = 顶端 − r」，看起来也是套着，
          实际是骑在上面）；圆心就在 (300, 90) 这条线上；
       ② Q 点别随手点在四分之一弧的中间 —— 它是**最右点**，与圆心同高（y = 300），
          不是 45° 那一点；位置错一点，本题「力先减小后增大」的判读点就跟着错位；
       ③ 图上一律不加 N / mg / θ 与竖直线：见样式表末尾的 ★；
       ④ 两枚环的「套」只靠**一处前置、一处后置**：前置弧那一小段别忘、也别两头都加。
          只在左侧交点补一小段金弧（右侧交点留给蓝圈压住），两处交叉一前一后才是套住；
          两头都补＝金线在小环前面一路平推过去，等于没穿过；两头都不补＝金线整条躲在小环后面。 -->

<svg viewBox="-500 15 1800 555" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="竖直平面内固定一个光滑的大圆环，一枚小环套在大圆环的最高点上，大圆环的线在小环左侧从小环前面经过、在右侧钻到小环后面，两环互相套住；小环由静止开始下滑。大圆环最右侧的点标为 Q，Q 为竖直线与大圆环的切点，小环将经 Q 点滑到底部。">

  <!-- 大圆环：圆心 (300, 300)、半径 210，固定在竖直平面内 -->
  <circle class="hoop" cx="300" cy="300" r="210"/>

  <!-- 小环：整圈，圆心正落在大圆环顶端 (300, 90) —— 大圆环的线从它环洞里穿过，读作「套在环上」。
       画在大圆环**之后**：蓝圈因此压住金线，右侧交点处金线「钻到小环后面」。 -->
  <circle class="ringlet" cx="300" cy="90" r="22"/>

  <!-- 金线的第二遍（前置弧）：只补左交点这一小段，让金线在左侧回到小环前面 ——
       与上面那条蓝圈一前一后，两枚环才互相套住。路径就长在大圆环的圆心线上
       （心 (300,300)、R = 210），从 (270, 92.154) 沿圆顶向右到 (286, 90.467)，跨 4.4°。
       两端 round 线帽（半径 3.25）落在原本就有的金线上（左端在大圆环上、右端在环洞那段金线上），
       金压金看不出接缝；蓝圈在交点高度的覆盖范围是 x ∈ [274.5, 281.5]，这段弧两头各多出 4.5 单位，
       正好把蓝圈那一段盖干净。改长度时先量这两件事，别凭手感。 -->
  <path class="hoop" d="M270 92.154 A210 210 0 0 1 286 90.467"/>

  <!-- Q 点：大圆环最右点 (510, 300)，即竖直线与大圆环的切点 -->
  <circle class="q-dot" cx="510" cy="300" r="8"/>

  <!-- Q 记号：贴在 Q 点右侧，斜体衬线；基线比切点低 14，视觉中心与切点同高 -->
  <text class="q-label" x="528" y="314" font-size="44">Q</text>

</svg>

</body>
</html>
