<title>光滑水平桌面上左端固定在墙上的轻弹簧压着小球，释放后小球从桌面右端水平飞出并落到地面</title>
<style>
  /* 图框口径：与同目录 `01 example3.html`（弹簧 + 水平桌面）、`09 example4-1.html`、
     `10 example1-1.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是黑底 + 青线 + 蓝球，
       **不照抄那个底色**，只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例，须落在 0.2–5 之间
       （`Markdown/doc.html` 的 `htmlFigureRatio`，越界会退化成固定 240px 高）。
       本题图是一件横向排开的装置（墙 + 弹簧 + 球 + 桌面 + 桌腿 + 地面），画幅天生很宽：
       图元实测 bbox 为 x = 40 → 900、y = 190 → 546（860 × 356，比例 ≈ 2.42）。
       viewBox 取 1320 × 550（x 从 −190 到 1130、y 从 93 到 643，比例 ≈ 2.40），
       左右各留 230、上下各留 97 单位真空格；图元形心 (470, 368) 与 viewBox 中心
       (470, 368) 精确重合。留白一路照着同目录 `01 example3.html`（1800 × 380，图元只占帧宽
       四成）放宽，本图元本身更宽，故宽高一起加、两向留白按同一比例放：图元只占帧宽 65%、
       帧高 65%，与同目录其它装置图摆在同一篇文档里不至于一大一小。
       想让图再小一点就继续放大 viewBox（留白只写在 viewBox 里，不碰任何图元坐标），
       注意别超过 5 的比例上限 —— 高 550 时 viewBox 宽最多 2750。
     · 配色（两色，别再加第三种）：
         墙 / 桌面（含板厚）/ 桌腿 / 地面（含斜线） ....... #ffb900（金色，同
                                                          `01 example3.html` 的「桌面 + 地面斜线」、
                                                          `10 example1-1.html` 的「大圆环」：
                                                          图上的装置 / 支架一律走金）
         轻弹簧 / 小球 ................................. #075bff（深蓝，同
                                                          `01 example3.html` 的「滑块 / 弹簧」：
                                                          「能动的那一件」走深蓝）
       本题要读的只有**两件会动的东西（弹簧、小球）**与**一套不动的支架（墙、桌面、桌腿、地面）**，
       两色正好一刀切开：蓝的是「这道题在考的那一段」，金的是「它待着的地方」。
       反过来的错法：把弹簧涂成金 —— 弹簧与墙、桌面糊成一套静止支架，读者会读成「球顶着墙」；
       把小球涂成金 —— 本图里唯一会飞出去的东西反而不显眼了。题图原稿的青色弹簧这里不用：
       本仓两色口径里没有第三支线，且同目录 `01 example3.html` 的弹簧已经是深蓝。
     · 字体：本图**没有任何文字记号** —— 题面里的 Ep、m、h、v0 全是待求量或已知量的字母，
       一写上图就变成「图里给了、题干没给」的第二个信息源（见下面「不该画的东西」）。 */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 墙 / 地面主视棱：一根粗实线就是主视棱 */
  .rigid {
    fill: none;
    stroke: #ffb900;
    stroke-width: 5;
    stroke-linecap: round;
  }
  /* 桌面板：比墙、地面再粗半号 —— 桌面是本题的「跑道」，压得住整幅图的下半截 */
  .plank {
    fill: none;
    stroke: #ffb900;
    stroke-width: 6.5;
    stroke-linecap: round;
  }
  /* 板厚 / 桌腿双线 / 地面斜线 / 墙面斜线：细一号，不跟主视棱争 */
  .rigid-thin {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  /* 轻弹簧：折线（锯齿）画法，与同目录 `01 example3.html` 同一支线、同一粗细 */
  .coil {
    fill: none;
    stroke: #075bff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 小球：实心蓝盘（题图原稿就是一整颗实心球；同目录 `09 example4-1.html` 的「重物」也是
     实心 —— 一件实体就涂实，别画成空心圈，空心圈容易被读成「环」或「质点标记」） */
  .ball {
    fill: #075bff;
    stroke: #075bff;
    stroke-width: 3;
  }
</style>

<body>

<!-- 配 `10 机械能守恒定律.md` 的「真题 3」（2023 全国甲卷第 3-24 题）：
     光滑水平桌面上有一轻质弹簧，左端固定在左侧竖直墙面上，右端压着一个质量为 m 的小球，
     使弹簧的弹性势能为 Ep；释放后小球在弹簧作用下从静止开始沿桌面运动，与弹簧分离后从桌面
     右端水平飞出，落到地面上（反弹过程题面用文字给出，图上不画）。
     本图只画「释放之后、小球还贴着弹簧」这一瞬的装置位形：题面第一问要的就是这一段结束时
     （离开桌面时）的速度 v0，第二问才是「飞出之后的平抛 + 反弹」。

     装置的几何口径（1 单位 ≈ 1 画面点）：
       · 地面主视棱   y = 520（x = 40 → 900，两端都伸到桌腿之外，与题图同）
       · 地面斜线     自主视棱向下左斜 26 × 26 到 (x − 26, 546)，x = 70 → 870 每 40 一道，共 21 道
       · 桌面主视棱   y = 300（x = 130 → 830，粗 6.5）
       · 桌面板厚     y = 312（细 2.4），两端 x = 130 / 830 各一段竖线 y = 300 → 312 收口 ——
                      桌面因此读成「一块有厚度的板」，不是一根线；左端伸出墙面 40 单位
                      （题图同：桌沿伸到墙的左边一点，读作「墙立在桌面上」而不是「墙在桌外」）
       · 桌腿         双线 x = 744 / 752，自板厚 y = 312 落到地面 y = 520（与 `01 example1.html`
                      的桌腿同一画法：两根细线夹出一条腿，不涂实）
       · 墙面         x = 170，自 y = 190 落到桌面上 y = 300；墙面斜线 4 道，
                      自 (170, y) 向下左 24 × 24 到 (146, y + 24)，y = 198 / 220 / 242 / 264
                      —— 斜线只画在墙的**左侧**、且全部落在桌面主视棱**之上**（见下面坑 ③）
       · 轻弹簧       轴线 y = 252，x = 170 → 524（左端贴在墙面上，右端顶在球的左极点上）
                      折线画法照本仓 `静态弹簧` 那套：导杆 → 半格进锯齿 → 等距锯齿 → 半格回中线 → 导杆
                        两端导杆   170 → 190、504 → 524（各 20 长，落在轴线 y = 252 上）
                        锯齿段落   204 → 484，15 个折点、每 20 一个（8 上 7 下），
                                   振幅 46：上折到 y = 206、下折到 y = 298
       · 小球         圆心 (572, 252)、半径 48、实心蓝；底端正好落在桌面主视棱 y = 300 上
                      → 球心与弹簧**同轴**（都在 y = 252），读作「弹簧顶着球的中心高度推它」

     判读用到的三件对齐关系（图上一眼可查，也是本题读图最容易被画坏的三处）：
       ① 球心 (572, 252) 与弹簧轴线 y = 252 同高 —— 弹力沿桌面方向、过球心，球不会绕心转；
       ② 球底 y = 300 = 桌面主视棱 —— 球坐在桌面上；球心 = 300 − r = 300 − 48；
       ③ 弹簧锯齿下折到 y = 298，与桌面 y = 300 只差 2 单位 —— 弹簧躺在桌面上（题面「光滑
          水平桌面上有一轻质弹簧」，弹簧不是悬空的）。这三条一旦错开，图就读成「球悬空被弹簧
          顶着」或「弹簧穿过球」。

     图上**没有画、也不该画**的东西：
       · 不画平抛轨迹、不画落地反弹的抛物线、不画 h：题面第二问才处理「飞出之后」，图画出来
         等于把第二问的答案（落点、反弹高度）提前摆在图上；题图原稿也只有装置、没有轨迹。
       · 不标 Ep / m / v0 / h / Δx：题面只用文字给出，题图也不标。一标就变成「图里给了、
         题干没给」的新条件 —— 尤其 Ep 与 h 正是两问的未知量。
       · 不画任何力（弹力、重力、支持力）：本题问的是机械能守恒（ΔEk = −ΔEp），受力分析
         不属于这张装置图；力箭头一上，读者会去找「合外力做功」而不是「谁的能量转给了谁」。
       · 弹簧锯齿的**疏密不表示压缩量**：题面只说「使弹簧的弹性势能为 Ep」，没给压缩量 Δx。
         把锯齿画得特别密／特别疏，都会被读成一个已知的压缩状态；故本节图按等距折线一次画成，
         只表达「弹簧还被球压着」，不表达「压了多少」。
       · 不画球飞出后的位置、不画弹簧恢复原长：图停在「球仍贴着弹簧」这一瞬，
         球与弹簧右端在 x = 524 处相接，留出「接下来才会分离」这件事本身。

     画的时候别踩的五个坑：
       ① 球心别偏离弹簧轴线：球心 y 必须等于 252（= 桌面 300 − 半径 48）。改半径时球心跟着改，
          只改半径就会让球陷进桌面或浮在桌面上方；
       ② 球的左极点必须正好接住弹簧右端：球心 x = 572、r = 48 ⇒ 左极点 x = 524，弹簧末段导杆
          必须停在 524；停在 524 左边＝弹簧没顶到球，右边＝弹簧戳进球里；
       ③ 墙面斜线只画在墙的左侧、并且不越过桌面主视棱：画到桌面上会与桌面、地面斜线混成一片，
          读者分不清哪一道是墙、哪一道是地；
       ④ 桌面右端要伸出桌腿与球：球右缘 x = 620、桌腿 x = 744、桌沿 x = 830 —— 桌面必须比球长
          出一截（题面「从桌面水平飞出」需要有一段桌面可跑），桌腿也不许顶在桌沿上；
       ⑤ 弹簧的折线是**一笔**画成的折线（不是一串叠起来的椭圆）：两端导杆严格落在轴线 y = 252 上，
          折点上下严格交替，别让某一折的 y 差一个数量级 —— 那一段会看着像弹簧打了个结。 -->
