<!-- 配 `09 动能定理.md` 的「真题 4」（2024 全国新课标卷第 3-24 题）**解析里的第二张图**：
     `09 example4-1.html` 画的是题面那个姿态（两条绳与竖直方向各成 α、β），本图画的是解析的第一步 ——
     「对重物受力分析，如图」：把三支真实的力（T_P、T_Q、mg）正交分解到**竖直 / 水平**两条轴上，
     第 (1) 问的两个方程就是从这张图上一眼读出来的。

     题意回顾：重物 m = 42 kg 被两根绳拉着**缓慢竖直下降**，P 绳与竖直方向成 α = 37°、Q 绳与竖直方向成 β = 53°。
     求 T_P、T_Q（第 (2) 问是拉力做的总功，用动能定理另算，与本图无关）。

     ★ 这张图为什么能成立（图上不写，写在这里）：**缓慢** ⇒ 重物加速度为零 ⇒ 三力平衡。
       于是把 T_P、T_Q 各自分解成「沿绳所在方向的两个直角边」——
         水平：T_P sinα 向左，T_Q sinβ 向右，二者等大反向  ⇒  T_P sinα = T_Q sinβ
         竖直：T_P cosα 向上，mg 与 T_Q cosβ 都向下          ⇒  T_P cosα = T_Q cosβ + mg
       两式联立即解析里的 T_P = 1200 N、T_Q = 900 N。

     几何口径（1 单位 ≈ 1 画面点）：
       公共作用点 C  (500, 420) —— 三支力、四个分量**七支箭头都从这里起画**（受力分析取的是同一个作用点）。
                     图上不画重物本体：`09 example4-1.html` 已经把金块画过了，本图是「对重物受力分析」，
                     再画一块金块会把七支箭头的起点挡住，读者反而找不到公共作用点。
       ★ 力的标度：**1 单位 = 4 N**，四个分量与三支力用的是**同一支标度** —— 长度比就是力的大小比：
           T_P   1200 N → 300 单位      T_Q    900 N → 225 单位      mg     420 N → 105 单位
           T_Pcosα 960 N → 240 单位     T_Psinα 720 N → 180 单位
           T_Qsinβ 720 N → 180 单位     T_Qcosβ 540 N → 135 单位
         于是图上直接量得出两条结论：**左右两支水平分量等长（180 = 180）**、
         **T_Pcosα（240）正好等于 mg（105）+ T_Qcosβ（135）** —— 前一条是两支水平箭头等长摆出来的，
         后一条要靠同一支标度把竖直轴上那两支**同向叠加**的长度加起来（短 105、长 135、和 240，
         与向上那支 T_Pcosα 的 240 对上）。
         改了 m、g 或两个角，就得按新数重算这七支箭头的长度（比例关系：l = F / 4）。
       ★ 取角：题面给的是 sin37° = 0.6，本图按 3-4-5 直角三角形的精确取向画（36.87° / 53.13°，
         与 `09 example4-1.html` 直接画的 37° / 53° 差 0.3°，肉眼不可辨），好处是分量的长度
         **严格**等于力的长度乘 sin / cos，尖端也对得上矩形的角：
           T_P 方向 (−sinα, −cosα) = (−0.6, −0.8) → 尖端 (320, 180)
                 = T_Pcosα 尖端 (500, 180) 与 T_Psinα 尖端 (320, 420) 张开的那个矩形的对角 ✓ 严格闭合
           T_Q 方向 (+sinβ, +cosβ) = (+0.8, +0.6) → 尖端 (680, 555)
                 = T_Qsinβ 尖端 (680, 420) 与 T_Qcosβ 尖端 (500, 555) 张开的那个矩形的对角 ✓ 严格闭合
         ⇒ 两支斜箭头各自与它的两条直角边张成一个**严格闭合**的矩形（边长就是 F·sin、F·cos）。
           本图仍**不画**虚线的矩形闭合边：四个分量本身就是那四条边，再描一遍只是重复；
           而 T_Q 一侧要补的那两条虚线（(680,420)→(680,555)、(500,555)→(680,555)）还会在右下角
           多出一个 L 形，与 T_Q 的箭头尖挤在一起，读起来像第四支力。
       ★ mg 与 T_Qcosβ **同向同轴**（都沿竖直方向向下、都从 C 起画），本图让它们**在同一条竖直线上叠加**，
         靠**图层**分开而不是靠位置分开：
           先画 T_Qcosβ（青、杆加宽到 7.0、长）.... C → (500, 555)，135 单位 = 540 N
           后画 mg（蓝、杆 4.2、短）............... C → (500, 525)，105 单位 = 420 N，压在它上面
         ⇒ 0 → 525 这一段：蓝的 mg 压在青的上面，青的从两侧各露出 1.4 单位（像一条衬底），
           读者看到的是「两支箭头同起点、同方向、一短一长」，而不是一支；
           525 → 555 这 30 单位：mg 已经收尾，青的杆身与**它自己的箭头尖**完整露出来。
           两个箭头尖（蓝的在 525、青的在 555）都在图上，长度差 30 单位 = 120 N 也可量。
         ★ 为什么给这一支加宽（`class="comp comp-under"`、stroke 7.0，箭头换 `arrowCompUnder`）：
           若与其余三支一样宽（3.2），0 → 525 全被 mg 的杆（4.2）盖住，只剩 525 → 555 那 30 单位，
           读者会把 T_Qcosβ 当成长 30 的一小截；加宽到 7.0 才让「它也在轴上、也长 135」读得出来。
           箭头必须换成按 3.2 / 7 反比缩小的 marker —— markerUnits 随 strokeWidth 缩放，不换就大三倍。
         ★ 为什么不做成「首尾相接的接力」（青的从 525 起画到 660）：那样竖直向下的总量会读成
           「从 C 一路到 660」，而题面的竖直平衡是**两支各有各的起点 C**（T_Pcosα = mg + T_Qcosβ）；
           位置一挪，两支力就不再共点。
         ★ 也不能左右错开画：那是制图上的「并列」，会让人以为竖直分量不在竖直轴上，
           而且往右错 40 单位就撞上 T_Q 自己的杆身（右下 36.87°）。
       α 的弧 圆心 C、半径 48：自「竖直向上」(500, 372) 转到 T_P 方向 (471.2, 381.6)，扫过 36.87°
       β 的弧 圆心 C、半径 48：自「竖直向下」(500, 468) 转到 T_Q 方向 (538.4, 448.8)，扫过 53.13°
         ★ 两段弧的起点都落在竖直轴上（α 起点在 T_Pcosα 的杆身上、β 起点在 mg 的杆身上）——
           这正确：角度本来就是从「竖直方向」量起的，弧必须从那根轴上起笔（弧端点压在杆身上不算压线）。
         ★ 半径取 48（同门 `01 example6-2.html` 那种「顶点 + 弧」的图取 70，是因为那里只有一支 F 要量；
           本图 C 点周围挤着七支箭头与九个记号，弧一大就顶到 T_Q 的杆身与 mg、β 两个记号）。
           弧再小到 ~30 以下就退化成一点，读者认不出是角；48 是「整段落在 C 附近空档里、
           又不与两支斜箭头相交」的那个值。
       记号位置（9 个都用浏览器实测 getBBox 调过；改字号或挪箭头请重测 —— 每个记号到最近的那条线
       都不低于 13 单位，小于 10 单位就读成压在线上）：
           T_P (315, 266) ......... T_P 箭头的外侧（左下），实测离箭杆 23.2
           T_Q (669, 476) ......... T_Q 箭头的外侧（右上），实测离最近的水平轴 25.0
           T_Pcosα (520, 250) ..... 竖直轴上段的右侧，离轴 20.0
           T_Psinα (370, 386) ..... 水平轴左段的**上方**，离轴 19.8（写在下方会撞 mg 的记号）
           T_Qsinβ (612, 386) ..... 水平轴右段的上方，离轴 19.8
           mg (482, 470) .......... mg 箭头的**左侧**，离轴 18.0（右侧那条竖带上压着 β 的弧与 T_Q 的杆身）
           T_Qcosβ (482, 545) ..... 同一条竖直线的**中下段**左侧，离轴 18.0（到那条加宽到 7.0 的
                                    青色衬底边 14.5）—— 与 mg 的记号同一列（右缘都在 x = 482）、
                                    上下分开 75，读者顺着这一列把「一支短、一支长」对上两支箭头
           α (470, 320) ........... T_P 与竖直轴之间的角平分线附近，离两线 23 / 20、离弧 ≥ 50
           β (546, 509) ........... T_Q 与竖直轴之间，离两线 13.1 / 46、离弧 ≥ 25
         ★ 九个记号里最紧的是 β（13.1）：β 的夹角只有 53°、又被 T_Q 的杆身与 β 的弧夹在中间，
           再往杆身挪就压线、再往后挪就撞 mg 的记号 —— 要改这一带，先改 β 的字号（34 → 30）。

     图上没有画、也**不该**画的东西：
       · 重物本体、绳子、两人、楼墙与窗台：`09 example4-1.html` 已画全；本题受力分析只需要
         「三支力 + 两条轴」，画上装置会把七支箭头埋进线稿里。
       · 速度箭头的方向与大小：题面说的是「缓慢」，v ≈ 0；画一支速度箭头就自相矛盾。
       · 数值 37°、53°、m = 42 kg、g = 10 m/s²，以及答案 1200 N / 900 N：数值属题面与解答，
         图上只留符号；写上去改一版就要两处一起改，而且读者会照着图上数字反推过程。
       · T_P 与 T_Q 的合力、以及「合力为零」的闭合三角形：本题要的是**两个方向上的两个方程**，
         画合成三角形会把「正交分解」这条思路换成「合成」，与解析的写法不一致。

     判读用的定量关系（写在这里方便以后改图时对账，图上不出现）：
       · 水平：T_P sin37° = T_Q sin53°  ⇒  0.6 T_P = 0.8 T_Q  ⇒  T_P = 4T_Q/3
       · 竖直：T_P cos37° = T_Q cos53° + mg  ⇒  0.8 T_P = 0.6 T_Q + 420
       · 联立 ⇒ T_Q = 900 N、T_P = 1200 N ✓（图上 300 : 225 = 4 : 3，正是 1200 : 900）
       · 自洽核验：左右水平分量 720 N = 720 N ✓；竖向上 960 N = 下 540 + 420 = 960 N ✓
       · 判读方向：α < β ⇒ P 绳更陡 ⇒ T_P > T_Q（1200 > 900）。图上若把 T_P 画得比 T_Q 还平，就是画反了。 -->

<svg viewBox="-300 125 1600 500" xmlns="http://www.w3.org/2000/svg" role="img"

  <defs>

  <path class="comp" d="M500 420 H680" marker-end="url(#arrowComp)"/>
