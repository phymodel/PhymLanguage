<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>铁架台上倾角 θ 可变的光滑长平板，小物块自 Q 滑向 P</title>
<style>
  /* 图框口径：与同目录 `01 example1.html`／`01 example2.html`／`01 example3.html`、
     `11 example1-1.html`、`1 力学/1 运动学/09 example1.html` 同一套。
     · 页面**不上底色** —— iOS / visionOS 是玻璃主题，图要让窗口材质透出来；自己在页面里糊一块
       实色底板，Markdown 侧会认出「作者画了底板」而不再注入画布（MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`），里外两块底互相打架。题图原稿是黑底金线，**不照抄那个底色**，
       只把线稿搬进本仓这套配色。
     · **由比例定尺** —— 图框形状读的就是本文件 viewBox 的比例（须落在 0.2–5 之间）。
       本题图是一件**立着**的装置（竖直杆 + 底座 + 斜靠的平板），画幅天生接近方形：图元占
       x = 100 → 543、y = 50 → 508（浏览器实测 getBBox），故 viewBox 取 800 × 570（比例 ≈ 1.40）：
       x 从 −78 到 722（左右各留约 178 / 179），y 从 −6 到 564（上下各留约 56 / 56）。
       想让图再小一点就继续加宽 viewBox（留白只写在 viewBox 里，不碰任何图元坐标）。
     · 配色（三色分工，别再加第四种）：
         铁架台（竖直杆 / 底座 + 底座斜线 / 挡板 P / 横杆）...... #ffb900（同 `11 example1-1.html`
                                                                  的「支撑面 / 轴」口径）
         光滑长平板 .............................................. #075bff（同 example1 / example3 的
                                                                  「可动件」口径）
         小物块 Q 与它的记号 Q ................................... #00eaff（同 example1 的 a-m 图线、
                                                                  example2 的「甲」「乙」那支青色）
         夹角 θ 的弧与 θ 记号 .................................... #ffb900（几何标注，与轴名同口径）
       金 = 不动的装置，深蓝 = 板（本题的斜面本体），青 = 唯一的可动件物块。
       板靠在横杆上、杆又穿过板，两者本来就在同一处叠着画；物块又正好压在这个交点上，
       板上再挤一个蓝色进去就分不清谁是谁，所以只把物块（连同它的记号 Q）提亮成青色。
       记号跟自己的图元同色，是 example3 定下的规矩 —— 一眼就能对上「哪个字母是哪个东西」。
     · 字体：P、Q、θ 是题面里的记号，走 Georgia 斜体（与本仓 `.part-label` 一致）；
       「光滑长平板」「横杆」「铁架台」是装置名（汉字，不是变量），走汉字字体栈 + 正体 ——
       Georgia 没有汉字，不换栈会掉字（同 `01 example2.html` 的 `.body-label`）。 */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* 铁架台的杆件与底座：一根粗实线就是主视棱 */
  .rigid {
    fill: none;
    stroke: #ffb900;
    stroke-width: 5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 底座斜线：粗面记号，细一号，不跟主视棱抢 */
  .hatch {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-linecap: round;
  }
  /* 长平板：深蓝（本题的斜面本体） */
  .part {
    fill: none;
    stroke: #075bff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 小物块 Q：青色。全图只有它一件「会动的东西」，又要落在「板 × 杆」这个本就拥挤的交点上，
     继续用深蓝会跟板糊成一片；提亮成青色，一眼就能找到释放点。 */
  .block {
    fill: none;
    stroke: #00eaff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* 夹角 θ 的弧：几何标注，细一号 */
  .angle-arc {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.6;
    stroke-linecap: round;
  }
  /* 装置名的引线：细，且与自己的字同色，不与图元抢 */
  .leader-rigid {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2;
    stroke-linecap: round;
  }
  .leader-part {
    fill: none;
    stroke: #075bff;
    stroke-width: 2;
    stroke-linecap: round;
  }
  /* 题面给的记号 P（挡板）/ Q（物块）/ θ（夹角）：斜体 */
  .point-rigid {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 36px;
  }
  .point-part {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 36px;
  }
  .angle-name {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 34px;
  }
  /* 装置名（汉字，不是变量）：正体 */
  .device-rigid {
    fill: #ffb900;
    font-family: -apple-system, "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif;
    font-style: normal;
    font-size: 30px;
  }
  .device-part {
    fill: #075bff;
    font-family: -apple-system, "PingFang SC", "Heiti SC", "Microsoft YaHei", sans-serif;
    font-style: normal;
    font-size: 30px;
  }
</style>
</head>
<body>

<!-- 配 `01 牛顿第二定律.md` 的「真题 4」（2021 全国甲卷第 2-14 题）：
     铁架台的竖直杆上夹一根水平横杆，一根光滑长平板的下端顶在底座右端的挡板 P 处、上部架在横杆上；
     横杆高度可调 ⇒ 平板与底座之间的夹角 θ 可变。小物块从「平板 × 竖直杆」的交点 Q 静止释放，
     沿板滑到 P，问 θ 由 30° 增到 60° 时下滑时间 t 怎么变。
     本图画「θ 取某一中间值」的那一瞬装置 —— 题面只给一件装置 + 一个可变的 θ，没有第二幅图，
     所以不替读者把 30° / 60° 两个位形都画出来，也不在图上写具体角度值。

     装置的几何口径（1 单位 ≈ 1 画面点）：
       · 竖直杆      x = 240，自 y = 50 落到 y = 460（杆顶高过平板的上端，与题图同）
       · 底座主视棱  y = 460，x = 180 → 506（向左、向右都伸出竖直杆，与题图同）
       · 底座斜线    11 道，间距 28（x = 210 → 490），自主视棱向下左斜 16 × 26
       · 挡板 P      竖直小板 (498,430)–(506,460)，立在底座最右端，高出底座 30
       · 光滑长平板  上表面过 (497,450) 与 (143,96) —— **斜率 1，即图中的 θ = 45°**；
                    板厚 14（厚度落在左下侧，上表面朝右上 —— 物块踩的就是这一面，这一面的下端
                    (497,450) 正顶在挡板上）；四角 (497,450) → (143,96) → (133,106) → (487,460)
                    下端的两个角正好卡在「挡板内侧面 x = 498」与「底座主视棱 y = 460」之间，
                    读起来就是「下端置于挡板 P 处」；上端越过竖直杆向左伸出 97 单位
                    （「架在横杆上」的板必然要探出支撑点，不能画成止于杆上）
       · 横杆        水平小板 (210,213)–(240,222)，自竖直杆**向左**伸出 30，顶棱 y = 213。
                    为什么向左而不是向右：下表面是 y = x − 27，在杆处 (240,213) 与横杆顶棱相切；
                    往左（x 变小）下表面升到 213 以上，横杆整根落在板的下表面之下，读起来就是
                    「板架在杆上」；往右（x 变大）下表面降到 213 以下，杆反而浮到板面之上，
                    托不住板，也画成了一条和板不相干的横线。
       · 物块 Q      边长 24 的方块，底边贴着平板上表面，中心正落在「平板 × 竖直杆」交点处
                    (240,193)：题面说的是「由交点 Q 处释放」，方块就该骑在这个点上，
                    不画成放在板中央或压在杆上
       · 夹角 θ      弧的顶点取「板的下表面与底座主视棱的交点」(487,460)，半径 90：
                    起点 (423,396) 落在板的下表面上、终点 (397,460) 落在底座主视棱上，扫过 45°。
                    **顶点必须取在下表面这一侧** —— 靠 P 的那个可见空档是「下表面 + 底座」围成的；
                    若拿上表面 (507,460) 当顶点，弧会有一小段钻进板身里。θ 的字心要落在弧与顶点
                    之间，并离板面 / 底座各留 ≥ 9 单位，否则字会压在线上。

     图上没有画、也**不该**画的东西：
       · 不画 θ 的数值（30° / 60° 是选项里的极限，画到图上就成了「图里给的已知量」）。
       · 不画加速度、重力分量、摩擦力箭头：本题的判读点全在 t(θ) 的单调性，图上一堆箭头反而
         让人以为要现场受力分析；题面也只给了装置，没有受力图。
       · 不标 l、不画「Q 到 P 的板长」的尺寸线：题面没有这两个量，图上多一笔就多一个条件。

     判读用的定量关系（写在这里，方便以后改图时对账，图上不出现）：
       · l ≡ P 到竖直杆的水平距离 = 498 − 240 = 258（挡板位置固定，l 不随 θ 变）；
         Q 到 P 的滑行距离 = l / cos θ，θ = 45° 时 = 258/0.7071 ≈ 365，正好等于图上从 Q(240,193) 到
         板下端 (497,450) 那段板长 ≈ 363.5 —— 图与式子自洽，改图时要维持这个对应。
       · 沿板：a = g sin θ（板光滑，无摩擦项）；又 l/cos θ = ½at²
         ⇒ t = √( 4l / (g sin 2θ) )。
       · θ: 30° → 60° 时 2θ: 60° → 120°，sin 2θ 先增（45° 处取 1）后减 ⇒ t 先减小后增大 ⇒ D 对。
         注意 t 的极值在 θ = 45°，不在所给区间的哪一端 —— 图上把 θ 画在 45° 附近，正是极值位形，
         比画 30° 或 60° 更能说明「两头都比中间慢」。 -->

<svg viewBox="-460 -6 1600 570" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="装置示意图：一个铁架台由竖直杆和水平的底座组成，底座右端立着一块挡板 P。一根光滑长平板的下端顶在挡板 P 处、靠着底座，板身斜向上越过竖直杆并向左上探出，上部架在竖直杆上向左伸出的水平横杆上；平板与底座之间的夹角为 θ。一个小物块 Q 静止放在平板与竖直杆的交点处，将沿平板滑向 P。">

  <!-- ═══════════════════ 铁架台：竖直杆 + 底座 ═══════════════════ -->
  <!-- 竖直杆：杆顶高过平板上端（题图同），杆底正好落在底座主视棱上 -->
  <path class="rigid" d="M240 50 V460"/>
  <!-- 底座主视棱：左右都伸出竖直杆 -->
  <path class="rigid" d="M180 460 H506"/>
  <!-- 底座斜线：11 道，间距 28 -->
  <path class="hatch" d="M210 460 L194 486 M238 460 L222 486 M266 460 L250 486 M294 460 L278 486 M322 460 L306 486 M350 460 L334 486 M378 460 L362 486 M406 460 L390 486 M434 460 L418 486 M462 460 L446 486 M490 460 L474 486"/>

  <!-- 挡板 P：立在底座最右端的小竖板（平板下端顶在它的内侧面上） -->
  <rect class="rigid" x="498" y="430" width="8" height="30"/>

  <!-- 横杆：夹在竖直杆上、向左伸出的水平小板，顶棱与平板下表面在杆处相切 -->
  <rect class="rigid" x="210" y="213" width="30" height="9"/>

  <!-- ═══════════════════ 光滑长平板 ═══════════════════ -->
  <!-- 上表面：y = x − 47 这条 45° 直线，自挡板内侧 (497,450) 向左上到 (143,96)；
       下表面 y = x − 27，自底座上 (487,460) 到 (133,106)；两端封口连成一个 14 厚的板 -->
  <polygon class="part" points="497,450 143,96 133,106 487,460"/>

  <!-- ═══════════════════ 小物块 Q：骑在「平板 × 竖直杆」交点上 ═══════════════════ -->
  <!-- translate(240 193) rotate(-135)：先把局部原点搬到交点 (240,193)，再绕**这个原点**把方块转到与
       板面贴合 —— 局部 +x 沿板的左上方向、局部 +y 沿板的上表面法向；于是 rect 的底边 y = 0 正好落在
       板的上表面上。**rect 的 x 就是「方块底边中点 → 交点 Q」的有向距离**：x = −12 时底边中点正落在
       Q (240,193) 上（题面「由交点 Q 处释放」的位形）；本版取 x = −160，即方块沿板下滑到 Q 下方
       148 单位处。挪位置只改这一个数，别动 y（y 一非 0 方块就离开板面）。
       注意**不能**写成 rotate(-135 240 193)：那个 (240,193) 是父坐标系的点，而 rect 的局部坐标在原点
       附近，绕它一转方块会被甩到画布下方（本图第一版就踩了这个坑，方块跑到了底座下方）。 -->
  <g transform="translate(240 193) rotate(-135)">
    <rect class="block" x="-160" y="3" width="24" height="24" rx="1"/>
  </g>

  <!-- ═══════════════════ 夹角 θ ═══════════════════ -->
  <!-- 顶点 (487,460) = 板的下表面与底座主视棱的交点；r = 90，从下表面 (423,396) 扫到底座 (397,460)。
       顶点只能取在下表面这一侧：靠 P 的可见空档由「下表面 + 底座」围成，取上表面当顶点，弧会钻进板身。 -->
  <path class="angle-arc" d="M450 426 A30 30 0 0 0 436 460"/>
  <text class="angle-name" x="415" y="440" text-anchor="middle">θ</text>

  <!-- ═══════════════════ 记号与装置名 ═══════════════════ -->
  <!-- P：挡板，写在挡板右侧、底座高度上 -->
  <text class="point-rigid" x="520" y="458">P</text>

  <!-- Q：物块，写在方块右上，避开板面与引线 -->
  <text class="point-part" x="255" y="188">Q</text>

  <!-- 光滑长平板：右上角，引线落到板上的一点 (301,254) -->
  <text class="device-part" x="335" y="148">光滑长平板</text>
  <path class="leader-part" d="M334 156 L301 254"/>

  <!-- 横杆：杆的左侧，引线落到横杆左端 -->
  <text class="device-rigid" x="104" y="262">横杆</text>
  <path class="leader-rigid" d="M170 252 L211 219"/>

  <!-- 铁架台：写在竖直杆左侧的空档里，引线自上而下落到主视棱上。
       不写在底座正下方：那里要和底座斜线抢位置，引线势必横切一排斜线。 -->
  <text class="device-rigid" x="100" y="412">铁架台</text>
  <path class="leader-rigid" d="M194 416 L205 456"/>

</svg>

</body>
</html>
