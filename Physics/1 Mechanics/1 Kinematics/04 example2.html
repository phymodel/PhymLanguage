<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four x–t graphs</title>
<style>
  /* Figure-frame conventions: the same set as `01 VelocityImage.html` in this folder.
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the
       window material show through. Painting a solid plate inside the page (this file used to carry
       background:#000) has two consequences: an off-colour block sits on the glass panel; and as soon as the
       Markdown side recognises that "the author drew a plate" it stops injecting the canvas (see
       MarkdownHtmlFigure.swift `declaresOwnPageBackground`), so the two plates fight each other.
     · **Size comes from the aspect ratio** — the figure frame takes its shape from this document's own viewBox
       ratio (the Markdown side reads that ratio and requires it to lie between 0.2 and 5; outside that range the
       frame degenerates to a fixed height of 240 px), the svg fills the height of the frame, and whatever is left
       at the sides is empty space. */
  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  .axis, .curve, .guide {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .axis  { stroke: #ffb900; stroke-width: 2.9; }
  .curve { stroke: #0865ff; stroke-width: 3.3; }
  .guide { stroke: #0865ff; stroke-width: 2; stroke-dasharray: 5 7; }
  text {
    font-family: Georgia, "Times New Roman", serif;
    fill: #ffb900;
  }
  .var    { font-size: 26px; font-style: italic; }
  .origin { font-size: 26px; font-style: normal; text-anchor: middle; }
  .tick   { font-size: 24px; font-style: italic; text-anchor: middle; }
  .sub    { font-size: 16px; font-style: normal; }
  .panel  { font-size: 34px; text-anchor: middle; }
</style>
</head>
<body>

<!-- Canvas: viewBox ratio = 1534 / 338 ≈ 4.54 (inside the 0.2–5 range the Markdown side accepts, otherwise the frame
     cannot take the ratio); the artwork keeps about 18 units of white margin on every side, and A/B/C/D together
     with x / t, O, t₁ and t₂ on the axes all stay inside the frame. -->
<svg viewBox="12 9 1534 338" role="img"
     aria-label="Four x-t graphs A, B, C and D: A is a broken line, B is a curve that always rises, C is a parabolic arch symmetric about t1, and D is an S-shaped curve">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#ffb900" stroke-width="1.2"/>
    </marker>

    <!-- Shared coordinate system: origin (59,227), the horizontal axis up to 335, the vertical axis up to 40 -->
    <g id="axes">
      <path class="axis" d="M59 227 V40" marker-end="url(#arrow)"/>
      <path class="axis" d="M59 227 H335" marker-end="url(#arrow)"/>
      <text class="var" x="75" y="52">x</text>
      <text class="var" x="348" y="238">t</text>
      <text class="origin" x="40" y="252">O</text>
    </g>
  </defs>

  <!-- A: increases uniformly first, then decreases uniformly (a broken line, apex at t₁) -->
  <g id="A">
    <use href="#axes"/>
    <path class="curve" d="M59 227 L159 151 L259 227"/>
    <path class="guide" d="M159 151 V227"/>
    <text class="tick" x="159" y="257">t<tspan class="sub" dy="6">1</tspan></text>
    <text class="tick" x="259" y="257">t<tspan class="sub" dy="6">2</tspan></text>
    <text class="panel" x="197" y="320">A</text>
  </g>

  <!-- B: a curve that keeps increasing -->
  <g id="B" transform="translate(390 0)">
    <use href="#axes"/>
    <path class="curve"
      d="M59 227
         C69 202 91 185 119 174
         C139 167 153 168 163 167
         C183 164 206 153 226 139
         C246 124 258 106 269 92"/>
    <path class="guide" d="M159 167 V227"/>
    <path class="guide" d="M269 92 V227"/>
    <text class="tick" x="159" y="257">t<tspan class="sub" dy="6">1</tspan></text>
    <text class="tick" x="269" y="257">t<tspan class="sub" dy="6">2</tspan></text>
    <text class="panel" x="197" y="320">B</text>
  </g>

  <!-- C: a parabolic arch symmetric about t₁ (the apex sits directly above t₁, mirrored left and right) -->
  <g id="C" transform="translate(780 0)">
    <use href="#axes"/>
    <!-- The two ends (59,227) and (259,227) are symmetric about x=159, the apex is (159,164) -->
    <path class="curve" d="M59 227 Q159 101 259 227"/>
    <path class="guide" d="M159 164 V227"/>
    <text class="tick" x="159" y="257">t<tspan class="sub" dy="6">1</tspan></text>
    <text class="tick" x="259" y="257">t<tspan class="sub" dy="6">2</tspan></text>
    <text class="panel" x="197" y="320">C</text>
  </g>

  <!-- D: an S-shaped rising curve (concave up turning concave down, the velocity is zero at t₂) -->
  <g id="D" transform="translate(1170 0)">
    <use href="#axes"/>
    <path class="curve"
      d="M59 227
         C91 224 122 207 143 182
         C153 169 157 152 164 133
         C176 103 196 80 221 69
         C237 62 252 62 266 62"/>
    <path class="guide" d="M159 147 V227"/>
    <path class="guide" d="M266 62 V227"/>
    <text class="tick" x="159" y="257">t<tspan class="sub" dy="6">1</tspan></text>
    <text class="tick" x="266" y="257">t<tspan class="sub" dy="6">2</tspan></text>
    <text class="panel" x="197" y="320">D</text>
  </g>

</svg>

</body>
</html>
