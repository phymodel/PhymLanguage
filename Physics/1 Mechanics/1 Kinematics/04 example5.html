<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challenge game: one gate every 8 m</title>
<style>
  /* Figure-frame conventions: the same set as `04 example2.html` and `03 VelocityTime.html` in this folder.
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the
       window material show through. Painting a solid plate inside the page has two consequences: an off-colour
       block sits on the glass panel; and as soon as the Markdown side recognises that "the author drew a plate"
       it stops injecting the canvas (see MarkdownHtmlFigure.swift `declaresOwnPageBackground`), so the two plates
       fight each other.
     · **Size comes from the aspect ratio** — the figure frame takes its shape from this document's own viewBox
       ratio (the Markdown side reads that ratio and requires it to lie between 0.2 and 5; outside that range the
       frame degenerates to a fixed height of 240 px), the svg fills the height of the frame, and whatever is left
       at the sides is empty space. This figure has viewBox = 2040 × 420 → ratio about 4.86.
       The canvas is **deliberately much wider than the artwork**: the frame width comes from the document flow and
       the frame height = frame width ÷ ratio, so 460 units of empty space are added on the left and on the right of
       the viewBox (the artwork still occupies x = 40 → 1160) and the artwork is displayed at 1200/2040 ≈ 0.59.
       The upper bound of that padding is set by "ratio ≤ 5": widening it further means enlarging the height at the
       same time (otherwise the ratio goes out of range and the frame degenerates to 240 px), so 59 units of margin
       are left above and below as well — to shrink everything one more step, enlarge x and y together, never the
       width alone.
     · Font sizes are chosen so that the figure is still legible once scaled to 55 % of the frame width: both the
       gate names and the 8 m are set at 44.
     · Colours: the straight corridor (the two parallel lines) uses #ffb900 (the axis tier); the gates, the dimension
       lines, the gate names and the 8 m labels use #0865ff (the graph-line / moving-body tier). */
  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  .track, .gate, .dim {
    fill: none;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .track { stroke: #ffb900; stroke-width: 4.2; }   /* the two parallel sides of the straight corridor */
  .gate  { stroke: #0865ff; stroke-width: 4.2; }   /* the gates (vertical gate lines) */
  .dim   { stroke: #0865ff; stroke-width: 3.4; }   /* the 8 m dimension lines */
  text {
    font-family: Georgia, "Times New Roman", serif;
    fill: #0865ff;
    text-anchor: middle;
  }
  .gate-name { font-size: 44px; }
  .len       { font-size: 44px; }
</style>
</head>
<body>

<!-- Pairs with Example 5 of `04 DisplacementTimeRelation.md` (2015 Jiangsu Province): the straight corridor of a
     challenge game, one gate every 8 m, and all the gates open for 5 s / close for 2 s in step.

     Geometry (8 m corresponds to 225 user units, the four spans are equal, and changing the ratio would contradict
     "every 8 m"):
       canvas      x = -420 → 1620, y = -48 → 372 (the artwork only occupies x = 40 → 1160, y = 11 → 313, with 460
                   units of empty space on the left and on the right and 59 above and below, which displays the whole
                   figure at about 55 % of the frame width; widening it further requires enlarging the height at the
                   same time, otherwise the ratio passes 5 and the frame degenerates to a fixed height of 240 px)
       gate lines  x = 150, 375, 600, 825, 1050; y = 100 → 212 (sticking out of the corridor edges above and below)
       corridor    two parallel lines y = 152 and y = 172 (20 wide), x = 40 → 1160, running past the first and the
                   last gate at both ends
       dimension   hook top y = 234, bar y = 252, radius 14; each of the four spans is its own bracket and the end
                   hooks stop directly below the gate lines, so at every inner gate the hooks of the two adjacent
                   spans rise and meet in a "∨", matching the figure of the question
       the 8 m labels  baseline y = 298, centred on each span (the midpoint of two adjacent gates) -->
<svg viewBox="-420 -48 2040 420" role="img"
     aria-label="Schematic of the challenge game: gates 1 to 5 stand one after another on a straight corridor, and two adjacent gates are 8 metres apart">

  <!-- ═══════════ The straight corridor: two parallel edges running past the first and the last gate ═══════════ -->
  <path class="track" d="M40 152 H1160"/>
  <path class="track" d="M40 172 H1160"/>

  <!-- ═══════════ The gate lines and their names ═══════════ -->
  <path class="gate" d="M150 100 V212"/>
  <path class="gate" d="M375 100 V212"/>
  <path class="gate" d="M600 100 V212"/>
  <path class="gate" d="M825 100 V212"/>
  <path class="gate" d="M1050 100 V212"/>

  <text class="gate-name" x="150"  y="58">Gate 1</text>
  <text class="gate-name" x="375"  y="58">Gate 2</text>
  <text class="gate-name" x="600"  y="58">Gate 3</text>
  <text class="gate-name" x="825"  y="58">Gate 4</text>
  <text class="gate-name" x="1050" y="58">Gate 5</text>

  <!-- ═══════════ The 8 m spacing: four dimension brackets plus labels ═══════════ -->
  <!-- Span 1: gate 1 → gate 2 -->
  <path class="dim" d="M150 234 V238 Q150 252 164 252 H361 Q375 252 375 238 V234"/>
  <text class="len" x="262.5" y="298">8 m</text>

  <!-- Span 2: gate 2 → gate 3 -->
  <path class="dim" d="M375 234 V238 Q375 252 389 252 H586 Q600 252 600 238 V234"/>
  <text class="len" x="487.5" y="298">8 m</text>

  <!-- Span 3: gate 3 → gate 4 -->
  <path class="dim" d="M600 234 V238 Q600 252 614 252 H811 Q825 252 825 238 V234"/>
  <text class="len" x="712.5" y="298">8 m</text>

  <!-- Span 4: gate 4 → gate 5 -->
  <path class="dim" d="M825 234 V238 Q825 252 839 252 H1036 Q1050 252 1050 238 V234"/>
  <text class="len" x="937.5" y="298">8 m</text>

</svg>

</body>
</html>
