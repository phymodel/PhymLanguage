<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>v–t graphs of balls A and B (thrown vertically upwards, 2 s apart)</title>
<style>
  /* Figure-frame conventions: the same set as `03 VelocityTime.html`, `01 DisplacementImage.html` and
     `04 example2.html` in this folder.
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the
       window material show through. Painting a solid plate inside the page (the original artwork of the question had
       a black background) has two consequences: an off-colour block sits on the glass panel; and as soon as the
       Markdown side recognises that "the author drew a plate" it stops injecting the canvas (see
       MarkdownHtmlFigure.swift `declaresOwnPageBackground`), so the two plates fight each other.
     · **Size comes from the aspect ratio** — the figure frame takes its shape from this document's own viewBox
       ratio (the Markdown side reads that ratio and requires it to lie between 0.2 and 5; outside that range the
       frame degenerates to a fixed height of 240 px), the svg fills the height of the frame, and whatever is left
       at the sides is empty space. This figure has viewBox = 1540 × 420 → ratio about 3.67 (the same convention as
       `04 example6.html` in this folder).
       The canvas is **deliberately much wider than the artwork**: the frame width comes from the document flow and
       the frame height = frame width ÷ ratio, so 380 units of empty space are added on the left and on the right of
       the viewBox (the original canvas is still x = 0 → 780, and the artwork occupies x = 40 → 742, unchanged and
       centred), which displays the artwork at 780 / 1540 ≈ 0.51 with 380 units of white space on either side — to
       make the figure smaller still, keep widening the viewBox (e.g. x = −575, width 1930, ratio 4.60, but stay
       below the ratio limit of 5), changing only the viewBox x and width and never a coordinate inside the figure.
     · Colours: axes / tick values / axis names #ffb900 (as in the existing figures of this folder); the dashed grid
       #075bff; the graph lines and the ball letters A / B #00eaff — this tier follows the v-t figure of
       `Physics/1 Mechanics/3 Dynamics/11 example1-1.html`. The grid **must not** share the colour of the graph
       lines: the two lines of this question are parallel to each other and happen to run along the grid slant, so
       the same colour would smear them together and hide the very fact that "the two parallel lines are 2 s apart".
     · Digits are always Times New Roman (lining figures): Georgia has old-style figures, so the 3, 2 and 0 of
       30 / 20 / 10 differ in height and the numbers no longer sit on one horizontal line while being read; italic
       is reserved for mathematical symbols such as v, t and O. */
  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  .axis {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.6;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .grid {
    fill: none;
    stroke: #075bff;
    stroke-width: 2;
    stroke-dasharray: 8 8;
    stroke-linecap: round;
  }
  .curve {
    fill: none;
    stroke: #00eaff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* Axis names: the variables v / t / O are set in Georgia italic */
  .axis-name {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 26px;
  }
  /* In the formula only **variables** are italic; numbers, units (m, s) and operators are upright — this must come
     after `.axis-name`: both are class selectors, so the later one wins (placed before, it would be overridden). */
  .up {
    font-style: normal;
  }
  /* Tick values / grid readings: upright, lining figures.
     ⚠️ **No** text-anchor here — CSS outranks the presentation attributes of an element (text-anchor="end"), so
     hard-coding middle in the class would pull the right-aligned readings of the v axis back to the centre, where
     they would run over the vertical axis (measured: with middle hard-coded the bbox of "30" is 71..97, straddling
     the vertical axis at x = 96). Alignment is always left to the attribute of each <text>. */
  .tick-num {
    fill: #ffb900;
    font-family: "Times New Roman", Georgia, serif;
    font-style: normal;
    font-size: 26px;
  }
  /* The ball letters A / B are the names the question gives the balls, not variables: upright Georgia serif */
  .ball {
    fill: #00eaff;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 30px;
    text-anchor: middle;
  }
</style>
</head>
<body>

<!-- Pairs with Example 1 of `07 FreeFallFormulas.md` (2013 National Syllabus Paper, Q 2-19):
     balls A and B are thrown vertically upwards with the same initial velocity, one after the other (2 s apart), from
     points at different heights; the figure shows their two v-t lines.

     Geometry (t to the right, v upwards; 1 s = 96 units, 10 m·s⁻¹ = 72 units):
       · origin O        (96, 271)          the t axis to the right (px = 96 + 96·t), the v axis upwards (py = 271 − 7.2·v)
       · grid            vertical lines t = 1…5 (px = 192 / 288 / 384 / 480 / 576), horizontal lines v = 30 / 20 / 10 / −10
                         (py = 55 / 127 / 199 / 343), that is one cell = 1 s × 10 m·s⁻¹; the v = 0 row is the t axis
                         itself, so it gets no dashed line of its own
       · line A          (0, 30) → (4, −10), that is (96, 55) → (480, 343)
       · line B          (2, 30) → (6, −10), that is (288, 55) → (672, 343)
     What the two lines mean physically (the graph alone checks the question): v = 30 − 10t and v = 30 − 10(t − 2) —
     both slopes equal −10 m·s⁻² = −g, so the two lines are **parallel**; B is shifted 2 s to the right of A as a
     whole, which is "thrown 2 s later". A reaches its highest point (v = 0) at t = 3 s and returns to its point of
     throw at t = 6 s, while B reaches its highest point at t = 5 s and returns at t = 8 s; the figure stops at the
     v = −10 row (as the figure of the question does), and it cannot show the ground because the two points of throw
     are at different heights and the question does not give them.
     t = 2 s: A is already up at v = 10 (trapezium area 40 m) while B has just started (v = 30, displacement 0) → A
     is wrong; t = 4 s: A is "3 s up 45 m + 1 s down 5 m" = 40 m and B is "2 s up" = 40 m → B is right.
     The end of the vertical axis, y = 343, is flush with the bottom grid line; the t axis starts at x = 40 (running
     past the vertical axis a little), as in the figure of the question.
     The letters A / B sit directly below the lower ends of the two lines, at (480, 378) and (672, 378), so they
     neither cover a line nor crowd the t tick values. -->
<svg viewBox="-380 0 1540 420" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Velocity-time graph: the vertical axis is the velocity v in metres per second, the horizontal axis is the time t in seconds, and one cell of the dashed grid stands for 1 second and 10 metres per second. Ball A starts at t equals 0, v equals 30 metres per second and its graph is a straight line of slope minus 10 metres per second squared, reaching v equals minus 10 metres per second at t equals 4 seconds and its highest point at t equals 3 seconds; the graph of ball B is parallel to that of A, starts at t equals 2 seconds, v equals 30 metres per second, reaches v equals minus 10 metres per second at t equals 6 seconds and its highest point at t equals 5 seconds.">

  <defs>
    <!-- Axis arrows: the same convention as the existing figures of this folder (7×7, scaled by strokeWidth) -->
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#ffb900" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ═══════════ The dashed grid: vertical lines t = 1…5, horizontal lines v = 30 / 20 / 10 / −10 ═══════════ -->
  <path class="grid" d="M192 55 V343 M288 55 V343 M384 55 V343 M480 55 V343 M576 55 V343"/>
  <path class="grid" d="M96 55 H672 M96 127 H672 M96 199 H672 M96 343 H672"/>

  <!-- ═══════════ The axes (drawn above the grid, so the vertical axis and the t axis stay clean solid lines) ═══════════ -->
  <path class="axis" d="M96 343 V30" marker-end="url(#arrow)"/>
  <path class="axis" d="M40 271 H742" marker-end="url(#arrow)"/>
  <text class="axis-name" x="108" y="44">v<tspan class="up"> / (m·s</tspan><tspan class="up" dy="-10" font-size="17">−1</tspan><tspan class="up" dy="10">)</tspan></text>
  <text class="axis-name" x="742" y="246" text-anchor="end">t<tspan class="up"> / s</tspan></text>
  <text class="axis-name" x="84" y="298" text-anchor="end">O</text>

  <!-- ═══════════ The readings on the two axes: the v tick values are right-aligned to the left of the axis, and the
       t tick values are centred directly below the grid lines ═══════════ -->
  <text class="tick-num" x="84" y="64" text-anchor="end">30</text>
  <text class="tick-num" x="84" y="136" text-anchor="end">20</text>
  <text class="tick-num" x="84" y="208" text-anchor="end">10</text>
  <text class="tick-num" x="84" y="352" text-anchor="end">−10</text>
  <text class="tick-num" text-anchor="middle">
    <tspan x="192" y="300">1</tspan>
    <tspan x="288" y="300">2</tspan>
    <tspan x="384" y="300">3</tspan>
    <tspan x="480" y="300">4</tspan>
    <tspan x="576" y="300">5</tspan>
  </text>

  <!-- ═══════════ The two parallel graph lines: same initial velocity, same acceleration, with B shifted 2 s to the
       right ═══════════ -->
  <!-- A: thrown at t = 0, v = 30 − 10t, highest point at 3 s → v = −10 at t = 4 s -->
  <path class="curve" d="M96 55 L480 343"/>
  <!-- B: thrown at t = 2 s, v = 30 − 10(t − 2), highest point at 5 s → v = −10 at t = 6 s -->
  <path class="curve" d="M288 55 L672 343"/>

  <!-- The ball letters sit directly below the lower ends of the two lines: which is which is at the end of the line
       itself, no guessing from a colour -->
  <text class="ball" x="480" y="378">A</text>
  <text class="ball" x="672" y="378">B</text>

</svg>

</body>
</html>
