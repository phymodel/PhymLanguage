<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velocity–time graph of a train passing through a tunnel</title>
<style>
  /* Figure-frame conventions: the same set as `01 DisplacementImage.html` and
     `Physics/8 SolidStatePhysics/HCP_ca.html`.
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the
       window material show through. Painting a solid plate inside the page has two consequences: an off-colour
       block sits on the glass panel; and as soon as the Markdown side recognises that "the author drew a plate"
       it stops injecting the canvas (see MarkdownHtmlFigure.swift `declaresOwnPageBackground`), so the two plates
       fight each other.
     · **Size comes from the aspect ratio** — the figure frame takes its shape from this document's own viewBox
       ratio (the Markdown side reads that ratio and requires it to lie between 0.2 and 5; outside that range the
       frame degenerates to a fixed height of 240 px), the svg fills the height of the frame, and whatever is left
       at the sides is empty space. This figure has viewBox = 1200 × 300 → ratio 4.0.
     · Colours follow the existing figures of this folder: axes / annotations #ffb900, graph lines and the moving
       body #0865ff; the caption words use their own Georgia upright tier (Georgia has no CJK glyphs, so the
       Chinese caption of the original fell back to PingFang SC / Microsoft YaHei). */
  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  .axis {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .guide {
    fill: none;
    stroke: #ffb900;
    stroke-width: 1.4;
    stroke-dasharray: 6 6;
    stroke-linecap: round;
  }
  .dim {
    fill: none;
    stroke: #ffb900;
    stroke-width: 1.6;
    stroke-linecap: round;
  }
  .curve {
    fill: none;
    stroke: #0865ff;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .train {
    fill: none;
    stroke: #0865ff;
    stroke-width: 2.5;
    stroke-linejoin: round;
  }
  .label {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 23px;
  }
  .label-sm {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 21px;
  }
  .caption {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 23px;
    text-anchor: middle;
  }
</style>
</head>
<body>

<!-- Pairs with Example 1 of `03 VelocityTimeRelation.md` (2022 National Paper A, Q 2-15):
     the train is l long and the tunnel L long, the train decelerates at 2a and accelerates at a, and the least time
     from the start of the deceleration back to v₀ is asked for.
     (a) the scene — the nose of the train has just reached the tunnel mouth and its speed has already dropped to the
     upper limit v; the distance to be covered inside the tunnel is L + l (from the nose entering to the tail
     leaving).
     (b) the v-t graph — a broken line in three pieces: the deceleration piece with slope -2a (duration t1), the
     piece inside the tunnel with slope 0 (duration t2 = (L+l)/v), and the acceleration piece with slope a
     (duration t3). The two speed-changing pieces have the same Δv, so t3 = 2t1.
     The pixel ratio of the broken line is deliberately drawn to match the data of the question (deceleration piece
     55×55, acceleration piece 110×55, slope ratio 2:1); changing the ratio would contradict "accelerates at a,
     decelerates at 2a". -->
<svg viewBox="0 20 1200 300" role="img"
     aria-label="(a) A train passing through a tunnel: the tunnel is L long and the train l long, the nose of the train has just reached the tunnel mouth, its speed inside the tunnel may not exceed v, and the distance travelled inside the tunnel is L plus l; (b) the velocity-time graph of the train: the deceleration piece has slope minus 2a, the piece inside the tunnel has slope 0 and the acceleration piece has slope a, the three durations are t1, t2 and t3 respectively, where t2 equals (L plus l) divided by v and t3 equals twice t1">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#ffb900" stroke-width="1.2"/>
    </marker>
    <marker id="arrowRev" markerWidth="7" markerHeight="7" refX="0" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M6,0 L0,3.5 L6,7" fill="none" stroke="#ffb900" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ═══════════ (a) the train passing through the tunnel ═══════════ -->
  <text class="caption" x="290" y="50">(a) In the tunnel: speed at most v</text>

  <!-- Ground at y = 250; the tunnel: left wall x = 170 (the mouth), right wall x = 450 (L = 280), roof y = 140 -->
  <path class="axis" d="M30 250 H560"/>
  <path class="axis" d="M170 250 V140 H450 V250"/>

  <!-- The train: l = 130 long (tail at x = 40, nose at x = 170); the nose has just reached the tunnel mouth -->
  <path class="train" d="M40 190 H156 Q170 190 170 204 V218 Q170 232 156 232 H40 Z"/>
  <path class="train" d="M60 200 H76 V214 H60 Z"/>
  <path class="train" d="M90 200 H106 V214 H90 Z"/>
  <path class="train" d="M120 200 H136 V214 H120 Z"/>
  <circle class="train" cx="64" cy="240" r="10"/>
  <circle class="train" cx="146" cy="240" r="10"/>

  <!-- The speed limit v inside the tunnel -->
  <path class="axis" d="M52 180 H150" marker-end="url(#arrow)"/>
  <text class="label" x="101" y="171" text-anchor="middle">v</text>

  <!-- Tunnel length L: measured above the roof -->
  <path class="guide" d="M170 140 V95"/>
  <path class="guide" d="M450 140 V95"/>
  <path class="dim" d="M170 95 H450" marker-start="url(#arrowRev)" marker-end="url(#arrow)"/>
  <text class="label" x="310" y="86" text-anchor="middle">L</text>

  <!-- Train length l (the left extension line runs all the way down and is shared with L + l below) -->
  <path class="guide" d="M40 240 V308"/>
  <path class="guide" d="M170 250 V280"/>
  <path class="dim" d="M40 280 H170" marker-start="url(#arrowRev)" marker-end="url(#arrow)"/>
  <text class="label" x="105" y="273" text-anchor="middle">l</text>

  <!-- The distance actually travelled inside the tunnel: nose entering → tail leaving, that is L + l -->
  <path class="guide" d="M450 250 V308"/>
  <path class="dim" d="M40 308 H450" marker-start="url(#arrowRev)" marker-end="url(#arrow)"/>
  <text class="label" x="330" y="298" text-anchor="middle">L + l</text>

  <!-- ═══════════ (b) the v-t graph of the train ═══════════ -->
  <text class="caption" x="900" y="50">(b) v–t graph: slopes −2a, 0, a</text>

  <!-- Axes: origin (700, 250), the v axis up to y = 62, the t axis to x = 1150 -->
  <path class="axis" d="M700 250 V62" marker-end="url(#arrow)"/>
  <path class="axis" d="M700 250 H1150" marker-end="url(#arrow)"/>
  <text class="label" x="712" y="78">v</text>
  <text class="label" x="1140" y="276" text-anchor="middle">t</text>
  <text class="label" x="688" y="276" text-anchor="end">O</text>

  <!-- The two speed levels: v0 = 90 (normal running) and v = 145 (the limit inside the tunnel).
       The tick marks grow only on the **right** of the v axis (x = 700 → 712) — the same rule as the t ticks below:
       the vertical axis stays a clean straight line and the ticks never cross it, so once the left half is gone only
       the v0 / v labels are left on that side. The length is 12, the same height as the t ticks. -->
  <path class="axis" d="M700 90 H712"/>
  <path class="axis" d="M700 145 H712"/>
  <text class="label-sm" x="686" y="97" text-anchor="end">v<tspan dy="5" font-size="15">0</tspan></text>
  <text class="label-sm" x="686" y="152" text-anchor="end">v</text>

  <!-- Normal running (dashed): before the deceleration and after the acceleration back to v0; the stroke starts at
       the right end of the v tick, x = 712 -->
  <path class="guide" d="M712 90 H770"/>
  <path class="guide" d="M1085 90 H1140"/>

  <!-- The three pieces of the broken line: deceleration (slope −2a, t1) → constant v inside the tunnel (slope 0,
       t2) → acceleration (slope a, t3) -->
  <path class="curve" d="M770 90 L825 145"/>
  <path class="curve" d="M825 145 H975"/>
  <path class="curve" d="M975 145 L1085 90"/>

  <!-- Leader lines and t ticks for the three corner instants.
       The leaders (dashed) stop at the top of the ticks, y = 238, and the ticks (solid) grow only **above** the axis,
       y = 238 → 250 — the same rule as `01 DisplacementImage.html` in this folder: the axis stays a clean straight
       line, the ticks never cut through it, and the lower half never reaches the instant labels at y = 276. -->
  <path class="guide" d="M770 90 V238"/>
  <path class="guide" d="M825 145 V238"/>
  <path class="guide" d="M975 145 V238"/>
  <path class="guide" d="M1085 90 V238"/>
  <path class="axis" d="M770 238 V250"/>
  <path class="axis" d="M825 238 V250"/>
  <path class="axis" d="M975 238 V250"/>
  <path class="axis" d="M1085 238 V250"/>
  <text class="label-sm" x="798" y="276" text-anchor="middle">t<tspan dy="5" font-size="14">1</tspan></text>
  <text class="label-sm" x="900" y="276" text-anchor="middle">t<tspan dy="5" font-size="14">2</tspan></text>
  <text class="label-sm" x="1030" y="276" text-anchor="middle">t<tspan dy="5" font-size="14">3</tspan></text>

  <!-- Duration of the constant-speed piece inside the tunnel: t2 = (L + l)/v -->
  <path class="guide" d="M900 138 V145"/>
  <text class="label-sm" x="900" y="128" text-anchor="middle">t<tspan dy="5" font-size="15">2</tspan><tspan dy="-5"> = (L + l)/v</tspan></text>

  <!-- The two speed-changing pieces have the same Δv, and a3 = a = ½·2a, so t3 = 2t1 (written in the gap below the
       acceleration piece) -->
  <text class="label-sm" x="1030" y="205" text-anchor="middle">t<tspan dy="5" font-size="15">3</tspan><tspan dy="-5"> = 2t</tspan><tspan dy="5" font-size="15">1</tspan></text>
</svg>

</body>
</html>
