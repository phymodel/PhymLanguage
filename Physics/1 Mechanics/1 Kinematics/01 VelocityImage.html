<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Four curve graphs</title>
<style>
  /* Figure-frame conventions: the same set as `01 DisplacementImage.html` and
     `Physics/8 SolidStatePhysics/HCP_ca.html`.
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the
       window material show through. Painting a solid plate inside the page (this file used to carry
       background:#000) has two consequences: an off-colour block sits on the glass panel; and as soon as the
       Markdown side recognises that "the author drew a plate" it stops injecting the canvas (see
       MarkdownHtmlFigure.swift `declaresOwnPageBackground`), so the two plates fight each other.
     · **Size comes from the aspect ratio** — the figure frame takes its shape from this document's own viewBox
       ratio (the Markdown side reads that ratio and requires it to lie between 0.2 and 5; outside that range the
       frame degenerates to a fixed height of 240 px), the svg fills the height of the frame, and whatever is left
       at the sides is empty space. */
  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  .axis {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.2;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .curve {
    fill: none;
    stroke: #0865ff;
    stroke-width: 2.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .label {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 20px;
  }
  .panel-label {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-size: 27px;
    text-anchor: middle;
  }
</style>
</head>
<body>

<!-- Canvas: viewBox ratio = 1160 / 250 ≈ 4.64 (inside the 0.2–5 range the Markdown side accepts, otherwise the
     frame cannot take the ratio); the artwork keeps 18–33 units of white margin on every side, and A/B/C/D together
     with x / v, t and O on the axes all stay inside the frame — the old `0 0 1280 245` (ratio 5.22) had been judged
     "not a figure", so the frame degenerated to a fixed height of 240 px and the panel letters, written at y = 246
     (outside the frame), were cut off. -->
<svg viewBox="30 20 1160 250" role="img"
     aria-label="Four curve graphs A, B, C and D: A and B are x-t graphs, C and D are v-t graphs">
  <defs>
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#ffb900" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- A：x-t -->
  <g transform="translate(0,0)">
    <path class="axis" d="M71 190 V45" marker-end="url(#arrow)"/>
    <path class="axis" d="M71 190 H220" marker-end="url(#arrow)"/>
    <text class="label" x="77" y="53">x</text>
    <text class="label" x="210" y="211">t</text>
    <text class="label" x="59" y="208">O</text>
    <path class="curve" d="M72 189 C95 180,123 167,137 148 C151 130,123 126,116 114 C109 101,139 76,160 63"/>
    <text class="panel-label" x="141" y="246">A</text>
  </g>

  <!-- B：x-t -->
  <g transform="translate(312,0)">
    <path class="axis" d="M71 190 V45" marker-end="url(#arrow)"/>
    <path class="axis" d="M71 190 H220" marker-end="url(#arrow)"/>
    <text class="label" x="77" y="53">x</text>
    <text class="label" x="210" y="211">t</text>
    <text class="label" x="59" y="208">O</text>
    <path class="curve" d="M73 188 C91 147,126 105,159 84 C184 68,202 76,196 99 C192 113,183 129,174 143"/>
    <text class="panel-label" x="141" y="246">B</text>
  </g>

  <!-- C：v-t -->
  <g transform="translate(624,0)">
    <path class="axis" d="M71 190 V45" marker-end="url(#arrow)"/>
    <path class="axis" d="M71 190 H220" marker-end="url(#arrow)"/>
    <text class="label" x="80" y="53">v</text>
    <text class="label" x="210" y="211">t</text>
    <text class="label" x="59" y="208">O</text>
    <path class="curve" d="M73 188 C89 151,108 115,127 108 C143 102,145 124,153 132 C165 145,187 127,207 107 C215 99,220 91,226 85"/>
    <text class="panel-label" x="141" y="246">C</text>
  </g>

  <!-- D：v-t -->
  <g transform="translate(936,0)">
    <path class="axis" d="M71 190 V45" marker-end="url(#arrow)"/>
    <path class="axis" d="M71 190 H220" marker-end="url(#arrow)"/>
    <text class="label" x="80" y="53">v</text>
    <text class="label" x="210" y="211">t</text>
    <text class="label" x="59" y="208">O</text>
    <path class="curve" d="M72 188 C103 171,139 148,170 124 C197 102,216 80,187 73 C166 68,127 80,105 90"/>
    <text class="panel-label" x="141" y="246">D</text>
  </g>
</svg>

</body>
</html>
