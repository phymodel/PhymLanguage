<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A small ring threaded on a smooth large ring fixed in a vertical plane: it slides from the top, and Q is the rightmost point of the large ring</title>
<style>
  /* Figure-frame conventions: the same set as `01 example1.html`, `02 example1.html`, `09 example4-1.html` and
     `11 example1-1.html` in this folder.
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the window material show through; painting a
       solid plate inside the page makes the Markdown side recognise that "the author drew a plate" and stop injecting the canvas (MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`), and the two plates then fight each other. The original is coloured lines on white; **do not copy that background** —
       only the line artwork is carried over into this repository's palette.
     · **Size comes from the aspect ratio** — the figure frame reads the aspect ratio of this file's viewBox (which must stay within 0.2–5).
       This figure is one **whole large ring**, so the canvas is naturally square (unlike most figures in this repository, which spread sideways):
       the measured bbox of the artwork is x = 86.75 → 560.1, y = 65 → 513.25 (473 × 448, including the 6.5 stroke of the large ring and the
       6 of the small ring, plus the ink box of the Q symbol). So the viewBox is 565 × 555
       (x from 40 to 605, y from 15 to 570, ratio ≈ 1.018), leaving 46.75 / 44.9 units left and right and
       50 / 56.75 units above and below; the centroid of the artwork (323.4, 289.1) nearly coincides with the viewBox centre (322.5, 292.5).
       To make the figure smaller, keep enlarging the viewBox (write the padding only in the viewBox, never touch any artwork coordinate),
       but do not exceed the ratio limit of 5 — with height 555 the viewBox width tops out at 2775.
     · Colours (two colours — do not add a third):
         the large ring (the apparatus fixed in the vertical plane) ....................... #ffb900 (gold, the same
                                                         as "the object" in `09 example4-1.html` and
                                                         "the table + fixed pulley" in `01 example1.html`:
                                                         apparatus and supports in a figure are always gold)
         the small ring / point Q / the symbol Q ................................. #075bff (dark blue, the same
                                                         as "block P" in `01 example1.html` and
                                                         "the dynamometer" in `02 example1.html`:
                                                         the one thing in a figure that can move, and the position it marks, are dark blue)
       This problem only asks how the force the small ring exerts on the large ring changes during the descent, so the only thing to read is **one moving object (the small ring)
       and one position (Q)**, so apart from the gold of the large ring everything is one blue — the small ring and Q sharing a colour is not laziness:
       Q is exactly the position where the small ring arrives, and in one colour the two read at a glance as two moments of one story.
       The mistake to avoid is the reverse: paint the large ring blue too and the fixed apparatus and the moving ring blur into one blue circle with no way to see which is threaded on which.
     · Fonts: Q is a symbol from the problem and uses Georgia / Times New Roman italic (consistent with `.sym` in this repository);
       the size is written in the <text>'s font-size attribute, never in the class (or CSS would override the attribute).
     ★ **No force or angle annotation is added to the figure** — the question asks at which point the force is greatest or least,
       and drawing N, mg or a θ would print the solution on the figure; the original gives only three things — small ring, large ring and Q —
       and only those three are drawn here. The vertical line tangent to the large ring is not drawn either: the position of Q (the rightmost point)
       already says it is the point of tangency, and a tangent line would add one more construction line to explain. */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* The large ring: a gold circle, hollow and unfilled (a ring is wire, not a disc); round line caps do nothing on a closed path,
     and stroke-linejoin: round keeps corners out when the path is not a perfect circle */
  .hoop {
    fill: none;
    stroke: #ffb900;
    stroke-width: 6.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* The small ring: a small hollow circle, a **full turn** (in the original it is a whole ring), its centre exactly on the highest point of the large ring —
     the small ring rides on the line of the large ring, which passes through its hole.
     Its stroke is half a step heavier than the large ring's (7 : 6.5): on the side where the small ring must sit **in front** of the gold line it has to cover the whole 6.5-wide gold band,
     and at the same width or thinner a thread of gold would leak out beside the blue circle and look like a mistake.
     ★ "Which is in front" is not hinted at by putting a gap in the small ring (a gap means a broken ring, and its width would then have to be fudged against the gold band),
       but by **a three-layer stack**: gold (full circle) → blue (full circle) → gold (a short front arc at the left crossing, see the
       second .hoop path in the <svg>). The two crossings where the rings interlock therefore go one in front and one behind, and both rings stay whole. */
  .ringlet {
    fill: none;
    stroke: #075bff;
    stroke-width: 7;
    stroke-linecap: round;
  }
  /* Point Q: a small solid dot whose centre falls exactly on the rightmost point of the large ring (the point of tangency with the vertical line) */
  .q-dot {
    fill: #075bff;
    stroke: none;
  }
  /* The symbol Q: italic serif, directly right of point Q, its baseline slightly below the height of tangency (so the optical centre of the glyph sits on that point) */
  .q-label {
    fill: #075bff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
  }
</style>
</head>
<body>

<!-- Pairs with "Example 1" of `10 ConservationOfMechanicalEnergy.md` (2024 National Paper A, Q 2-17): a smooth large ring is fixed in a vertical plane,
     a small ring of mass m is threaded on it and slides freely from rest at the top, past Q, to the bottom; Q is the point of tangency of the vertical line with the large ring.
     The question: how does the magnitude of the force the small ring exerts on the large ring change during the descent (answer C: it first decreases then increases).
     The figure draws only "the apparatus + the starting position of the small ring + the position Q"; the trend of the force is never drawn (see the ★ at the end of the stylesheet).

     Geometry (1 unit ≈ 1 layout point):
       large ring     centre O(300, 300), radius R = 210 (diameter 420), gold, stroke 6.5
                  top (300, 90), bottom (300, 510), rightmost (510, 300), leftmost (90, 300)
       small ring       centre = the **top** of the large ring (300, 90), radius r = 22, blue, stroke 7, a **full circle**
                  ★ The centre must fall exactly on the line of the large ring: that way the line of the large ring passes through the hole of the small ring,
                    which reads as "threaded on the ring". Drawing the small ring entirely outside (its centre above the line) means hanging on a hook;
                    drawing it as a solid dot (the radius-8 tier) makes it a marker stuck on the ring, and both lose the act of threading.
                  ★ r = 22 ≈ R/9.5, matching the proportion of the original (there the outer diameter of the small ring is about 1/9 of the diameter of the large one);
                    any larger and it looks like a two-ring device, a large ring with a small one beside it.
                  ★ Stacking order (three layers, later drawn = in front): gold full circle → blue full circle → short gold arc.
                    The centre of the small ring lies on the gold line, so **the two centrelines intersect twice** —
                    at (278.03, 91.15) and (321.97, 91.15) (intersecting the two centrelines as circles: ±21.97 horizontally,
                    1.15 below the top rather than exactly 3 o'clock / 9 o'clock, because of the curvature), and these two points are where "who covers whom" is decided:
                      ① first gold pass: the whole large ring (<circle class="hoop">)
                      ② blue: the whole small ring on top of the gold line — so at the **right crossing** the gold line slips behind the small ring (and disappears)
                      ③ second gold pass: the large ring is drawn again over that short stretch at the **left crossing** (270 → 286, arc length 16 units)
                         — this arc goes back on top of the blue circle, so at the left crossing the gold line is again in front of the small ring (and visible)
                    One in front (left) and one behind (right) is what really interlocks the rings; and both rings remain whole,
                    not the stopgap of "a blue ring with a piece missing" — in the gap method a wide gap looks like a broken ring and a narrow one leaves the gold line stuck on the line caps,
                    and no adjustment is as clean as this short front arc.
                  ★ Why the front arc runs 270 → 286: at the height of the crossings the blue circle covers x ∈ [274.5, 281.5]
                    (outer radius 25.5 / inner radius 18.5, crossings at y = 91.15). The arc overhangs by 4.5 units at each end,
                    and with round caps (radius 3.25) its two ends land on **gold that is already there**
                    (on the large ring outside on the left, on the gold inside the hole on the right), so gold on gold shows no seam;
                    conversely, if the arc were short enough for the caps to land on the blue circle, two semicircular "cut ends" would show.
                  ★ The stroke must satisfy blue 7 > gold 6.5: on the right the blue covers the gold, and a hairline thinner would leak a gold line above and below the band.
       starting position   the small ring starts from rest at the top — that is where it sits on the figure, the "configuration at t = 0",
                  with no arrow and no trajectory arc (the problem states in words that it "slides freely past Q to the bottom",
                  and a trajectory arc would hint the "first decreases then increases" answer as a path)
       point Q       centre = the **rightmost point** of the large ring (510, 300), solid, radius 8
                  ★ Why the rightmost point: the problem says "Q is the point of tangency of the vertical line with the large ring" — such a vertical line
                    can only touch at the leftmost or the rightmost point, and the problem also says the small ring passes Q on its way "down to the bottom",
                    so the rightmost point is taken (the route being top → right half → bottom).
                    The radius 8 keeps the dot visible with a 6-wide ring line across it (the dot being heavier than the line);
                    anything under 4 is swallowed by the ring line.
       symbol Q     Georgia italic "Q", x = 528 (just right of point Q, 10 units of clearance),
                  baseline y = 314 (= the tangency y + 14; half the x-height of a 44 px glyph puts the optical centre exactly on the point).
                  ★ The symbol stays on the right and off the ring: on the ring it would pile up with point Q and the ring line,
                    and the reader could not tell whether Q marks the point or that stretch of arc.

     Four traps to avoid when drawing this:
       ① never put the centre of the small ring outside the large one (the easiest mistake is "centre = top − r", which looks threaded
          but is really riding on top); the centre is on the line at (300, 90);
       ② never drop Q in the middle of a quarter arc — it is the **rightmost point**, level with the centre (y = 300),
          not the 45° point; move it and the "the force first decreases then increases" reading shifts with it;
       ③ never add N / mg / θ or the vertical line: see the ★ at the end of the stylesheet;
       ④ the interlocking rests on **one crossing in front, one behind**: do not forget the short front arc, and do not add it at both ends.
          Add the short gold arc only at the left crossing (the right crossing is left to the blue circle), and only then do the two crossings go one in front, one behind;
          at both ends the gold line would run flat over the small ring and never pass through it; at neither end it would hide entirely behind it. -->

<svg viewBox="-500 15 1800 555" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A smooth large ring is fixed in a vertical plane, and a small ring is threaded on its highest point: the line of the large ring passes in front of the small ring on the left and behind it on the right, so the two rings interlock; the small ring starts sliding from rest. The rightmost point of the large ring is labelled Q, the point of tangency of the vertical line with the large ring, and the small ring will slide past Q to the bottom.">

  <!-- the large ring: centre (300, 300), radius 210, fixed in the vertical plane -->
  <circle class="hoop" cx="300" cy="300" r="210"/>

  <!-- The small ring: a full circle whose centre falls on the top of the large ring (300, 90) — the line of the large ring passes through its hole, which reads as "threaded on the ring".
       Drawn **after** the large ring: the blue circle therefore covers the gold line, and at the right crossing the gold line slips behind the small ring. -->
  <circle class="ringlet" cx="300" cy="90" r="22"/>

  <!-- The second gold pass (the front arc): it fills in only this short stretch at the left crossing so the gold line comes back in front of the small ring on the left —
       one in front, one behind the blue circle above, and only then do the rings interlock. The path lies on the centreline of the large ring
       (centre (300,300), R = 210), from (270, 92.154) along the top of the circle to the right, to (286, 90.467), spanning 4.4°.
       Its round caps (radius 3.25) land on gold that is already there (the left end on the large ring, the right end on the gold inside the hole),
       so gold on gold shows no seam; the blue circle covers x ∈ [274.5, 281.5] at the height of the crossings, and this arc overhangs 4.5 units at each end,
       exactly covering that stretch of blue. Measure these two things before changing the length — do not go by feel. -->
  <path class="hoop" d="M270 92.154 A210 210 0 0 1 286 90.467"/>

  <!-- Point Q: the rightmost point of the large ring (510, 300), i.e. the point of tangency with the vertical line -->
  <circle class="q-dot" cx="510" cy="300" r="8"/>

  <!-- The symbol Q: just right of point Q, italic serif, with its baseline 14 below the point so the optical centre is level with it -->
  <text class="q-label" x="528" y="314" font-size="44">Q</text>

</svg>

</body>
</html>
