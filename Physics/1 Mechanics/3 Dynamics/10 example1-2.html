<title>The forces on the small ring at P: gravity mg resolved into the radial mg cosθ towards the centre and the tangential mg sinθ</title>
<style>
  /* Figure-frame conventions: the same set as `10 example1-1.html` (the apparatus figure of this problem) and `09 example4-2.html` (a force diagram)
     in this folder.
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the window material show through.
     · **Size comes from the aspect ratio** — the figure frame reads the aspect ratio of this file's viewBox. The skeleton of this figure (the large ring) is the same as in the apparatus figure
       `10 example1-1.html` **exactly**: centre O(300, 300), radius R = 210, and the radius of the small ring is still r = 22
       (this figure does not draw the small ring itself — see ★ below). The two figures **appear side by side in one problem**, so if each cropped its viewBox to its own artwork bbox,
       the same large ring would show at two different sizes across them — so this figure simply reuses the frame of the apparatus figure,
       width 1565 and height 555 (viewBox = -460 23 1565 555); both figures then share one scale and the ring does not change size between them.
       The measured bbox of this figure's artwork is x 86.75 → 560.15, y 86.75 → 513.25 (473 × 427, including the 6.5 stroke of the large ring,
       the two radius-8 points P and Q and four symbols), centred in that frame: 547 / 545 units left and right and
       64 / 65 units above and below — the generous padding is the price of "one scale for both figures", not a measurement error.
     · Colours (a division of labour among three colours — do not add a fourth):
         the large ring (the apparatus) + the vertical / radial dashed lines, the arc and symbol of θ ............ #ffb900 (gold)
         the two position points P and Q with their symbols, and the gravity mg on the small ring ............. #075bff (dark blue)
         the two components of mg, and the two dashed lines that close the parallelogram ........ #00eaff (cyan)
       This division follows the same convention as `09 example4-2.html`: **gold = pure geometry** (axes, radii, arcs, angle names),
       **dark blue = forces that really act on the body** (the normal force at P is exactly zero here, so the only blue force is mg),
       **cyan = quantities produced by the resolution** (neither the components nor the closing lines are given by the problem; they are derived).
       This figure also has blue points P and Q — the same convention as the blue Q in the apparatus figure `10 example1-1.html`
       ("the small ring's storyline" is blue: the P it is at now, the Q it is heading for, and the mg acting on it).
       The mistakes to avoid are the reverse: paint the components blue and the figure shows "three forces acting on the small ring", so the reader takes
       mg cosθ and mg sinθ for two independent forces and writes a three-unknown equation; paint the radial dashed line cyan and
       the radius (geometry) and the radial component (a derived quantity) blur into one line, hiding the fact that the component lies along the radius.

     ★ Why this figure can show only one force, mg (not written on the figure but here): P is defined as the position where the normal force is zero
       — combining mg cosθ − F_N = m v²/R with ½mv² = mgR(1 − cosθ) gives F_N = mg(3cosθ − 2),
       so F_N = 0 when cosθ = 2/3. Hence at P the large ring exerts **no** force on the small ring, which feels only gravity;
       the radial component mg cosθ serves entirely as the centripetal force (exactly the mg cosθ = m v²/R of the solution),
       and the tangential component mg sinθ keeps the ring accelerating downwards. Drawing an F_N at P would contradict the definition of P itself.

     Geometry (1 unit ≈ 1 layout point, in the same coordinate system as the apparatus figure):
       large ring: centre O(300, 300), radius R = 210; top (300, 90), rightmost point (510, 300), which is Q
       point P   taken at the **exact position** for cosθ = 2/3: P = O + R(sinθ, −cosθ) with sinθ = √5/3
              → P = (300 + 210×0.745356, 300 − 210×0.666667) = (456.52, 160)
              ★ Do not place it by rounding θ to 48.2° — rounding leaves the parallelogram 0.4 units short of closing,
                and the component lengths measured off the figure would no longer be exactly mg·cosθ and mg·sinθ.
              ★ Only a small solid point is drawn (radius 8, like point Q in the apparatus figure) and **not the small ring itself**: the four arrows and auxiliary lines
                all start at P, and a radius-22 circle would bury every one of those starts; the apparatus figure already shows what the small ring looks like.
       θ       the vertical dashed line O → top (300, 96): θ is measured from the **vertical**, so the dashes run from O upwards to the inner wall of the ring;
               the radial dashed line O → P; the arc has centre O and radius 48, running clockwise from (300, 252) to (335.78, 268), spanning 48.19°
               the symbol θ sits near the bisector at r ≈ 76 → (325, 228); closer to the arc it would hit the radial line, further out it leaves the ring
       gravity mg points vertically down from P, 120 units long; it sets **the one scale** (1 unit = mg/120):
                 mg ................ 120 units = mg
                 mg cosθ (radial) ..... 80 units = 120 × 2/3        → tip (396.90, 213.33), pointing at the centre
                 mg sinθ (tangential) ..... 89.44 units = 120 × √5/3    → tip (516.15, 226.67), pointing towards the Q side
               The two components close exactly: (396.90, 213.33) + 89.44×(cosθ, sinθ) = (456.52, 280) = the tip of mg ✓
                               (516.15, 226.67) + 80×(−sinθ, cosθ) = (456.52, 280) = the tip of mg ✓
               ⇒ the two cyan arrows and mg form a **strictly closed rectangle** (radial ⊥ tangential, with sides mg·cosθ and mg·sinθ)
       The closing dashed lines (cyan, width 2.2, dashed): from the radial tip to the mg tip and from the tangential tip to the mg tip.
               ★ Both must be drawn: a figure closes itself when all four sides are components (as in `09 example4-2.html`),
                 but here there are only two components, and without them "mg is the resultant of these two" cannot be seen.
               ★ They must be one step thinner than the component arrows (2.2 < 3.2) and dashed — otherwise the reader counts "four cyan arrows".
       Symbol positions (four of them, with clearances computed from measured getBBox in the browser; the tightest is Q against its own point at 10.0 —
       the same convention as the Q symbol in `10 example1-1.html`. Re-measure if a size or an arrow moves):
           P (487.8, 132) italic 44 ....... outside point P (upper right), 17.3 from it and entirely outside the ring
           Q (528, 314)   italic 44 ....... in the same place as the Q symbol of `10 example1-1.html`, 10.0 from point Q
           mg (425, 308)  italic 34 ....... outside the tip of mg (lower left), 21.3 from the closing dashed line
           θ  (325, 228)  italic 34 ....... near the bisector, 18 outside the arc, 15.6 from the vertical dashes and 24.8 from the radial dashes
       The size is written in each <text>'s font-size attribute, never in the class (or CSS would override the attribute).

     Things the figure does not show, and should not show:
       · the small ring itself (the radius-22 blue circle): see ★ above — it would bury the starts of the four arrows at P.
       · an arrow for the velocity v: v is along the tangent at P, exactly like the tangential component mg sinθ, so the two arrows would lie on one line;
         and the speed formula (v² = 2gR(1 − cosθ)) belongs to the solution.
       · the normal force F_N: it is exactly zero at P, and drawing it would deny the definition of P (see ★ above).
       · the numbers 48.2°, cosθ = 2/3, v² = ⋯ and the answer: only symbols appear on the figure, numbers belong to the problem and the solution.
       · positions beyond the large ring (the small ring at the top, the trajectory arc): the apparatus figure `10 example1-1.html` already has them.

     The quantitative relations behind the reading (recorded here so a later edit can check them; they do not appear in the figure):
       · radial: mg cosθ − F_N = m v²/R, and F_N = 0 at P ⇒ mg cosθ = m v²/R
       · energy: ½ m v² = mgR(1 − cosθ) ⇒ v² = 2gR(1 − cosθ)
       · together ⇒ cosθ = 2/3, θ = 48.19°; of the 120 units of mg on the figure, the radial arrow is 80 = 120×2/3 ✓
       · at a general position: F_N = mg(3cosθ − 2) ⇒ the magnitude of the force = mg|3cosθ − 2|: mg at the top → 0 at P → 5mg at the bottom
       · reading direction: the tangential arrow must **point towards the Q side (along the descent)** — the speed is increasing, so the tangential acceleration
         is along the velocity; drawn towards the top, it is backwards. */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* The large ring: a gold circle, hollow and unfilled (a ring is wire, not a disc) */
  .hoop {
    fill: none;
    stroke: #ffb900;
    stroke-width: 6.5;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* The vertical and radial auxiliary dashes: the thinnest, stating only which two lines θ is measured between */
  .guide {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.2;
    stroke-dasharray: 10 8;
    stroke-linecap: round;
  }
  /* The angle arc: a geometric annotation, on the dashed-line convention */
  .angle-arc {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.8;
    stroke-linecap: round;
  }
  /* The centre: a small solid dot marking the vertex of θ */
  .o-dot {
    fill: #ffb900;
    stroke: none;
  }
  /* The two points P and Q: solid, in the colour of the small ring ("the small ring's storyline" is dark blue) */
  .pos-dot {
    fill: #075bff;
    stroke: none;
  }
  /* The gravity acting on the small ring: the only real force here, one step heavier */
  .force {
    fill: none;
    stroke: #075bff;
    stroke-width: 4.2;
    stroke-linecap: round;
  }
  /* The two components: one step thinner, derived quantities, so they do not outweigh the real force */
  .comp {
    fill: none;
    stroke: #00eaff;
    stroke-width: 3.2;
    stroke-linecap: round;
  }
  /* The two dashed lines closing the parallelogram: thinner than the components and dashed, so they are not counted as a third and fourth component */
  .comp-close {
    fill: none;
    stroke: #00eaff;
    stroke-width: 2.2;
    stroke-dasharray: 9 7;
    stroke-linecap: round;
  }
  /* Symbols: italic serif; gold = geometry, dark blue = forces and position points */
  .geo-label {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
  }
  .pos-label {
    fill: #075bff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
  }
  .force-label {
    fill: #075bff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
  }
</style>

<!-- The **second figure of the solution** of "Example 1" in `10 ConservationOfMechanicalEnergy.md` (2024 National Paper A, Q 2-17):
     `10 example1-1.html` draws the apparatus of the problem (the large ring + the small ring at rest at the top + the position Q),
     while this figure draws the first step of the solution — "at P the small ring feels only gravity; resolve mg into radial and tangential parts":
     the radial arrow is 80 units = mg cosθ towards the centre (all of it serving as the centripetal force),
     and the tangential arrow is 89.44 units = mg sinθ along the descent (keeping the ring accelerating).
     Part (2)'s mg cosθ = m v²/R and the mathematical basis of "first decreases then increases" both read off this figure at a glance. -->

<svg viewBox="-500 23 1800 555" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="A smooth large ring fixed in a vertical plane, with centre O. The small ring has slid down to P, whose position is marked by the angle θ between the radius OP and the vertical, with cosθ equal to two thirds. At P the normal force from the large ring on the small ring is exactly zero, so the small ring feels only gravity mg (one blue arrow pointing vertically down). mg is resolved into radial and tangential parts: the radial component mg times cosine θ points along the radius towards the centre O (a cyan arrow about two thirds of the length of mg), and the tangential component mg times sine θ points along the ring towards the Q side (a cyan arrow along the descent); two cyan dashed lines together with the two component arrows complete the parallelogram of which mg is the diagonal. Q is the rightmost point of the large ring, the point of tangency of the vertical line with the large ring.">

  <defs>
    <!-- Every arrow needs its own arrowhead (7×7, scaled by strokeWidth), each in the colour of its shaft -->
    <marker id="arrowForce" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#075bff" stroke-width="1.2"/>
    </marker>
    <marker id="arrowComp" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#00eaff" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ═══════════ the apparatus: same coordinate system and same radius as the apparatus figure (one scale for both) ═══════════ -->

  <circle class="hoop" cx="300" cy="300" r="210"/>

  <!-- ═══════════ geometry: the vertical and radial dashed lines (drawn first, covered by the arrows) ═══════════ -->

  <!-- The vertical: θ is measured from this line, which runs from O up to the inner wall of the ring -->
  <path class="guide" d="M300 300 V96"/>
  <!-- The radius OP: the other side of θ; its outer part is covered by the radial component (the component lies exactly on the radius, one of the reading points of this figure) -->
  <path class="guide" d="M300 300 L456.52 160"/>

  <!-- ═══════════ the angle arc and the centre ═══════════ -->

  <path class="angle-arc" d="M300 252 A48 48 0 0 1 335.78 268"/>
  <circle class="o-dot" cx="300" cy="300" r="5"/>

  <!-- ═══════════ the two dashed lines closing the parallelogram (thinner than the components, so they are not counted as four components) ═══════════ -->

  <path class="comp-close" d="M396.90 213.33 L456.52 280"/>
  <path class="comp-close" d="M516.15 226.67 L456.52 280"/>

  <!-- ═══════════ the two components: the same scale as mg ═══════════ -->

  <!-- mg cosθ: 120 × 2/3 = 80, from P along the radius towards the centre O -->
  <path class="comp" d="M456.52 160 L396.90 213.33" marker-end="url(#arrowComp)"/>
  <!-- mg sinθ: 120 × √5/3 = 89.44, from P along the tangent towards the Q side (the descent) -->
  <path class="comp" d="M456.52 160 L516.15 226.67" marker-end="url(#arrowComp)"/>

  <!-- ═══════════ the real force: the normal force at P is zero, so only gravity remains ═══════════ -->

  <!-- mg: vertically down, 120 units long (the scale reference of this figure) -->
  <path class="force" d="M456.52 160 V280" marker-end="url(#arrowForce)"/>

  <!-- ═══════════ the position points: P (the point analysed here) and Q (the point of tangency in the problem) ═══════════ -->

  <circle class="pos-dot" cx="456.52" cy="160" r="8"/>
  <circle class="pos-dot" cx="510" cy="300" r="8"/>

  <!-- ═══════════ symbols ═══════════ -->

  <text class="pos-label" x="487.8" y="132" font-size="44" text-anchor="middle">P</text>
  <text class="pos-label" x="528" y="314" font-size="44" text-anchor="start">Q</text>
  <text class="force-label" x="425" y="308" font-size="34" text-anchor="end">mg</text>
  <text class="geo-label" x="325" y="228" font-size="34" text-anchor="middle">θ</text>

</svg>
