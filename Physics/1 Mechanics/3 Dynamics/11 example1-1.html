<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Graph of the function</title>
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}
body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    overflow: hidden;
}
svg {
    height: 100%;
    width: auto;
    max-width: 100%;
}
.axis {
    stroke: #ffb900;
    stroke-width: 3.5;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.tick {
    stroke: #ffb900;
    stroke-width: 3;
    stroke-linecap: round;
}
.dashed {
    stroke: #075bff;
    stroke-width: 3;
    stroke-dasharray: 7 6;
}
.curve {
    stroke: #00eaff;
    stroke-width: 3;
    stroke-linecap: round;
    stroke-linejoin: round;
    fill: none;
}
.yellow {
    fill: #ffb900;
    font-family: "Times New Roman", Georgia, serif;
    font-style: italic;
}
.blue {
    fill: #075bff;
    font-family: "Times New Roman", Georgia, serif;
}
.upright {
    font-style: normal;
}
</style>
</head>
<body>
<!-- The frame shape = the aspect ratio of this file's viewBox (which is what MarkdownHtmlFigure / doc.html read),
     and the frame width = the width of the document flow, so the padding can only be written in the viewBox:
       · left and right: the viewBox runs from -60 to 886 → about 100 units of blank on each side (it used to be 39 / 72);
       · between the two panels: panel (b) is translated by (90 0), widening the gap from 49 to 139 units.
     No content coordinate moved; only the outer ring of the canvas was widened — the aspect ratio 946/270 ≈ 3.5 still lies inside the valid 0.2–5 range. -->
<svg viewBox="-60 0 946 270" xmlns="http://www.w3.org/2000/svg">

    <!-- panel (a): the left coordinate system -->
    <g>
        <path class="axis" d="M68 190 V30 M68 190 H345"/>
        <path class="axis" d="M60 39 L68 29 L75 39 M335 182 L345 190 L335 197"/>

        <!-- horizontal-axis ticks -->
        <path class="tick" d="M127 183 V190 M198 183 V190 M260 183 V190 M324 183 V190"/>

        <!-- the vertical blue dashed lines -->
        <path class="dashed" d="M173 61 V190 M233 61 V190"/>

        <!-- The graph: zero resistance over 0–t₁, where the line coincides with the horizontal axis (cyan) → rising over t₁–t₂ → level after t₂ -->
        <path class="curve" d="M68 190 H173 L233 84 H331"/>

        <!-- axis labels -->
        <text class="yellow" x="39" y="49" font-size="29">f</text>
        <text class="yellow" x="48" y="218" font-size="30">O</text>
        <text class="yellow" x="329" y="175" font-size="25">t<tspan class="upright">/s</tspan></text>
        <text class="yellow upright" x="304" y="218" font-size="29">2.0</text>

        <!-- the t1 and t2 marks -->
        <text class="blue" x="155" y="216" font-size="26" font-style="italic">t<tspan font-size="19" dy="5" font-style="normal">1</tspan></text>
        <text class="yellow upright" x="181" y="217" font-size="27">1.0</text>
        <text class="blue" x="228" y="216" font-size="26" font-style="italic">t<tspan font-size="19" dy="5" font-style="normal">2</tspan></text>

        <!-- panel name -->
        <text class="blue" x="182" y="261" font-size="27">Fig. (a)</text>
    </g>

    <!-- panel (b): the right coordinate system (the whole group shifted right by 90 to separate it from panel (a)) -->
    <g transform="translate(90 0)">
        <path class="axis" d="M419 187 V30 M419 187 H696"/>
        <path class="axis" d="M411 39 L419 29 L426 39 M686 179 L696 187 L686 194"/>

        <!-- horizontal-axis ticks -->
        <path class="tick" d="M477 180 V187 M543 180 V187 M608 180 V187 M668 180 V187"/>

        <!-- the vertical blue dashed lines -->
        <path class="dashed" d="M521 56 V187 M580 56 V187"/>

        <!-- axis labels -->
        <text class="yellow" x="394" y="43" font-size="29">v</text>
        <text class="yellow" x="402" y="216" font-size="30">O</text>
        <text class="yellow" x="679" y="174" font-size="25">t<tspan class="upright">/s</tspan></text>
        <text class="yellow upright" x="650" y="217" font-size="29">2.0</text>

        <!-- the t1 and t2 marks -->
        <text class="blue" x="506" y="214" font-size="26" font-style="italic">t<tspan font-size="19" dy="5" font-style="normal">1</tspan></text>
        <text class="yellow upright" x="529" y="215" font-size="27">1.0</text>
        <text class="blue" x="574" y="214" font-size="26" font-style="italic">t<tspan font-size="19" dy="5" font-style="normal">2</tspan></text>

        <!-- panel name -->
        <text class="blue" x="536" y="261" font-size="27">Fig. (b)</text>
    </g>

</svg>
</body>
</html>
