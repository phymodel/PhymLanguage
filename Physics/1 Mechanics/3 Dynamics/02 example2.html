<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The a–t graph for an elevator moving upward (overweight and weightlessness)</title>
<style>
  /* Figure-frame conventions: the same set as `02 example1.html`, `01 example1.html`–`01 example7.html`,
     `11 example1-1.html` and `1 Kinematics/07 example1.html` (the only gridded figure).
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the window material show through; painting a
       solid plate inside the page makes the Markdown side recognise that "the author drew a plate" and stop injecting the canvas (MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`), and the two plates then fight each other. The original is a grid on black; **do not copy that background** —
       only the coordinate system and the graph line are carried over into this repository's palette.
     · **Size comes from the aspect ratio** — the figure frame reads the aspect ratio of this file's viewBox (which must stay within 0.2–5).
       This figure is a graph-paper coordinate system of 10 s across and 5 m·s⁻² up; the artwork spans
       x = 138 → 1263 (from the left of the reading column beside the vertical axis to the right of the t-axis arrow) and y = 226.6 → 795.6 (from the top of the axis label to the row of horizontal-axis readings),
       which is naturally wide (1125 × 569 ≈ 1.98), so the viewBox is 1200 × 606 (ratio = 1.980,
       the same order as the wide format of `1 Kinematics/04 example6.html`):
       x from 100 to 1300 (38 / 37 left and right), y from 208 to 814 (18.6 / 18.4 above and below).
       The centroid of the artwork (700.5, 511.1) coincides with the viewBox centre (700, 511).
       To make the figure smaller, keep widening the viewBox (write the padding only in the viewBox, never touch any artwork coordinate),
       but do not exceed the ratio limit of 5 — with height 606 the viewBox width tops out at 3030.
     · Colours (three colours — do not add a fourth):
         axes / axis labels a, t / the reading at the origin / all tick values ................. #ffb900 (gold).
                                   In this repository gold means "explanatory ruler marks", as with the magnifier ellipse
                                   and leader of `02 example1.html`, the angle arc of `01 example4.html` and the dimension lines of example7.
         the fine grid of the graph paper ............................................ #075bff (dark blue, dashed).
                                   The same convention as `.grid` in `1 Kinematics/07 example1.html`.
         the a–t graph line .................................................. #00eaff (cyan).
                                   In this repository cyan means "a quantity obtained by measurement or analysis" (the a–m graph lines
                                   of example1, s₁–s₅ of example5, the x–v curve of example7,
                                   the two v–t lines of 1 Kinematics/07 example1.html): here a(t) is exactly the quantity measured.
                                   ★ The grid must not share the colour of the graph line — part of the line here lies exactly on the row a = 0,
                                     and in the same colour you cannot tell which stretch is the line and which is graph paper.
     · Fonts: mathematical symbols such as a, t, O use Georgia italic; tick values and units (m, s, digits) are always **upright**
       (Times New Roman lining figures, as with `.tick-num` in 09 example1), so inside every axis label the unit is
       wrapped in an `.up` tspan — a unit must never be slanted along with the variable.
     ★ **The extreme points must not be marked on the figure** — the question is "when is the pressure greatest / smallest", and drawing dashed lines at t = 2 s and t = 8.5 s
       and writing aₘ = 2 / −3 would erase the reading point. The figure keeps only the graph paper, the two axes, the ticks and one a(t) curve,
       and the student reads the abscissas of the peak and the trough off the grid (the −3 to 2 tick values on the vertical axis must be given, since that is the reading convention). */
  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* Axes: one step thinner so the grid lines do not compete with them */
  .axis {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.8;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* Graph paper: a fine dashed grid (one vertical line per 1 s, one horizontal line per 1 m·s⁻²); the row a = 0 is the t axis itself and is not drawn twice */
  .grid {
    fill: none;
    stroke: #075bff;
    stroke-width: 2;
    stroke-dasharray: 8 8;
    stroke-linecap: round;
  }
  /* the a–t graph line */
  .curve {
    fill: none;
    stroke: #00eaff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* Axis labels a / t: variables use Georgia italic */
  .axis-name {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 26px;
  }
  /* Inside an axis label only the **variables** are italic; digits, units (m, s) and operators are upright — this rule must come after `.axis-name`
     because both are class selectors and the later one wins (placed earlier it would be overridden). */
  .up {
    font-style: normal;
  }
  /* Tick values: upright, lining figures.
     ⚠️ text-anchor is deliberately **not** set here — CSS outranks presentation attributes on the element (text-anchor="end"),
     so a hard-coded middle in the class would drag the right-aligned readings of the vertical axis back to the centre and their right ends would cross onto the axis.
     Alignment always belongs to each <text>'s own attribute. */
  .tick-num {
    fill: #ffb900;
    font-family: "Times New Roman", Georgia, serif;
    font-style: normal;
    font-size: 26px;
  }
</style>
</head>
<body>

<!-- Pairs with "Example 2" of `02 OverweightAndWeightlessness.md` (2015 Jiangsu Province, Q 2-6): a person rides an elevator up, and
     the graph of the acceleration a against time t during the vertical ascent; with vertically upward as the positive direction for a, the question is when the pressure of the person on the floor is
     greatest / smallest. The figure = one a–t sheet of graph paper + one curve that is positive, then negative, with a flat zero stretch in between. The figure carries no answer.

     Geometry (1 unit ≈ 1 layout point):
       · origin (t = 0, a = 0)   (180, 480)     the t axis to the right (px = 180 + 100·t), the a axis upwards (py = 480 − 90·a)
       · extent of the graph paper            t = 0 → 10 s (px = 180 → 1180), a = 2 → −3 m·s⁻² (py = 300 → 750)
                               i.e. one cell is 1 s × 1 m·s⁻²; 5 cells vertically and 10 horizontally, as in the original
       · vertical grid lines              t = 1…10 (px = 280 / 380 / … / 1180), y = 300 → 750;
                               **no dashed line at t = 0** — it is the a axis itself
       · horizontal grid lines              a = 2 / 1 / −1 / −2 / −3 (py = 300 / 390 / 570 / 660 / 750), x = 180 → 1180;
                               **no dashed line at a = 0** — it is the t axis itself
       · the axes                the a axis x = 180, y = 775 → 268 (arrow at the top); the t axis y = 480, x = 180 → 1255
                               the a axis reaches 25 further down (past the a = −3 row) and the t axis 75 further right (past the t = 10
                               column) — as in the original: an axis must run past the outermost grid line so the arrow does not butt against the grid
       · vertical-axis readings 2 / 1 / 0 / −1 / −2 / −3   right-aligned at x = 166, baseline = that tick's y + 9 (half the x-height of a 26 px glyph,
                               for optical centring); the "0" faces the a = 0 row and is the vertical-axis reading
       · horizontal-axis readings 0 / 2 / 4 / 6 / 8 / 10     ★ they sit on **the lower edge of the bottom row of grid lines** (baseline y = 790),
                               centred directly under their own vertical grid line — the old rule for graph-paper coordinate systems: the horizontal axis runs through the middle of the sheet
                               while the readings are set along the lower edge, keeping the cells in between clean. An earlier version put them under the a = 0 axis
                               (y = 514), and every digit ended up sliced by a vertical grid line while interfering with the cells of the
                               lower half, so they were moved to a row outside the paper.
                               Exception, "0": right-aligned at x = 168 (the a axis runs right beneath it, so centring it would split the glyph),
                               sitting one row below the "−3" of the vertical axis — the bottom-left corner of the original has two 0s, one above the other, so do not merge them

     The five stretches of the a(t) curve (the problem gives only the ascent, so the curve runs from t = 0 to t = 10):
       ① 0 → 2 s   a rises smoothly from 0 to +2 (the peak) with horizontal tangents at both ends — the "accelerating upward" stretch as the elevator starts,
                  where a and the pressure are greatest (overweight, F_N = m(g + a));
       ② 2 → 4 s   a falls smoothly from +2 back to 0 with horizontal tangents at both ends;
       ③ 4 → 7 s   a flat stretch with a ≡ 0 — rising at constant velocity, F_N = mg (neither overweight nor weightless);
       ④ 7 → 8.5 s a falls smoothly from 0 to −3 (the trough) with horizontal tangents at both ends — the decelerating ascent. The trough is **deeper and steeper** than the peak
                  (270 units deep over 150 wide, against 180 over 200 for the peak), and the original is asymmetric in exactly this way: the downward
                  maximum acceleration 3 m·s⁻² exceeds the upward 2 m·s⁻², so the pressure is smallest at t = 8.5 s;
       ⑤ 8.5 → 10 s a returns smoothly from −3 to 0 — the deceleration ends and the elevator comes to rest.
       All the stretches use cubic Béziers with horizontal tangents at both ends — an acceleration graph is **differentiable** at these points,
       and drawing sharp corners (a polyline) would suggest the acceleration jumps. After t = 4 s the curve **coincides exactly** with the a = 0 stretch,
       so stretch ④ must leave the horizontal axis only at x = 880 (t = 7 s); leaving earlier would not match the original. -->

<svg viewBox="-200 208 1800 606" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Graph of the acceleration against time: the vertical axis is the acceleration a in metres per second squared, positive upwards, with ticks from −3 to 2; the horizontal axis is the time t in seconds, from 0 to 10; each cell of the grid stands for 1 second and 1 metre per second squared. The curve starts at t = 0 with a = 0, rises to a maximum of +2 at t = 2 s, then falls back to zero at t = 4 s and stays zero along the horizontal axis until t = 7 s; after that it turns negative and reaches its minimum of −3 at t = 8.5 s, then rises again and returns to zero at t = 10 s.">

  <defs>
    <!-- Axis arrows: same convention as the existing figures in this folder (7×7, scaled by strokeWidth) -->
    <marker id="arrow" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#ffb900" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ═══════════ graph paper: vertical lines t = 1…10, horizontal lines a = 2 / 1 / −1 / −2 / −3 ═══════════
       (no lines at a = 0 or t = 0: they are the two axes themselves) -->
  <path class="grid" d="M280 300 V750 M380 300 V750 M480 300 V750 M580 300 V750 M680 300 V750 M780 300 V750 M880 300 V750 M980 300 V750 M1080 300 V750 M1180 300 V750"/>
  <path class="grid" d="M180 300 H1180 M180 390 H1180 M180 570 H1180 M180 660 H1180 M180 750 H1180"/>

  <!-- ═══════════ the axes (drawn above the grid so the a and t axes stay clean solid lines) ═══════════ -->
  <path class="axis" d="M180 775 V268" marker-end="url(#arrow)"/>
  <path class="axis" d="M180 480 H1255" marker-end="url(#arrow)"/>

  <!-- Axis labels: a /(m·s⁻²) for the vertical axis at the upper right of the arrow; t /s for the horizontal axis right-aligned against the arrow -->
  <text class="axis-name" x="200" y="252">a<tspan class="up"> /(m·s</tspan><tspan class="up" dy="-10" font-size="17">−2</tspan><tspan class="up" dy="10">)</tspan></text>
  <text class="axis-name" x="1240" y="452" text-anchor="end">t<tspan class="up"> /s</tspan></text>

  <!-- ═══════════ vertical-axis readings: 2 / 1 / 0 / −1 / −2 / −3, right-aligned left of the a axis ═══════════ -->
  <text class="tick-num" x="166" y="309" text-anchor="end">2</text>
  <text class="tick-num" x="166" y="399" text-anchor="end">1</text>
  <text class="tick-num" x="166" y="489" text-anchor="end">0</text>
  <text class="tick-num" x="166" y="579" text-anchor="end">−1</text>
  <text class="tick-num" x="166" y="669" text-anchor="end">−2</text>
  <text class="tick-num" x="166" y="759" text-anchor="end">−3</text>

  <!-- ═══════════ horizontal-axis readings: 0 / 2 / 4 / 6 / 8 / 10, set on the lower edge of the bottom row of grid lines
       (the "0" is right-aligned left of the vertical axis: the a axis runs right beneath it, so centring it would split the glyph) ═══════════ -->
  <text class="tick-num" x="168" y="790" text-anchor="end">0</text>
  <text class="tick-num" x="380" y="790" text-anchor="middle">2</text>
  <text class="tick-num" x="580" y="790" text-anchor="middle">4</text>
  <text class="tick-num" x="780" y="790" text-anchor="middle">6</text>
  <text class="tick-num" x="980" y="790" text-anchor="middle">8</text>
  <text class="tick-num" x="1180" y="790" text-anchor="middle">10</text>

  <!-- ═══════════ the a–t graph line: from the origin → peak (+2) at t = 2 s → zero at t = 4 s → flat until t = 7 s
       → trough (−3) at t = 8.5 s → zero at t = 10 s. Every stretch has horizontal tangents at both ends (the acceleration is differentiable, not a polyline) ═══════════ -->
  <path class="curve" d="M180 480
                         C246 480 314 300 380 300
                         C446 300 514 480 580 480
                         H880
                         C930 480 980 750 1030 750
                         C1080 750 1140 480 1180 480"/>

</svg>
</body>
</html>
