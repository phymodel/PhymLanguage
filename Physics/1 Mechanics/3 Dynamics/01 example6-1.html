<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One ball at each end of a light string with a constant force F acting at its midpoint (top view) — the configuration when the balls are 3L/5 apart</title>
<style>
  /* Figure-frame conventions: the same set as `01 example1.html`–`01 example5.html`, `11 example1-1.html` and
     `1 Kinematics/07 example1.html`.
     · The page **carries no background colour** — iOS / visionOS use a glass theme, so the figure must let the window material show through; painting a
       solid plate inside the page makes the Markdown side recognise that "the author drew a plate" and stop injecting the canvas (MarkdownHtmlFigure.swift
       `declaresOwnPageBackground`), and the two plates then fight each other. The original figure is gold lines on black; **do not copy that background** —
       only the line artwork is carried over into this repository's palette.
     · **Size comes from the aspect ratio** — the figure frame reads the aspect ratio of this file's viewBox (which must stay within 0.2–5).
       This figure is a small **top-view** apparatus (one light string folded into a V + two small balls + one horizontal force arrow);
       the artwork spans x = 122 → 437, y = 131 → 349 (getBBox measured in the browser: 315 × 218.5, already wider than tall),
       so the viewBox is 520 × 372 (ratio = 1.398, the same league as 1.40 in `01 example4.html`):
       x from 20 to 540 (102.1 / 102.9 left and right), y from 54 to 426 (76.9 / 76.5 above and below).
       The centroid of the artwork (279.6, 240.2) differs from the viewBox centre (280, 240) by only 0.4 / 0.2, so the figure looks centred.
       To make the figure smaller, keep widening the viewBox (write the padding only in the viewBox, never touch any artwork coordinate),
       but do not exceed the ratio limit of 5 — with height 372 the viewBox width tops out at 1860.
     · Colours (two colours — do not add a third):
         light string / the two balls / force arrow F / symbols m, F ..... #075bff (the same
                                                          "string / block P" of `01 example1.html` and the
                                                          "blocks / spring / force arrow" of `01 example3.html`: moving parts are always dark blue,
                                                          and a symbol shares the colour of its own artwork)
         the arc of θ + the dashed axis of symmetry + the symbol θ .... #ffb900 (the same
                                                          "arc and symbol of the angle θ" of `01 example4.html`: a geometric annotation follows the axis-label convention)
       There is no "fixed apparatus" to draw here (the table is left out, as in the original — see below), so gold carries a single geometric annotation;
       the cyan of this repository (#00eaff, used for "results obtained by measurement or analysis", such as the a–m graph lines of example1 or
       s₁–s₅ of example5) has no foothold here — the figure has neither graph lines nor measured quantities.
     · Fonts: m, F, θ are symbols from the problem or the analysis and use Georgia italic (consistent with `.part-label` in this repository).
       This figure contains no digits, so the upright Times tier is not used (as in example5's treatment of digits). */

  body {
    background-color: transparent;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
  }
  svg {
    height: 100%;
    width: auto;
    max-width: 100%;
  }
  /* Light string / the two balls / force arrow: one dark blue for the "moving parts" family */
  .part {
    fill: none;
    stroke: #075bff;
    stroke-width: 3.4;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  /* Axis of symmetry (the line of action of F extended to the left of the string midpoint): dashed, a geometric annotation, one step thinner so it does not compete with solid lines */
  .axis-dashed {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.4;
    stroke-dasharray: 8 6;
    stroke-linecap: round;
  }
  /* The arc of the angle θ: a geometric annotation, one step thinner */
  .angle-arc {
    fill: none;
    stroke: #ffb900;
    stroke-width: 2.6;
    stroke-linecap: round;
  }
  /* Symbols on the figure, m (the mass of a ball) / F (the constant force): given by the problem, each in the colour of its artwork */
  .part-label {
    fill: #075bff;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 34px;
  }
  /* The symbol θ (the angle between the string and the direction of F): a geometric annotation, in the colour of the arc */
  .angle-name {
    fill: #ffb900;
    font-family: Georgia, "Times New Roman", serif;
    font-style: italic;
    font-size: 34px;
  }
</style>
</head>
<body>

<!-- Pairs with "Example 6" of `01 NewtonsSecondLaw.md` (2022 National Paper B, Q 2-15):
     an inextensible light string has a small ball of mass m tied to each end; the whole system rests on a **smooth horizontal table**,
     the distance between the balls equals the string length L, and a constant horizontal force of magnitude F acts at the **midpoint of the string**, perpendicular to the line joining the balls.
     The question: what is the acceleration of each ball when they are 3L/5 apart (answer a = 5F/8m).

     The figure shows exactly that instant (the balls 3L/5 apart) as a **top view**:
     the line of sight runs perpendicularly down onto the table — so "up/down" on the canvas is a direction within the table, not the vertical;
     "left/right" is the line of action of F. The line joining the balls is vertical on the canvas and strictly perpendicular to F (as given),
     which needs no right-angle mark and reads at a glance.

     Geometry (1 unit ≈ 1 layout point; the string length L is taken as 300 on the figure):
       · string midpoint A (= the point of action of F)   (300, 240)
       · upper / lower ball        centre (180, 150) / (180, 330), r = 15
                                    **Equally large** — both balls have mass m, so the figure must not show a size difference
                                    (the same treatment as "the two blocks of equal mass" in `01 example3.html`)
       · half strings MA = MB = 150, direction (∓0.8, ±0.6); the light string runs from the ball surface at (192, 159) through the fold A to the ball surface
         at (192, 321) — the two halves are **equal in length** and fold into a V only at A, and **both balls lie on the same vertical line**:
         F is perpendicular to the line joining the balls and the system starts from rest ⇒ the motion is left–right symmetric throughout, both balls keep the same x,
         and neither can cross to the other side of the axis of symmetry
       · separation of the balls = 330 − 150 = 180 = 3/5 × 300 ✓ — the same configuration as "when they have moved until they are 3L/5 apart"
       · distance from each ball to the axis of symmetry (y = 240) = 90 = 3L/10; horizontal distance from each ball to A = 120 = 2L/5
         ⇒ sin θ = 90/150 = 3/5、cos θ = 120/150 = 4/5，θ ≈ 36.87°
         (the angle in the figure is therefore drawn as 36.87°, **not** 45°: tan θ = 90/120 = 0.75)
       · the force F   from A (300, 240) horizontally right to (430, 240), arrow tip pointing right; the symbol F is written **below and to the right**
                  of the tip at (424, 288) — the same place as in the original: it is empty there, so it neither sits on the shaft nor overlaps the string or a ball
       · the angle θ   vertex A, radius 72: the start (228, 240) lies on the axis of symmetry and the end (242.4, 196.8) on the
                  upper half of the string, sweeping 36.87°; the centre of the θ glyph lies in the gap bounded by the axis, the upper string and the arc
                  (around 205, 208, on the angle bisector, ≈ 100 from the vertex); by bbox it is 13.6 from the arc,
                  10.5 from the upper string and 12.5 from the axis — it touches none of the three lines (measurements below),
                  moving it further out would leave "this angle", and moving it further in would hit the string
       · axis of symmetry   the dashed segment from (222, 240) to A: it is the extension of the line of action of F to the left of A,
                  first, it gives the arc of θ somewhere to stand (otherwise the arc floats with nothing to measure from),
                  and second, it draws "the two balls are symmetric about this line" outright

     Things the figure does not show, and **should not** show:
       · no table, ground or hatching: the problem says "on a smooth horizontal table", yet the original figure gives only three things — string, balls, F —
         because this is a top view. A "table front edge + hatching" would immediately be read as a side view (gravity downwards,
         balls pressing on the board) and would misdraw a problem that lives in a smooth horizontal plane. The top view is stated by the aria-label and this note.
       · no L, 3L/5 or F_T labels: the original figure has no dimension lines, and adding them invites a second reading — "given in the figure but not in the text";
         the correspondence between L, 3L/5 and the coordinates is recorded in the geometry above, so an edit can simply check those three lines.
       · no numeric value of θ (36.87° / sin θ = 3/5): the number is computed from the two given lengths, and on the figure it would become
         "a condition given by the figure" (the same reason `01 example4.html` writes no 30° / 60°).
       · no free-body force arrows on the balls (the string tension along the string, no other horizontal force) and no acceleration arrows: the problem gives the apparatus only,
         and the whole reading point is one piece of geometry, the angle between the string and F; drawing F_T and a as well would turn the apparatus figure into
         a free-body diagram and hide what the figure is asking.

     The quantitative relations behind the reading (recorded here so a later edit can check them; they do not appear in the figure):
       · half string L/2 = 150, each ball 3L/10 = 90 from the axis ⇒ sin θ = 3/5, cos θ = 4/5 (θ ≈ 36.87°)
       · along F at the midpoint of the string (which is massless): F = 2 F_T cos θ = 2 F_T · (4/5) ⇒ F_T = 5F/8
       · each ball feels only the string tension (the table is smooth, no second force within the horizontal plane), and the acceleration **points along the string towards the midpoint**:
         a = F_T / m = 5F/(8m) ⇒ A is correct
       · consistency check: the component of each ball's acceleration along F is
         a cos θ = (5F/8m)(4/5) = F/(2m), exactly the F/(2m) obtained by treating the two balls as one body;
         equal half strings and equal masses mean "left–right symmetric on the figure" and "the two accelerations are equal" are one and the same thing. -->

<svg viewBox="-480 54 1520 372" xmlns="http://www.w3.org/2000/svg" role="img"
     aria-label="Top view: two small balls of equal mass (each labelled m) lie one above the other, joined by a light string of equal halves that is pulled into a V at the middle; a constant force F to the right acts at the midpoint of the string, perpendicular to the line joining the balls. The balls are now three fifths of the string length apart, and the angle between the string and the direction of F is labelled θ.">

  <defs>
    <!-- Force arrow: same convention as the existing figures in this folder (7×7, scaled by strokeWidth), with the stroke in the moving-parts dark blue -->
    <marker id="arrowForce" markerWidth="7" markerHeight="7" refX="5.5" refY="3.5"
            orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#075bff" stroke-width="1.2"/>
    </marker>
  </defs>

  <!-- ═══════════════════ the light string: two equal halves folded into a V at the midpoint A ═══════════════════ -->
  <!-- Both ends stop on the ball surfaces (the centre ± the radius along the half-string direction (0.8, 0.6) lands on (192, 159) / (192, 321)),
       leaving no gap and not poking into a ball -->
  <path class="part" d="M192 159 L300 240 L192 321"/>

  <!-- ═══════════════════ the axis of symmetry: the line of action of F extended to the left of A (dashed) ═══════════════════ -->
  <!-- The left end at 222 reaches 6 further out than the arc start at 228, so the arc falls on the dashed line rather than beyond its end, and is read as
       "an angle measured from this line" -->
  <path class="axis-dashed" d="M222 240 H300"/>

  <!-- ═══════════════════ the angle θ: axis of symmetry ↔ upper half of the string ═══════════════════ -->
  <!-- vertex A (300,240), r = 72: the start (228,240) is on the axis of symmetry and the end (242.4,196.8) on the upper half of the string,
       sweeping arcsin(3/5) ≈ 36.87°. The centre of the θ glyph (205, 208) lies on the angle bisector between the arc and the vertex:
       the wedge is only 36.87° wide, so moving the glyph towards the string would hit it (measured bbox: 10.5 from the upper string, 13.6 from the arc, 12.5 from the axis). -->
  <path class="angle-arc" d="M228 240 A72 72 0 0 1 242.4 196.8"/>
  <text class="angle-name" x="205" y="220" text-anchor="middle">θ</text>

  <!-- ═══════════════════ the two balls: equally large (both of mass m) ═══════════════════ -->
  <!-- Hollow circles, as in the original: the wall is stroked and the centre left blank, and the string starts at the ball surface; both balls lie on the vertical line x = 180,
       330 − 150 = 180 = 3L/5 apart -->
  <circle class="part" cx="180" cy="150" r="15"/>
  <circle class="part" cx="180" cy="330" r="15"/>

  <!-- The symbol m: written to the left of each ball, vertically centred, in the ball's colour, with its right end 13 units clear of the ball surface -->
  <text class="part-label" x="152" y="162" text-anchor="end">m</text>
  <text class="part-label" x="152" y="342" text-anchor="end">m</text>

  <!-- ═══════════════════ the constant force F: acting at the midpoint of the string, horizontally to the right ═══════════════════ -->
  <!-- The shaft starts at A (the problem says "acts at the midpoint of the light string", so it is drawn from the fold, not pulling from a ball) and runs to (430,240);
       the symbol F is written below and to the right of the tip, as in the original -->
  <path class="part" d="M300 240 H430" marker-end="url(#arrowForce)"/>
  <text class="part-label" x="424" y="288" text-anchor="middle">F</text>

</svg>

</body>
