<!-- Pairs with part (1) of "Example 1" in `11 MomentumTheorem.md` (2019 National Paper II, Q 3-25): sketch the v–t graph qualitatively.

     This file is a copy of "Fig. (b)" from the problem (the coordinate system, the ticks, the two vertical dashed lines at t₁ / t₂, and the labels v / O / t/s /
     1.0 / 2.0 are unchanged, letter for letter), and only the **cyan graph line** the answer needs is added inside the frame:

       0 ~ t₁  horizontal — during the reaction time the resistance is zero, the car still travels at v₁, slope 0;
       t₁ ~ t₂ a curve — the braking system comes on, the resistance grows linearly from 0 to f₁ and a = f/m grows from 0,
                so the tangent of the graph turns from horizontal to steeper and steeper (concave down) and reaches v₂ at t₂;
       after t₂ a straight run — the resistance stays f₁, a is constant and the slope does not change; at 2.0 s the car is nowhere near stopping,
                so the graph is still well above the t axis and leaves the right edge of the frame (ending at x = 696).

     **The graph must not touch the t axis.** With v₂ = 28 m/s and a = 8 m/s², another 3.5 s from t₂ = 1.3 s is needed, so the car stops at t = 4.8 s;
     the horizontal axis is labelled only to 2.0 s, so "crossing the t axis" lies outside this frame entirely: at 2.0 s, v = 28 − 8 × 0.7 = 22.4 m/s,
     about 0.75 v₁. Part (1) asks only for the sketch up to "after the braking system works steadily", so the stop never had to be drawn.
     (An older version ran down to (678,187) on the t axis, which declared a stop at t ≈ 2.08 s and contradicted 4.8 s; fixed.)

     Only the qualitative shape is drawn, with no numbers: the horizontal ticks stop at 2.0 s while the car really stops at 4.8 s, so the deceleration in this frame is
     compressed and drawn steeper, dropping to about 0.35 v₁ at the right edge (truly it is still 0.75 v₁ at 2.0 s). Precisely because it is compressed horizontally,
     the drop from v₁ → v₂ is drawn as 18 units in the frame (the true ratio is only 30 → 28, i.e. 8.7 units, 6.7%), otherwise the curved stretch
     would shrink into an invisible kink — a blow-up of about 2.06; the final slope is enlarged by the **same factor** (0.281 → 0.578),
     so the shape is of the same kind as the real one, merely compressed horizontally. The slope is still continuous across the three stretches (the end tangent of the curve equals the slope of the straight run):
       horizontal (419,56) → (521,56); curve Q(548.8 56) → (580,74); straight run → (696,141),
       whose slope is (141 − 74)/(696 − 580) = 67/116 ≈ 0.578, which is exactly why the `Q` control point is 548.8 = 580 − 18/0.578.
     The end of the last stretch (696,141) is still 46 units from the t axis and passes about 26 units above the `t/s` label (without covering it).
     The curved stretch is a quadratic Bézier of the same kind as v = v₁ − ½a(t − t₁)² (horizontal tangent at the start, ending tangent joining the straight run).
     (The group translate (90 0) is inherited from the original; move both together if the coordinate system changes.)

     Figure-frame conventions (the same set as `11 example1-1.html` and `1 Kinematics/03 VelocityTime.html`):
       · the page carries no background colour — the figure must let the window material show through; once the Markdown side recognises that "the author drew a plate" it injects no canvas
         (see `declaresOwnPageBackground` in MarkdownHtmlFigure.swift);
       · **Size comes from the height** — the frame shape is the aspect ratio of the figure document's own viewBox (which must lie within 0.2–5,
         beyond which it degrades to a fixed 240px height); the svg fills the frame height and whatever is left over at the sides is blank;
       · so "large blank margins" can only be written in the viewBox: the drawing itself spans only x 484 ~ 793 (about 309 wide),
         and here the bounds are pushed out to 131 / 1146 — 353 units on each side, 1.14 times the width of the drawing
         (previously 230 / 1046, leaving 254 on each side, i.e. 0.82 times; this version adds about 100 more on each side, with the horizontal
         centre staying at 638.5 and both sides growing equally, so the drawing is never pushed to one side);
         vertically only 20 is left above and below (y from −3 to 287, just centring the content 17 ~ 267),
         so the padding does not shrink the drawing. The ratio 1015 / 290 = 3.5 (from 816 / 290 ≈ 2.81) matches the frame shape of
         `11 example1-1.html` (946 / 270 ≈ 3.5). Widen further and the viewBox ratio limit must be watched
         (5, `figureDocumentAspect` in `doc.html`, beyond which it degrades to a fixed 240px height), and some headroom kept:
         the larger the ratio the flatter the frame and the smaller the drawing inside it. -->
<svg viewBox="131 -3 1015 290" role="img"
     aria-label="Velocity–time graph drawn in the coordinate system of Fig. (b): from 0 to t1 a horizontal stretch standing for constant velocity; from t1 to t2 a curve whose slope grows from zero, standing for a resistance increasing linearly while the speed falls from v1 to v2; after t2 a straight inclined line of constant slope standing for uniform deceleration (the car only stops at about 4.8 seconds, so at 2.0 seconds the graph is still above the time axis and has not crossed it)">

    <g transform="translate(90 0)">
        <path class="axis" d="M419 187 V30 M419 187 H696"/>
        <path class="axis" d="M411 39 L419 29 L426 39 M686 179 L696 187 L686 194"/>

        <!-- horizontal-axis ticks -->
