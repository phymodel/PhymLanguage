<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>几何图形绘制</title>
    <style>
        body {
            background-color: transparent;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        svg {
            /* 由高度定尺：图形占满图框高度（图框形状由 viewBox 比例给出），左右多出来的就是真空格 */
            height: 100%;
            width: auto;
            max-width: 100%;
        }
        .line-solid {
            stroke: #ff9d47; /* 橙色实线 */
            stroke-width: 2.5;
            fill: none;
        }
        .line-dashed {
            stroke: #ff9d47; /* 橙色虚线 */
            stroke-width: 2.5;
            stroke-dasharray: 8, 8; /* 虚线样式 */
            fill: none;
        }
        .label {
            fill: #ff9d47; /* 橙色文字 */
            font-family: Arial, sans-serif;
            font-size: 28px;
            font-style: italic; /* 斜体，更像手写 */
        }
    </style>
</head>
<body>

  <!-- 3:1 画布：左右各留 512.5、上下各约 20 个单位，图形正好落在正中 -->
  <svg viewBox="-512.5 -20 1500 500" xmlns="http://www.w3.org/2000/svg">

    <g>

      <!-- 实线部分: 三角形 ABC -->
      <polygon points="250,60 100,400 400,400" class="line-solid" />

      <!-- 虚线部分: 内部线条 -->
      <g class="line-dashed">
        <line x1="250" y1="60" x2="250" y2="355" />
        <!-- B–O–F 三点共线，合并为一条虚线（O、F 为线上的点） -->
        <line x1="100" y1="400" x2="340" y2="328" />
        <line x1="100" y1="400" x2="300" y2="280" />
        <line x1="250" y1="60" x2="300" y2="280" />
        <line x1="300" y1="280" x2="400" y2="400" />
      </g>

      <!-- 文本标签 -->
      <g class="label">
        <text x="240" y="45">A</text>
        <text x="75" y="435">B</text>
        <text x="390" y="435">C</text>

        <text x="260" y="382">O</text>

        <text x="270" y="275">D</text>
        <text x="335" y="320">F</text>
      </g>

    </g>

  </svg>

</body>
</html>
